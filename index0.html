     excepciones por gesto. Lección barata (CRITERIOS-DISENO §4.9): una
     prueba de aislamiento que rompe el caso normal no aísla nada, lo
     enmascara. */
  const SOLO_AL_TOCAR = params.get('dial') === 'tap';
  tira.addEventListener('scroll', () => {
    if (SOLO_AL_TOCAR) return;
    /* [index0] Y TAMPOCO MIENTRAS DURA UN EFECTO.
       Reportado: *"en el efecto de la pantalla que se gira, el preset que
       sortea no permanece: despues del efecto vuelve solo al default"*.

       MEDIDO con los cuatro efectos (Chromium, muestreando localStorage y los
       eventos de scroll de la tira):
           ?egg=papelitos   0 scrolls   guarda 'fantasma'   la piel QUEDA
           ?egg=matrix      0 scrolls   guarda 'fantasma'   la piel QUEDA
           ?egg=estatica    0 scrolls   guarda 'fantasma'   la piel QUEDA
           ?egg=giro        2 scrolls   guarda ''           LA PIEL SE PIERDE

       El giro es el UNICO que mueve la tira al terminar --gira la caja entera
       con rotateY y despues la reacomoda--, y ese desplazamiento dispara este
       manejador. `aplicar(bajoLaAguja(), true)` toma la marca que quedo bajo
       la aguja --"hoy", o sea ninguna piel--, llama a `limpiarFantasma()` y
       ademas GUARDA `entresijo:skin = ''`. O sea que no solo se pierde en
       pantalla: se borra el hallazgo.

       `rodando` ya cubre el tiron del gesto, pero no el efecto que viene
       despues. `en-efecto` es la clase que marca exactamente esa ventana --se
       pone al empezar cualquier efecto y se saca 3,4 s despues de terminar--,
       asi que es la guarda que faltaba.

       Tocar una marca sigue funcionando: eso va por el manejador de `click`,
       que es otro camino y es el modo deliberado de salir de una piel del
       easter egg. */
    if (!listo || pendiente || rodando || app.classList.contains('en-efecto')) return;
    pendiente = true;
    requestAnimationFrame(() => { pendiente = false; aplicar(bajoLaAguja(), true); develar(); });
  }, { passive: true });

  /* Tocar una marca aplica YA y después viaja: el desplazamiento suave puede
     no completarse, y entonces tocar no hacía nada.

     ⚠️ Y LA MEMORIA SE INVALIDA ANTES DE APLICAR. Un toque es una elección
     DELIBERADA, así que tiene que aplicar siempre — incluso si es la marca que
     ya estaba bajo la aguja. Ése es el único camino para salir de una piel del
     easter egg y volver a la de esa fecha: `aplicarPiel()` deja la memoria
     apuntando a la marca bajo la aguja —a propósito, para que un scroll suelto
     no borre el hallazgo— así que sin esta línea `aplicar()` toma su atajo y
     tocar no hace NADA. Medido el 18/08 con la piel `terminal` puesta: el
     reproductor quedaba atrapado en ella y no se podía salir tocando.
     También se ignora el clic mientras la tira gira sola: ahí el dedo todavía
     está apoyado y el clic no es una elección. */
  paradas.forEach(p => p.addEventListener('click', () => {
    if (rodando || (typeof disparado !== 'undefined' && disparado)) return;
    ultimaPiel = null;
    aplicar(p, true);
    centrar(p, true);
  }));


  /* ARRASTRE CON EL MOUSE. En el teléfono el gesto lo hace el navegador, pero
     en una computadora un contenedor con scroll horizontal sólo se mueve con la
     rueda o el trackpad: arrastrarlo con el mouse NO es nativo. Sin esto, en la
     compu el dial parece trabado.
     Sólo se maneja el mouse; el táctil se deja en paz para no pelearle al
     desplazamiento nativo, que tiene inercia y es mejor que cualquier
     imitación. El imán se apaga mientras se arrastra —si no, tironea— y vuelve
     al soltar, que es lo que acomoda la marca al centro. */
  let mouseAbajo = false, xInicio = 0, scrollInicio = 0, recorrido = 0, capturado = false;
  tira.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    mouseAbajo = true; recorrido = 0; capturado = false;
    xInicio = e.clientX; scrollInicio = tira.scrollLeft;
  });
  tira.addEventListener('pointermove', e => {
    if (!mouseAbajo) return;
    const d = e.clientX - xInicio;
    recorrido = Math.max(recorrido, Math.abs(d));
    /* La captura se pide recién cuando el arrastre empezó de verdad, y NO en el
       pointerdown: con el puntero capturado desde el principio, el navegador
       dispara el clic sobre la tira en vez de sobre la marca, y tocar una piel
       dejaba de funcionar. Cuatro píxeles alcanzan para distinguir un arrastre
       de un pulso de la mano. */
    if (!capturado && recorrido > 4) {
      capturado = true;
      tira.style.scrollSnapType = 'none';
      tira.setPointerCapture(e.pointerId);
    }
    /* ⚠️ NI UNA LÍNEA MIENTRAS LA TIRA GIRA SOLA (20/08). El gesto del easter
       egg es SOSTENER, así que el dedo sigue apoyado cuando la tira se suelta:
       si el arrastre siguiera escribiendo `scrollLeft`, estaría peleándole al
       giro por la misma propiedad. Es la §4.11, pero con el propio reproductor
       del otro lado en vez del navegador. */
    if (rodando) return;
    if (capturado) tira.scrollLeft = scrollInicio - d;
  });
  ['pointerup', 'pointercancel'].forEach(ev => tira.addEventListener(ev, () => {
    if (!mouseAbajo) return;
    const hubo = capturado;
    mouseAbajo = false; capturado = false;
    if (!hubo) return;            // fue un clic: que lo maneje la marca
    /* ⚠️ Y ACÁ ESTABA EL BUG QUE HIZO QUE EL GIRO "NUNCA FRENARA" (20/08).
       Levantar el dedo a mitad del giro —que es lo normal: el gesto es
       sostener y la tira se suelta con el dedo todavía apoyado— disparaba este
       manejador, que **devolvía el imán** (`scrollSnapType = ''`) y encima
       llamaba a `centrar()`.

       Con el imán prendido, cada `scrollLeft` que escribe la curva queda
       encajado en la marca más cercana. Medido en una corrida real: **93 de
       cada 100 cuadros avanzaban exactamente un paso de marca** —35,3 px
       dentro de un día, 44,4 entre días— sin importar qué velocidad pidiera la
       curva. Por eso el giro no frenaba: cuando la curva bajaba de una marca
       por cuadro, el imán la llevaba una marca igual, hasta que se acababa la
       pista y cortaba en seco.

       Y explica por qué ninguna corrección de la curva servía: **la curva no
       estaba gobernando el movimiento.** Se ajustó el pico, el piso, la caída,
       la forma, la duración y el empalme durante horas, sobre un movimiento
       que en realidad lo dibujaba el imán del scroll.

       Mientras el giro corre, este manejador no toca nada: el cierre del giro
       ya se encarga de devolver el imán y de dejar la memoria del dial donde
       corresponde. */
    if (rodando) return;
    tira.style.scrollSnapType = '';
    const b = bajoLaAguja();
    if (b) { aplicar(b, true); centrar(b, true); }
  }));
  /* Si el mouse recorrió más que un temblor, lo que vino fue un arrastre y no
     un clic: se traga el clic para que soltar sobre otra marca no salte. */
  tira.addEventListener('click', e => {
    if (recorrido > 4) { e.stopPropagation(); e.preventDefault(); recorrido = 0; }
  }, true);

  tira.addEventListener('keydown', e => {
    const i = paradas.indexOf(document.activeElement);
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (i < 0 || !d || !paradas[i + d]) return;
    e.preventDefault();
    paradas[i + d].focus();
    aplicar(paradas[i + d], true);
    centrar(paradas[i + d], true);
  });

  /* Arranca en la piel que ya eligió aplicarFeatures() —la guardada, o la de
     fábrica— y se centra ANTES de habilitar el scroll: si no, el propio
     movimiento de centrar dispara el manejador y elige la que haya quedado
     bajo la aguja a mitad de camino. */
  function arrancar() {
    const puesta = app.dataset.skin || '';
    const inicial = paradas.filter(p => p.dataset.piel === puesta)[0]
                    || paradas[paradas.length - 1];
    centrar(inicial, false);
    /* Si lo último que se escuchó fue una frecuencia fantasma, vuelve ELLA y
       no la parada: aplicar() llama a limpiarFantasma() y borraría justo lo
       que hay que devolver. La tira igual queda en "hoy", que es de donde se
       sale al fantasma. Ver restaurarFantasma(). */
    if (!(typeof restaurarFantasma === 'function' && restaurarFantasma()))
      aplicar(inicial, false);
    setTimeout(() => { listo = true; }, 120);
  }
  if (document.readyState === 'complete') arrancar();
  else addEventListener('load', arrancar);

  /* ═════════════════════════════════════════════════════════════════
     PORTADO DESDE trabajo/boceto.html EL 18/08 POR LA SESIÓN DE LÓGICA.

     El boceto es una maqueta SIN AUDIO donde se diseñó todo esto; el CSS es
     el mismo archivo para los dos, así que este bloque tiene que ir a la par
     de `estilos5.css` — si el boceto y la hoja cambian, esto queda viejo y
     se nota como un efecto que pelea con su propio CSS.

     Cambió UNA sola cosa al portar, y está marcada en los DOS lugares donde
     ocurre —`aplicarPiel()` y el cierre del giro—: el `delete app.dataset.skin`
     pasó a `aplicarSkin(null)`, porque acá el atributo vive en <html> además
     de en #app, y hay un vúmetro que releer.
     Todo lo demás es la misma letra, comentarios incluidos: los porqués son
     cicatrices de la sesión de diseño y valen más que el código.
     ═════════════════════════════════════════════════════════════════ */
  /* ═══════════════════════════════════════════════════════════════
     LA FRECUENCIA FANTASMA — el easter egg del dial

     Tirar más allá de la última parada ("hoy") lleva a una frecuencia que
     no existe: el reproductor se va al ruido y vuelve con una piel
     inventada en el momento. El CSS y el porqué están en estilos5.css,
     sección LA FRECUENCIA FANTASMA. Acá está el comportamiento.

     Todo este bloque se puede borrar entero sin tocar nada más: el dial
     sigue funcionando igual, sólo deja de tener fondo falso.
     ═══════════════════════════════════════════════════════════════ */

  /* ── 1 · Los colores del sorteo, con reglas duras ───────────────
     La regla del azar acá no es "que salga cualquier cosa": es que salga
     cualquier cosa QUE SE PUEDA LEER. Se sortea en HSL —donde el tono es
     un número y no hay que adivinar— y se verifica el contraste real
     antes de aceptar la piel. Si no pasa, se ajusta la luminosidad hasta
     que pase. Nunca sale al aire una piel ilegible. */
  function hslARgb(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) {
      return l - a * Math.max(-1, Math.min(Math.min(k(n) - 3, 9 - k(n)), 1));
    };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }
  /* Luminancia relativa de la norma: es lo que hace que el contraste sea
     un número verificable y no una impresión. */
  function luminancia(rgb) {
    var c = rgb.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contraste(a, b) {
    var la = luminancia(a), lb = luminancia(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }
  function hex(rgb) {
    return '#' + rgb.map(function (v) {
      return ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2);
    }).join('');
  }
  var azar = function (a, b) { return a + Math.random() * (b - a); };
  var elegir = function (lista) { return lista[Math.floor(Math.random() * lista.length)]; };

  /* Sube o baja la luminosidad de un color hasta que alcance el contraste
     pedido contra el fondo. Devuelve el color ya corregido: es el paso
     que convierte "azar libre" en "azar legible". */
  function forzarContraste(h, s, l, fondo, minimo, subiendo) {
    var rgb = hslARgb(h, s, l);
    var vueltas = 0;
    while (contraste(rgb, fondo) < minimo && vueltas < 60) {
      l += subiendo ? 1.5 : -1.5;
      if (l > 97 || l < 3) break;
      rgb = hslARgb(h, s, l);
      vueltas++;
    }
    return rgb;
  }

  /* Las tipografías del sorteo: sólo las que ya están cargadas o son del
     sistema. Traer una fuente nueva por red en mitad del efecto la haría
     aparecer tarde, con la piel ya puesta, y se vería como un salto. */
  var TIPOGRAFIAS = [
    "'Inter', system-ui, sans-serif",
    "Georgia, 'Times New Roman', serif",
    "ui-monospace, Consolas, 'Courier New', monospace",
    "'Trebuchet MS', system-ui, sans-serif",
    "Impact, 'Arial Black', sans-serif",
    "'Palatino Linotype', Palatino, Georgia, serif"
  ];
  /* El nombre de lo que encontraste. No es decorativo: es lo que hace que
     la piel se sienta un HALLAZGO y no un botón de aleatorio. */
  var PREFIJOS = ['TRANSMISIÓN', 'FRECUENCIA', 'SEÑAL', 'BANDA', 'ONDA',
                  'EMISORA', 'REPETIDORA', 'PORTADORA'];

  /* ── 1b · LAS PIELES FIJAS DEL SORTEO ───────────────────────────
     No todo lo que aparece tiene que estar inventado en el momento. Una piel
     fija sale por el MISMO camino que las inventadas —se sortea, se aplica
     con `aplicarPiel()`, se guarda y se restaura al recargar— así que es una
     piel de verdad y usable: el reproductor sigue andando abajo, se toca, se
     escucha, se cambia el volumen.

     Va acá y NO en `skins5.css` por dos razones. Una: no es una versión
     histórica del reproductor, así que no le corresponde una parada del dial
     —las once paradas son fechas, y meter una que no lo es rompe lo que el
     dial significa—. Dos: el mecanismo del fantasma ya escribe variables en
     línea sobre <html>, o sea que una piel fija no necesita una sola línea
     de CSS nueva. Se ENCUENTRA, no se elige, que es la idea del easter egg.

     `terminal` verificada contra los mismos pisos de contraste que el sorteo
     al azar se autoimpone (DISENO §9.4): texto 16,7 (piso 12), señal 15,05
     (2,9), clima 8,68 (3), quiet 5,06 (2,4), identidad 4,87 (1,9). Y de paso
     cierra el agujero conocido de esa sección —el glifo del play medido
     contra `--surface` y no contra `--bg`, que el sorteo al azar no
     verifica—: da 14,14, cuando el problema era quedar bajo 3. */
  var PIELES_FIJAS = [{
    id: 'terminal',
    nombre: 'TERMINAL',
    vars: {
      '--bg':             '#050705',
      '--surface':        '#0b120c',
      '--primary':        '#1f8f3f',
      '--primary-bright': '#33ff66',
      '--text':           '#c8f5c8',
      '--text-dim':       '#4fbf6f',
      '--text-quiet':     '#3d8f55',
      '--text-faint':     '#1a2e1f',
      '--border':         '#14301c',
      '--border-soft':    '#1d4a2a',
      '--glow-rgb':       '51, 255, 102',
      /* La misma pila de la consola que usa el retrato ascii, y por la misma
         razón: son las que tienen los bloques y los bordes de caja bien
         dibujados, con `monospace` al final por si no hay ninguna. */
      '--font': "ui-monospace, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace",
      /* Sin esquinas redondeadas: una terminal no las tiene. */
      '--badge-radius': '0px',
      '--app-radius':   '0px',
      '--ls-station':   '3.0px',
      '--ls-badge':     '2.0px',
      '--breath':       '2.00s',
      '--glow-min':     '8px',
      '--glow-span':    '26px',
      '--vol-fill-hi':  '#33ff66',
      '--vol-fill-lo':  '#0f3d1f',
      '--vol-thumb':    '#33ff66',
      '--skin-nombre':  '"terminal"',
      '--skin-fecha':   '"modo consola"'
    },
    pesoMarca: 700
  }, {
    /* La compañera del retrato ascii: un monitor ámbar, que es el otro
       monocromo de la época y el que no se pisa con el verde de la matrix.
       Verificada contra los mismos pisos: texto 15,2 · señal 10,76 · clima
       6,76 · quiet 4,21 · identidad 5,02, y el play sobre su fondo 10,27. */
    id: 'ascii',
    nombre: 'ÁMBAR',
    vars: {
      '--bg':             '#070502',
      '--surface':        '#120c05',
      '--primary':        '#b0701a',
      '--primary-bright': '#ffab1f',
      '--text':           '#ffd9a0',
      '--text-dim':       '#c08a4a',

  function sortearPiel() {

       partida en dos opuestos. */

       base ya asume como excepción (1,96 y 2,99): no se pide más que eso,
       pero tampoco menos. */

    var texto = forzarContraste(tono, azar(0, 22), azar(85, 96), fondo, 12, true);

      nombre: elegir(PREFIJOS) + ' ' + Math.floor(azar(1, 999)),
      vars: {

        '--surface': hex(hslARgb(tono, satFondo, lumFondo + azar(1, 4))),

  /* Las variables de la piel sorteada se escriben como estilo EN LÍNEA

       cuadrado. Y `data-skin` no sirve: se saca a propósito unas líneas más

       históricas pisarían a la sorteada.

       parada de la que saliste no tomara el atajo de `aplicar()`. Ese motivo

       antes de aplicar, un toque deliberado siempre entra. Lo que quedaba era
       sólo el daño — con la memoria en null, CUALQUIER evento de scroll (el
       imán reacomodándose, un roce del mouse) entra a `aplicar()`, aplica la
       marca que hubiera quedado bajo la aguja y llama a `limpiarFantasma()`:

       único `scroll` sintético bajaba de 25 variables en línea a 1.

       Y esto es lo que hacía inútil la protección del final del giro, que ya
       dejaba la memoria en la marca bajo la aguja por esta misma razón: se

  /* ── 2 · Los papelitos ──────────────────────────────────────────
     Dos cañones desde abajo, hacia adentro. Física mínima —gravedad,
     rozamiento y un giro propio— porque un papelito que cae en línea
     recta se ve falso, y uno que tumbea se ve papel. */
  var lienzo = document.getElementById('efectos');
  function tirarPapelitos(colores) {
    var ctx = lienzo.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var an = window.innerWidth, al = window.innerHeight;
    lienzo.width = an * dpr; lienzo.height = al * dpr;

    ctx.scale(dpr, dpr);

       arriba también"). Tres fuentes en vez de dos:
         · los dos cañones de abajo, que ahora tiran más fuerte y más alto
         · una lluvia desde arriba de la pantalla, que entra escalonada
       Son 380 papelitos contra 140. El costo es de dibujo, no de
       maquetación —todo pasa adentro del canvas—, así que sube el trabajo
       por cuadro pero no obliga a recalcular la página. */
    var trozos = [];
    [[an * 0.10, 1], [an * 0.90, -1]].forEach(function (canon) {

          /* Hacia arriba y hacia adentro, con apertura: un cañón de

          vx: canon[1] * azar(2, 9) + azar(-2, 2),
          vy: azar(-27, -16),
          an: azar(4, 12), al: azar(6, 17),
          giro: azar(0, Math.PI * 2), vgiro: azar(-0.35, 0.35),
          color: elegir(colores), vida: 1
        });
      }
    });

       altura, no toda en la misma línea: así entra de a poco y no como un
       telón que baja. Cae más lento que lo que sale disparado —no la tiró
       nadie, sólo está cayendo. */

        an: azar(4, 11), al: azar(6, 15),
        giro: azar(0, Math.PI * 2), vgiro: azar(-0.25, 0.25),
        color: elegir(colores), vida: 1

    var t0 = performance.now();
    (function cuadro(t) {
      var dt = Math.min(32, t - t0) / 16.7; t0 = t;
      ctx.clearRect(0, 0, an, al);

      trozos.forEach(function (p) {

           cortara la fiesta. */

  /* ── 2b · La caída (Matrix) ─────────────────────────────────────

     El truco de la estela: en vez de borrar el cuadro, se pinta encima un

  function caidaMatrix(alTerminar) {
    var ctx = lienzo.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var an = window.innerWidth, al = window.innerHeight;
    lienzo.width = an * dpr; lienzo.height = al * dpr;
    lienzo.style.width = an + 'px'; lienzo.style.height = al + 'px';
    ctx.scale(dpr, dpr);
    lienzo.classList.add('activo');

    var cuerpo = 15, columnas = Math.ceil(an / cuerpo);
    /* Katakana, dígitos y algo de latín: la mezcla es lo que da la textura
       de "idioma que no se lee". Con puros números se ve como un reloj. */
    var GLIFOS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ENTRESIJO';
    var gotas = [];
    for (var i = 0; i < columnas; i++) {
      /* Arrancan repartidas ARRIBA de la pantalla, no todas en cero: si
         largan juntas se ve una cortina que baja, no lluvia. */
      gotas.push({ y: azar(-45, 0), v: azar(0.5, 1.5) });
    }

    var t0 = performance.now(), inicio = t0, cambio = false;
    (function cuadro(t) {
      var dt = Math.min(32, t - t0) / 16.7; t0 = t;
      var pasado = t - inicio;

      /* LA LLUVIA ENTRA DE A POCO (18/08). Antes pintaba la estela a .085
         desde el primer cuadro, y como esa capa negra se ACUMULA, a los
         ~600 ms ya tapaba el reproductor entero: los elementos caían
         detrás de una cortina opaca, así que se veía "llueve y después
         aparece el reproductor de golpe", no "la lluvia se lo lleva".
         Ahora la opacidad de la estela y de los glifos sube durante los
         primeros 700 ms. Ese es exactamente el tramo en que los elementos
         están cayendo, así que la caída se ve a través de la lluvia. */
      var entrada = Math.min(1, pasado / 700);
      ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.02 + 0.07 * entrada).toFixed(3) + ')';
      ctx.fillRect(0, 0, an, al);
      ctx.globalAlpha = 0.25 + 0.75 * entrada;
      ctx.font = cuerpo + "px ui-monospace, Consolas, monospace";

      gotas.forEach(function (g, i) {
        var x = i * cuerpo, y = g.y * cuerpo;
        if (y > 0) {
          // La cabeza va casi blanca; el cuerpo, verde. Es lo que hace que
          // la columna se lea como algo que AVANZA y no como una línea.
          ctx.fillStyle = '#c9ffd4';
          ctx.fillText(GLIFOS[Math.floor(Math.random() * GLIFOS.length)], x, y);
          ctx.fillStyle = 'rgba(0, 255, 65, .75)';
          ctx.fillText(GLIFOS[Math.floor(Math.random() * GLIFOS.length)], x, y - cuerpo);
        }

      });
