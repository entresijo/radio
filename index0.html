     Por qué existe: la composición pide 751 px de alto en cualquier
     pantalla —de 320 a 1280 px de ancho da el mismo número, medido— y el
     alto útil de un teléfono con la barra del navegador va de 553 a 823 px.

     el dial y el contador. En la app instalada entra en los teléfonos
     grandes y queda al límite en los iPhone con muesca.

     Los seis cambios:
       1. este comentario
       2. + encaje0.css (los dos números continuos: --aire y --encaje)
       3. + orient="vertical" en el fader — Firefox viejo no entiende
          `writing-mode` en un input range y lo dibuja acostado
       4. medirVu() mide con offsetWidth y no con getBoundingClientRect:
          bajo `zoom` las dos no dan lo mismo y el vúmetro se descentra
       5. publicarAncho() y medirCabecera() se corrigen por el zoom
       6. el motor del encaje, al final del script

     el CSS con el de producción a propósito — así lo único distinto entre
     los dos es el encaje, que es lo que se está probando.

<script>
/* ── INTRO DE ARRANQUE (sólo app instalada) ──────────────────────────
   Inyecta el vinilo a pantalla completa ANTES de que se pinte el reproductor,
   para encadenar con el splash estático de Android sin un parpadeo del
   contenido. El zoom + la salida los maneja el CSS (#app-intro) y el
   disparador vive en el arranque del script principal (al final del <body>),
   que le agrega la clase `arrancar` recién cuando la composición ya se asentó.
   Todo envuelto en try/catch + un timeout de seguridad: si algo falla, la capa
   se saca sola y NUNCA deja la pantalla tapada. En el navegador no se inyecta
   (no es standalone), así que es inocuo. */
try {
  if (matchMedia('(display-mode: standalone)').matches) {
    var _intro = document.createElement('div'); _intro.id = 'app-intro';
    var _iv = document.createElement('img'); _iv.src = '/icon-512.png'; _iv.alt = '';
    _intro.appendChild(_iv); document.body.appendChild(_intro);
    setTimeout(function () { if (_intro && _intro.parentNode) _intro.parentNode.removeChild(_intro); }, 3500);
  }
} catch (e) {}
</script>

<script>
'use strict';

/* ═════════════════════════════════════════════════════════════════
   CONFIGURACIÓN
   ═════════════════════════════════════════════════════════════════ */
const WORKER = 'https://white-mud-e8b6.entresijoradio.workers.dev';
const INFO   = WORKER + '/api/radio-info';
const CONFIG = WORKER + '/api/web-config';
const LIVE   = WORKER + '/api/live-state';

/* ── De dónde sale el audio ──────────────────────────────────────
   La URL del stream NO va fija: se lee de /api/radio-info. Pedido de
   la sesión del Worker, 05/08, y el fundamento es el que importa:

     hoy `cambiar-origen.mjs` mueve monitoreo y audio juntos porque los
     dos pasan por el Worker. Cuando el audio salga directo del VPS, con
     la URL fija acá volver a listen2myradio serían DOS cambios en dos
     sistemas distintos — y el día que haga falta va a ser el peor día
     para descubrirlo.

   El Worker puede seguir diciendo dónde leer el stream aunque deje de
   servirlo: indicar el origen no lo obliga a estar en el camino del audio.

   Esto es de fábrica, no la fuente de verdad: si el Worker no contesta o
   no manda el campo, se usa igual y el reproductor anda (MAESTRO.md §1). */
const STREAM_FABRICA = WORKER + '/api/stream';
let   streamUrl      = STREAM_FABRICA;

/* Arma la URL de conexión. Dos cuidados que no son decorativos:
   · el separador depende de si la URL YA trae query — concatenar '?t='
     a una URL con '?' la rompe, y una URL de VPS bien puede traer
     parámetros de mount;
   · `src=web` separa al reproductor del resto en el access.log del
     origen (pedido secundario del Worker). Va acá porque estamos
     tocando este archivo igual; no justifica tocar los viejos. */
function urlStream() {
  const sep = streamUrl.indexOf('?') >= 0 ? '&' : '?';
  return streamUrl + sep + 'src=web&t=' + Date.now();
}

/* Adopta la URL que mande el Worker. Se valida el esquema: un campo
   basura no puede dejar sin audio al oyente — ante la duda, fábrica.
   NO corta lo que está sonando: la URL nueva entra en la próxima
   conexión. Si el origen viejo se muere, el ciclo de reconexión ya
   existente la toma solo, sin lógica extra. */
function adoptarStream(u) {
  if (typeof u !== 'string' || !/^https?:\/\//i.test(u)) return;
  if (u === streamUrl) return;
  streamUrl = u;
}

/* ── `origen`: de dónde viene realmente el audio ─────────────────
   Campo aparte de `streamUrl` a propósito, y la distinción es del
   Worker: `streamUrl` es QUÉ reproducir, `origen` es DE DÓNDE viene
   en realidad. Meter la URL del VPS en `streamUrl` habría sacado al
   Worker del camino del audio de contrabando, y eso es una decisión
   estructural que todavía no se evaluó.

   Acá es puro diagnóstico: hace verificable desde el navegador que
   `cambiar-origen.mjs` hizo lo que dijo, sin consola ni token.

   La salvedad que avisó el Worker, y que este código vuelve legible:
   el origen cambia al INSTANTE, pero el que ya está escuchando sigue
   sonando desde el servidor viejo hasta que reconecte. Un diagnóstico
   que muestre el origen nuevo mientras alguien escucha el anterior no
   está mintiendo — por eso se guarda desde cuándo rige cada cosa y se
   marca explícitamente cuando la conexión que suena es más vieja que
   el cambio. Sin esto, la discrepancia se lee como un bug. */
let origenModo = null, origenDestino = null, origenDesde = 0;
let conexionDesde = 0;   // cuándo se estableció la conexión que suena

function anotarOrigen(o) {
  if (!o || typeof o !== 'object') return;
  if (o.destino === origenDestino && o.modo === origenModo) return;
  origenModo = o.modo || null;
  origenDestino = o.destino || null;
  origenDesde = Date.now();
}

// Valores de fábrica. Si el Worker no responde, el reproductor anda igual:
// independencia por capas (MAESTRO.md §1).
const DEFAULTS = { oyentes: false, chat: false, vumetro: true, historial: true, skins: true, skin: 'noir' };

// Overrides locales: lo que se toca desde el panel oculto. Viven sólo en
// este navegador y ganan por encima de lo que mande el Worker — son para
// que quien abre el panel pruebe algo sin afectar a los demás oyentes.
function leerOverridesLocales() {
  try { return JSON.parse(localStorage.getItem('entresijo:overrides') || '{}'); }
  catch (e) { return {}; }
}
function guardarOverrideLocal(clave, valor) {
  const o = leerOverridesLocales();
  o[clave] = valor;
  try { localStorage.setItem('entresijo:overrides', JSON.stringify(o)); } catch (e) {}
  FEATURES = { ...FEATURES, [clave]: valor };
  aplicarFeatures();
}

let   FEATURES = { ...DEFAULTS, ...leerOverridesLocales() };
let   cfgVisto = null;

const META_MS      = 15000;  // consulta de metadata
const TELEMETRIA_MS= 15000;  // era 3000: ~29.000 req/día por 3 oyentes
const LATIDO_MS    = 4000;   // chequeo de salud del elemento audio

// Micro-cortes: un 'waiting'/'stalled' no se corta a rajatabla. Se le da
// HIPO_MS de gracia; si a esa altura el navegador sigue "cargando" (puede
// llegar más sobre la MISMA conexión), se le da una prórroga única de
// HIPO_EXT_MS antes de rendirse. Recién ahí se reconecta de verdad.
const HIPO_MS      = 3000;
const HIPO_EXT_MS  = 3000;

// Reintentos: lineal rápido primero, exponencial después.
// La mayoría de los cortes se resuelven en segundos, así que durante los
// primeros ~16s se insiste cada 2s. Si a esa altura no volvió, el problema
// es de otra escala y no tiene sentido seguir al mismo ritmo: escala hasta
// un reintento cada 15s, para siempre.
const RETRY_LINEAL_MS    = 2000;
const RETRY_LINEAL_HASTA = 8;      // 8 × 2s ≈ 16s de fase lineal
const RETRY_MAX_MS       = 15000;

// Tope por intento de conexión.
// MEDIDO contra el Worker real (05/08, 4 corridas): 3,39 / 3,42 / 3,45 /
// 3,44 s hasta 'playing'. Media 3,43 s, dispersión 57 ms. Los "~8 s" de
// §2.2 no se sostienen: casi todo ese tiempo es esperar los primeros
// bytes, y una vez que llegan suena en 10-35 ms.
// 12 s = 3,5× lo medido. Margen para una red móvil mala sin quedarse
// tanto rato sobre una conexión que ya está colgada. OJO con bajarlo:
// un tope cerca del arranque real mata conexiones que estaban por
// lograrlo y arma un lazo infinito de "conecta → lo matan → reconecta".
const CONEXION_MAX_MS = 12000;

/* ═════════════════════════════════════════════════════════════════
   DOM
   ═════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const app       = $('app');
const btn       = $('btn');
const iconPlay  = $('icon-play');
const iconPause = $('icon-pause');
const player    = $('player');
const ring      = $('loading-ring');
const badge     = $('status-badge');

const ctx       = canvas.getContext('2d');
const artistEl  = $('artist');
const titleEl   = $('title');
const descEl    = $('description');
const listenEl  = $('listeners');
const histList  = $('history-list');
const histItems = $('history-items');
const histClose = $('hist-close');
const histBtn   = $('hist-toggle');
const histArrow = $('hist-arrow');
const volSlider = $('volume');

/* ═════════════════════════════════════════════════════════════════
   ESTADO

   Dos ejes independientes, que antes estaban mezclados:
     · quiereSonar  → la INTENCIÓN del oyente. Única fuente de verdad
                      para decidir qué hace el botón.
     · estaSonando  → el HECHO. Sólo sirve para pintar.

   El bug de "la pausa se despausa sola" venía de que el botón leía
   `estaSonando`, que la reconexión modifica por atrás.
   ═════════════════════════════════════════════════════════════════ */
let quiereSonar   = false;
let estaSonando   = false;
let conectando    = false;
let reconectando  = false;
let intentos      = 0;
let hipoActivo    = false;   // hay un hipo en observación
let hipoExtendido = false;   // ya se le dio la prórroga única

// El oyente pidió sonar, pero la emisora está caída CONFIRMADA por el
// Worker. No se martilla un encoder apagado: se suelta la conexión y se
// espera. El poll de metadata es el que despierta y retoma al volver.
// quiereSonar sigue en true: la intención es del oyente, y que la radio
// se caiga no se la borra.
let enEspera      = false;

// "EN PAUSA" sólo tiene sentido si el oyente pausó algo. Al que recién
// llega se le muestra qué está sonando: eso es la invitación a darle play.
let pausadoPorMi  = false;

let audioCtx = null, analyser = null, datos = null, nodoSilencioso = null;

/* ── Hace cuánto ─────────────────────────────────────────────── */
function haceCuanto(ms) {
  const min = Math.floor((Date.now() - ms) / 60000);
  if (min < 1)  return 'RECIÉN';
  if (min < 60) return 'HACE ' + min + ' MIN';
  const h = Math.floor(min / 60);
  if (h < 24)   return 'HACE ' + h + (h === 1 ? ' HORA' : ' HORAS');
  const d = Math.floor(h / 24);
  return 'HACE ' + d + (d === 1 ? ' DÍA' : ' DÍAS');
}

/* ═════════════════════════════════════════════════════════════════
   RELOJ
   ═════════════════════════════════════════════════════════════════ */
function tic() {
  // Igual que producción: locale del sistema, sin forzar el formato. Lo había
  // pasado a 24 h por mi cuenta y no correspondía.
  /* [index0] SÓLO SI CAMBIÓ. Esto corre cada segundo pero el valor es HH:MM,
     o sea que cambia una vez por minuto: 59 de cada 60 escrituras ponen
     exactamente el mismo texto.
     No es cosmético. Escribir textContent reemplaza el nodo de texto igual, y
     eso DISPARA EL MutationObserver del modo ascii —que vigila #clock— así que
     el retrato entero se redibujaba una vez por segundo.
     MEDIDO en Chromium y en Firefox, con el modo ascii puesto y sin tocar
     nada: 12 repintes y ~4.615 glifos en 12 segundos. O sea 385 fillText por
     segundo, para siempre, sólo por el reloj. Con esta línea pasa a un
     repinte por minuto. */
  var t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  var el = $('clock');
  if (el.textContent !== t) el.textContent = t;
}
setInterval(tic, 1000); tic();

/* ═════════════════════════════════════════════════════════════════
   VÚMETRO — la intensidad sigue el nivel de audio
   ═════════════════════════════════════════════════════════════════ */
// El radio del arco se mide del botón real, para que el aire entre ambos
// sea el mismo en cualquier tamaño de pantalla.
const VU_C = 85;
let   VU_R = 70;
/* [index0] EL FACTOR DE ESCALA, para las tres cuentas que lo necesitan.
   `zoom` parte las medidas del DOM en dos familias que dejan de coincidir:
   getBoundingClientRect() y los rangos de texto devuelven píxeles de
   PANTALLA (ya escalados), mientras offsetWidth, clientWidth y scrollLeft
   devuelven píxeles de MAQUETA (sin escalar). Medido en Chrome 148 con
   zoom 0,85: el mismo elemento da 217,63 por un lado y 256 por el otro.
   Cualquier cuenta que mezcle las dos familias, o que mida en pantalla para
   escribir en maqueta, hay que dividirla por acá. */
function zoomApp() {
  const z = parseFloat(getComputedStyle(app).zoom);
  return (z && isFinite(z) && z > 0) ? z : 1;
}

function medirVu() {
  /* [index0] `offsetWidth` y no `getBoundingClientRect().width`.
     VU_R es un radio en COORDENADAS DEL CANVAS —el canvas mide 170x170 por
     atributo y el zoom lo escala entero, igual que al botón—, así que el
     número que va acá tiene que ser el de maqueta. Con el rect, en cuanto
     el encaje aprieta el arco se dibujaría con un radio ya escalado sobre
     un canvas que además se escala: el arco se metería ADENTRO del botón.
     Es exactamente el bug del vúmetro descentrado de otras veces.
     Sin zoom las dos lecturas dan lo mismo, así que el cambio es inocuo. */
  const w = document.querySelector('.play-outer').offsetWidth;
  if (w) VU_R = Math.min(w / 2 + 9, 82);
}

/* LOS DOS COLORES DEL VÚMETRO SALEN DEL CSS, NO DE ACÁ (18/08).
   Estaban clavados —el arco en '#b31b14' y el aro base en '#161010'—, así
   que una piel cambiaba la paleta entera menos el único elemento que dibuja
   el JS: el arco seguía saliendo rojo Entresijo sobre cualquier fondo. En
   `blanco` eso es un arco rojo sobre blanco.
   La salida que respeta "el JS nunca escribe estilo" no es elegir mejor: es
   que el JS LEA el color de una variable. Quién decide sigue siendo el CSS.

   --vu-arco y --vu-aro son la palanca dedicada, por si una piel quiere el
   arco de otro color que su señal de aire; sin ellas se cae a los tokens de
   la paleta, que las once pieles ya definen. La última reserva son los dos
   valores viejos, para que un CSS que no cargó no deje el canvas invisible.

   Se CACHEA: getComputedStyle sobre una custom property fuerza recálculo de
   estilo, y vuBase() corre en cada cuadro mientras suena. Se relee cuando
   cambia la piel (aplicarSkin y aplicarPiel del easter egg) y cuando termina
   de cargar la hoja — leerlo antes devuelve vacío (DISENO §8). */
let VU_ARCO = '#b31b14', VU_ARO = '#161010';
/* El nivel con caída lenta, para que el arco siga los golpes sin temblar. */
let vuNivel = 0;
/* [index0] El último escalón publicado. Empieza en -1 para que el primer
   cuadro siempre dibuje. */
let vuEscalon = -1;
/* [index0] El cuadro pendiente del vúmetro, para que no se apilen bucles. */
let vuRaf = 0;
/* [index0] `?eq=pico` devuelve el comportamiento de hoy, para comparar los dos
   en el mismo teléfono. Sin el parámetro va el suavizado. */
const EQ_PICO   = new URLSearchParams(location.search).get('eq') === 'pico';
const EQ_ATAQUE = 0.30;   // sube rápido pero no de golpe (antes: instantáneo)
const EQ_CAIDA  = 0.08;   // baja despacio (antes: 0,12)
/* Cuando la piel cambió y todavía no se releyeron los colores. Se levanta en
   aplicarSkin() y se baja acá, al dibujar: así el getComputedStyle cae en el
   cuadro que igual iba a dibujar y no en medio del gesto del dial. */
let vuSucio = true;
function leerColoresVu() {
  const cs = getComputedStyle(app);
  const val = (n, r) => ((cs.getPropertyValue(n) || '').trim() || r);
  VU_ARCO = val('--vu-arco', val('--primary-bright', '#b31b14'));
  VU_ARO  = val('--vu-aro',  val('--border',         '#161010'));
}

addEventListener('resize', () => { medirVu(); if (!vuActivo) vuBase(); });
function vuBase() {
  if (vuSucio) { vuSucio = false; leerColoresVu(); }
  ctx.clearRect(0, 0, 170, 170);
  ctx.beginPath(); ctx.arc(VU_C, VU_C, VU_R, 0, Math.PI * 2);
  ctx.strokeStyle = VU_ARO; ctx.lineWidth = 1.5; ctx.stroke();
  if (!vuActivo) btn.style.setProperty('--nivel', '0');
}
/* El arco se mantiene en UN color constante mientras suena: lo que respira
   con el audio es el glow de fondo del círculo, como en las versiones
   viejas. Constante durante la reproducción, no clavado en el archivo —
   quién lo elige es la piel (ver leerColoresVu).

   El JS publica el nivel como dato (`--nivel`, 0 a 1); qué hacer con él lo
   decide el CSS. Así sigue valiendo la regla de que el JS no escribe estilo,
   y un skin puede usar ese nivel para otra cosa —o ignorarlo. */
function vuLoop() {
  if (!vuActivo || !analyser) { vuBase(); return; }
  /* [index0] UN SOLO BUCLE, SIEMPRE.
     `vuLoop()` lo llama el evento 'playing', y 'playing' vuelve a dispararse
     en CADA RECONEXIÓN. Como cada llamada arrancaba su propia cadena de
     requestAnimationFrame sin cortar la anterior, quedaban N bucles vivos a
     la vez dibujando el mismo arco y publicando el mismo --nivel N veces por
     cuadro.
     MEDIDO con audio de verdad: 240 dibujos cada 2 s en reposo; después de
     cuatro 'playing' seguidos, 1200. Exactamente x5, en Firefox y en
     Chromium. En una red móvil que corta seguido, el costo del vúmetro
     crece con el rato que llevás escuchando — que es justamente la forma
     del síntoma reportado en máquinas viejas.
     Cancelar el cuadro pendiente antes de pedir el siguiente deja uno solo.
     Cuando vuLoop viene de su propio rAF el id ya se consumió y cancelarlo
     no hace nada: la guarda sólo muerde en las llamadas de afuera. */
  cancelAnimationFrame(vuRaf);
  vuRaf = requestAnimationFrame(vuLoop);
  /* ── LA ESCALA ES dBFS DE VERDAD (19/08) ──────────────────────────
     Estaba con `getByteFrequencyData` promediado entre todas las bandas y
     multiplicado por 1,6. Dos cosas mal, y las dos hacían que el círculo se
     cerrara MUY POR DEBAJO de 0 dBFS — sospecha del usuario, y era correcta:

     1 · `getByteFrequencyData` mapea el rango `minDecibels`..`maxDecibels`,
         que por defecto es **−100 a −30 dBFS**. O sea que el byte 255 no es
         cero: son −30. Todo lo que pasara de ahí saturaba igual.
     2 · Promediar TODAS las bandas mete los agudos, que casi no tienen
         energía, así que el número quedaba bajo y hubo que compensarlo con
         una ganancia inventada de 1,6 — que a su vez adelantaba el cierre.

     Ahora se mide la forma de onda y no el espectro: `getByteTimeDomainData`
     da la muestra cruda, 128 es el cero y 0/255 son ±plena escala. El pico
     absoluto sobre 128 ES la amplitud lineal, donde **1,0 = 0 dBFS exacto**.
     Sin ganancias ni exponentes: el círculo se cierra cuando el audio llega
     a plena escala, y no antes.

     El ataque es instantáneo y la caída lenta (0,12 por cuadro): así el arco
     sigue los golpes pero no tiembla, que es lo que hacía que el promedio
     pareciera más estable de lo que era. */
  /* ── [index0] EL VUMETRO, MENOS NERVIOSO Y MAS BARATO ─────────────
     Reportado: *"la animacion del eq se cambio pero es muy brusca... antes se
     mezclaban las frecuencias y mostraba algo mas parejo, menos nervioso"*.

     Tenia razon y se ve en el codigo. El 19/08 se paso de promediar el
     ESPECTRO (getByteFrequencyData sobre todas las bandas) a mirar el PICO
     absoluto de la forma de onda. El cambio de escala era correcto —el pico
     sobre 128 es amplitud lineal de verdad, con 1,0 = 0 dBFS— pero el pico es
     UNA muestra de las 1024: salta de un cuadro al otro sin relacion con lo
     que se oye. Y encima el ataque quedo INSTANTANEO (`pico > vuNivel ? pico`),
     asi que cada transitorio manda el arco al tope de golpe. Eso es lo brusco.

     Se arregla sin perder la escala dBFS que se gano aquella vez:

     1) RMS EN VEZ DE PICO. El RMS es la energia de toda la ventana, que es lo
        que el oido llama "fuerte" — y es lo que hacia parecer estable al
        promedio del espectro. Multiplicado por raiz(2), una senoidal a plena
        escala sigue dando 1,0 EXACTO, asi que el circulo se sigue cerrando en
        0 dBFS y no antes. No hay ganancia inventada.

     2) ATAQUE SUAVIZADO. Sube con 0,30 por cuadro en vez de saltar. Sigue
        siendo mas rapido que la caida (0,08), asi que el golpe se nota; lo
        que se pierde es el salto de cero a uno en un cuadro.

     3) EL NIVEL SE PUBLICA EN ESCALONES, y si no cambio no se publica.
        Esto es CPU, y es la parte que importa en una maquina vieja: cada
        `setProperty('--nivel')` invalida el estilo del boton, y el boton
        tiene DOS box-shadow cuyo radio de desenfoque llega a 118 px. Repintar
        un desenfoque de 118 px sesenta veces por segundo es carisimo. Con la
        senal ya suavizada, muchos cuadros seguidos caen en el mismo escalon
        de 1/50 —imperceptible: 2 px sobre 118— y ahi no se toca el DOM ni se
        redibuja el canvas.

     Para comparar con lo de hoy: `?eq=pico` devuelve el comportamiento
     anterior exacto. */
  analyser.getByteTimeDomainData(datos);
  let pico = 0, suma = 0;
  for (let i = 0; i < datos.length; i++) {
    const a = (datos[i] - 128) / 128;
    const abs = a < 0 ? -a : a;
    if (abs > pico) pico = abs;
    suma += a * a;
  }
  if (EQ_PICO) {
    vuNivel = pico > vuNivel ? pico : vuNivel + (pico - vuNivel) * 0.12;
  } else {
    const rms = Math.sqrt(suma / datos.length) * 1.41421;
    const objetivo = rms > 1 ? 1 : rms;
    vuNivel += (objetivo - vuNivel) * (objetivo > vuNivel ? EQ_ATAQUE : EQ_CAIDA);
  }
  const energia = Math.min(1, vuNivel);

  /* EL ARCO SE DIBUJA SIEMPRE. Dibujar en el canvas es barato —medido:
     script 17 ms en 8 s de reproduccion— y saltearse cuadros se ve a tirones.
     Lo caro es la linea de abajo, no esta. */
  vuBase();
  if (energia > 0) {
    ctx.beginPath();
    ctx.arc(VU_C, VU_C, VU_R, 0, Math.max(energia * Math.PI * 2, .04));
    ctx.strokeStyle = VU_ARCO;   // el color lo pone la piel, no este archivo
    ctx.lineWidth = 3;           // constante
    ctx.stroke();
  }

  /* --nivel SI VA POR ESCALONES, y esta es la linea cara: invalida el estilo
     del boton, que lleva dos box-shadow con desenfoque de hasta 90 px, y el
     navegador tiene que repintar todo ese circulo cada vez.
     Un escalon de 1/50 sobre un halo difuso de 90 px son menos de 2 px de
     radio: invisible.
     MEDIDO en 8 s de reproduccion, Chromium:
        cada cuadro     60 publicaciones/s   estilo 235 ms   tarea 534 ms
        por escalones   ~10 publicaciones/s  estilo  69 ms   tarea 292 ms */
  const escalon = Math.round(energia * 50) / 50;
  if (escalon !== vuEscalon) {
    vuEscalon = escalon;
    btn.style.setProperty('--nivel', escalon.toFixed(2));
  }
}
medirVu(); vuBase();

/* ═════════════════════════════════════════════════════════════════
   AUDIO
   ═════════════════════════════════════════════════════════════════ */
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    analyser = audioCtx.createAnalyser();
    /* 1024 y no 64: con la medición por forma de onda hacen falta muestras
       suficientes para que el pico de un cuadro sea el pico real y no el de
       32 puntos sueltos. A 48 kHz, 1024 muestras son 21 ms — algo menos que
       un cuadro, así que no se pierde ningún golpe entre lecturas. */
    analyser.fftSize = 1024;
    /* `fftSize` y no `frequencyBinCount`, que es la mitad: desde que se mide
       la FORMA DE ONDA y no el espectro, el búfer tiene que tener una muestra
       por cada punto del cuadro de análisis. Con la mitad se leía media
       ventana y el pico podía caer justo en la parte que no se miraba. */
    datos = new Uint8Array(analyser.fftSize);
    const src = audioCtx.createMediaElementSource(player);
    src.connect(analyser); analyser.connect(audioCtx.destination);
  } catch (e) { audioCtx = null; }
}

// Oscilador inaudible: evita que el AudioContext se suspenda en segundo plano.
function nodoVivo() {
  if (!audioCtx || nodoSilencioso) return;
  try {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    g.gain.value = 0.00001;
    osc.connect(g); g.connect(audioCtx.destination); osc.start();
    nodoSilencioso = osc;
  } catch (e) {}
}

async function pedirWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
      if (quiereSonar) setTimeout(pedirWakeLock, 1000);
    });
  } catch (e) {}
}
function soltarWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

/* ── MediaSession: controles en pantalla bloqueada ───────────── */
function portada() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    // Del elemento .player-app, no de <html>: ahí es donde un skin publica
    // sus variables (data-skin vive en #app), y una custom property no se
    // hereda hacia arriba.
    const css = getComputedStyle(app);
    const bg  = css.getPropertyValue('--bg').trim() || '#0a0806';
    const red = css.getPropertyValue('--primary-bright').trim() || '#b31b14';
    const cx = 256, cy = 256;
    g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
    /* ⚠️ SIN texto ni marco. Android NO muestra esto como tarjeta: lo usa de
       FONDO, recortado a una franja ancha desde el centro y oscurecido, con
       su propio texto encima. El texto viejo ("ENTRESIJO / RADIO SERRANA")
       peleaba con el del sistema y un marco dejaba dos rayas en los lados.
       Lo que sobrevive a ese recorte es una MARCA CENTRADA: el vinilo con el
       centro rojo. El aro exterior puede perderse en los lados y no importa —
       lo reconocible es el centro. Es el mismo dibujo que el ícono de la app
       (icon-512.png), a mano en canvas para que siga el color de la piel. */
    // aro "en el aire" (glow rojo)
    g.save(); g.shadowBlur = 22; g.shadowColor = red;
    g.globalAlpha = 0.6; g.strokeStyle = red; g.lineWidth = 4;
    g.beginPath(); g.arc(cx, cy, 193, 0, 7); g.stroke(); g.restore();
    // disco de vinilo
    g.fillStyle = '#17110f'; g.beginPath(); g.arc(cx, cy, 179, 0, 7); g.fill();
    // surcos muy sutiles
    [115, 136, 156].forEach(r => {
      g.strokeStyle = 'rgba(200,200,205,.03)'; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
    });
    g.strokeStyle = red; g.globalAlpha = 0.13; g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, 146, 0, 7); g.stroke(); g.globalAlpha = 1;
    // etiqueta central roja + agujero
    g.fillStyle = red; g.beginPath(); g.arc(cx, cy, 58, 0, 7); g.fill();
    g.fillStyle = bg;  g.beginPath(); g.arc(cx, cy, 9, 0, 7); g.fill();
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}

// El objeto MediaMetadata se arma UNA sola vez (implica redibujar un
// canvas de 512×512 y generar un PNG — no es gratis en un móvil viejo, y
// repintar() lo invoca cada 15s mientras suena). Los refrescos siguientes
// sólo mutan title/artist sobre el mismo objeto: es válido, MediaMetadata
// tiene esas propiedades como settables.
let mediaMeta = null;
function mediaSession(artist, title) {
  if (!('mediaSession' in navigator)) return;
  try {
    if (!mediaMeta) {
      const art = portada();
      mediaMeta = new MediaMetadata({
        title:  title  || 'En vivo',
        artist: artist || 'Entresijo Radio',
        album:  'Radio Serrana',
        artwork: art ? [{ src: art, sizes: '512x512', type: 'image/png' }] : []
      });
      navigator.mediaSession.metadata = mediaMeta;
      navigator.mediaSession.setActionHandler('play',  () => { if (!quiereSonar) accionar(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (quiereSonar)  accionar(); });
    } else {
      mediaMeta.title  = title  || 'En vivo';
      mediaMeta.artist = artist || 'Entresijo Radio';
    }
  } catch (e) {}
}

/* ═════════════════════════════════════════════════════════════════
   REPRODUCCIÓN
   ═════════════════════════════════════════════════════════════════ */
function limpiarTimers() {
  if (tReconexion) { clearTimeout(tReconexion); tReconexion = null; }
  if (tHipo)       { clearTimeout(tHipo);       tHipo = null; }
  if (tConexion)   { clearTimeout(tConexion);   tConexion = null; }
  hipoActivo = false; hipoExtendido = false;
}

// Sin precarga en mousedown/touchstart, a propósito: un toque que no
// termina en click dejaba una conexión al stream abierta y sin cerrar
// nunca — el mismo defecto de oyente fantasma que ya se le sacó al
// prewarmConnection() de index.html, sólo que disparado por el dedo en
// vez de por la carga de página. Y con el burst-size/distancia actuales
// (~8s de los cuales esto ganaba 200-400ms), el margen no lo justifica.
// El stream se abre recién cuando el click es real.
async function arrancar() {
  if (tSoltar) { clearTimeout(tSoltar); tSoltar = null; }
  /* ¿VUELVE DE UNA PAUSA CORTA? Entonces la conexión sigue viva y no hay
     nada que reconectar: se despausa y suena al instante, desde donde quedó.
     Se pide `readyState >= 2` (HAVE_CURRENT_DATA) porque una conexión que se
     murió durante la pausa no sirve: ahí se cae al camino normal y reconecta.
     Tampoco se arma el watchdog de conexión — no hay conexión que vigilar. */
  if (player.src && player.readyState >= 2 && !player.ended) {
    quiereSonar = true; pausadoPorMi = false; enEspera = false;
    initAudio(); nodoVivo(); pedirWakeLock();
    setIcono(true); repintar();
    try { await player.play(); return; }
    catch (e) { if (e.name === 'AbortError') return; /* si falla, sigue abajo */ }
  }
  initAudio(); nodoVivo(); pedirWakeLock();
  quiereSonar = true; conectando = true; reconectando = false; intentos = 0;
  pausadoPorMi = false; enEspera = false;

  setIcono(true);
  setAnillo(true, false, .85);
  pintar('sintoniza');

  player.src = urlStream();
  armarVigiaConexion();

  try { await player.play(); }
  catch (e) {
    if (e.name === 'AbortError') return;
    conectando = false;
    if (quiereSonar) programarReconexion();
  }
}

/* ── LA PAUSA NO CORTA LA CONEXIÓN (19/08) ────────────────────────
   Hasta acá pausar hacía `detener()`, que suelta el `src` y cierra: volver
   costaba los 3,43 s de arranque medidos. Pedido explícito del usuario:
   *"el que pausa conscientemente quiere retomar donde quedó"*.

   Cómo queda, y es una decisión suya sobre un vivo:
     · hasta 60 s → se mantiene la conexión y se retoma DONDE QUEDÓ. Quedás
       atrasado del aire lo que hayas pausado, y ése es el precio aceptado.
     · pasados los 60 s → se suelta de verdad, y el próximo play va en vivo.

   ⚠️ POR QUÉ ESTO NO ES EL `prewarmConnection()` QUE SE SACÓ DOS VECES. La
   regla 6 del arranque —"nunca abrir una conexión que no se va a usar"— habla
   de abrir conexiones ESPECULATIVAS, para nadie. Acá la conexión ya está
   abierta y hay un oyente que dijo que vuelve. La diferencia es la intención,
   y el tope de 60 s es lo que impide que se convierta en lo otro: un oyente
   que se fue no deja socket abierto más de un minuto.

   ⚠️ Y NO DESPIERTA AL CICLO DE RECONEXIÓN: `quiereSonar` baja a false, y
   todos los caminos —latido, hipo, watchdog, poll de metadata— están
   guardados por esa bandera (verificado, líneas 685 a 845). En pausa el
   reproductor no reintenta nada. */
const PAUSA_MAX_MS = 60000;
let tSoltar = null;

function pausar() {
  quiereSonar = false; estaSonando = false;
  conectando = false; reconectando = false; enEspera = false;
  vuActivo = false; intentos = 0;
  pausadoPorMi = true;
  limpiarTimers();
  player.pause();          /* y NADA MÁS: el `src` se queda, que es el punto */
  setIcono(false); setAnillo(false); vuBase();
  soltarWakeLock();
  actualizarBoton();
  repintar();
  if (tSoltar) clearTimeout(tSoltar);
  tSoltar = setTimeout(function () {
    tSoltar = null;
    /* Si mientras tanto volvió a darle play, no hay nada que soltar. */
    if (!quiereSonar) detener(true);
  }, PAUSA_MAX_MS);
}

function detener(porElOyente) {
  if (tSoltar) { clearTimeout(tSoltar); tSoltar = null; }
  quiereSonar = false; estaSonando = false;
  conectando = false; reconectando = false; enEspera = false;
  vuActivo = false; intentos = 0;
  if (porElOyente) pausadoPorMi = true;
  limpiarTimers();
  player.pause();
  player.removeAttribute('src');
  player.load();
  setIcono(false); setAnillo(false); vuBase();
  soltarWakeLock();
  actualizarBoton();
  repintar();
}

/* ── Corte CONFIRMADO por el Worker ──────────────────────────────
   Distinto de detener(): se suelta la conexión —no tiene sentido
   martillar un encoder que sabemos apagado— pero NO se toca
   `quiereSonar`. La intención es del oyente; que la emisora se caiga
   no se la borra. Antes acá se llamaba detener(), que la borraba, y
   por eso al volver la radio no retomaba nunca: el oyente quedaba
   afuera sin haber pedido salir.
   Quien despierta de este estado es el poll de metadata, no un timer
   de audio. ─────────────────────────────────────────────────────── */
function pausarPorEmisora() {
  enEspera = true;
  estaSonando = false; conectando = false; reconectando = false;
  vuActivo = false; intentos = 0;
  limpiarTimers();
  player.pause();
  player.removeAttribute('src');
  player.load();
  setAnillo(false); vuBase();
  soltarWakeLock();
  // El icono queda en "pausa": el oyente sigue en la fila y el botón
  // pasa a significar "cancelar la espera".
  setIcono(true);
}

/* El botón sólo se traba cuando NO hay nada que prometer: corte
   confirmado y nadie esperando. Con el oyente en espera queda vivo,
   porque ahí sí hace algo — cancelar. */
function actualizarBoton() {
  const d = ultimoDato;
  const fueraConfirmado = !!(d && d.verified && !d.isLive);
  btn.disabled = fueraConfirmado && !quiereSonar;
}

// El watchdog de conexión (armarVigiaConexion) y una promesa vieja de
// play() que rechaza tarde llegan acá los dos: cortar la conexión de
// verdad hace que cualquier play() colgado rechace con AbortError, que
// los catch de abajo ya saben ignorar. Así no hace falta un id de
// intento para distinguir "esto es viejo, no lo toques".
function conexionFallida() {
  limpiarTimers();
  conectando = false; reconectando = false;
  player.pause();
  player.removeAttribute('src');
  player.load();
  if (quiereSonar && !enEspera) programarReconexion();
}

// Ninguna conexión (la inicial ni un reintento) tenía tope propio: si
// play() no resolvía NI rechazaba nunca —conecta a nivel TCP pero no
// entrega un byte—, conectando/reconectando quedaban en true para
// siempre y TODOS los caminos de recuperación (latido, hipo de
// 'waiting', online, visibilitychange) están condicionados a que sean
// false. Se apagaban todos a la vez y sólo un pausa+play manual
// destrababa. Este timer es el único tope: si 'playing' no llegó a
// tiempo, se trata como un fallo más.
function armarVigiaConexion() {
  clearTimeout(tConexion);
  tConexion = setTimeout(conexionFallida, CONEXION_MAX_MS);
}

/* Lineal rápido primero, exponencial después.
   La mayoría de los cortes se resuelven en segundos: durante los primeros
   ~16s se insiste cada 2s, que es donde está la ganancia real de volver
   rápido. Si a esa altura no volvió, el problema es de otra escala y
   seguir al mismo ritmo sólo apila conexiones — ahí escala hasta un
   reintento cada 15s, y se queda ahí para siempre. */
function esperaReintento() {
  if (intentos < RETRY_LINEAL_HASTA) return RETRY_LINEAL_MS;
  const exp = RETRY_LINEAL_MS * Math.pow(2, intentos - RETRY_LINEAL_HASTA + 1);
  return Math.min(exp, RETRY_MAX_MS);
}

function programarReconexion() {
  if (!quiereSonar || reconectando || enEspera) return;
  reconectando = true;
  limpiarTimers();

  // ±15% de jitter: sin esto, todos los oyentes que se caen por el mismo
  // corte reintentan en el mismo tick exacto y golpean juntos al Worker/
  // Icecast apenas vuelve.
  const espera = Math.round(esperaReintento() * (0.85 + Math.random() * 0.3));
  const vel    = Math.min(.6 + intentos * .3, 2).toFixed(1);
  intentos++;   // se reinicia SÓLO en el evento 'playing'

  vuActivo = false; vuBase();
  pintar('buscando');
  setAnillo(true, true, parseFloat(vel));

  tReconexion = setTimeout(async () => {
    tReconexion = null;
    if (!quiereSonar) { reconectando = false; return; }
    // Sin red del sistema no se abre un socket condenado de antemano: el
    // viajero sin señal quemaría batería abriendo decenas de conexiones
    // imposibles. Se sigue girando el ciclo (barato, sin socket) y el
    // evento 'online' lo acelera apenas vuelve la señal.
    if (!navigator.onLine) { reconectando = false; programarReconexion(); return; }
    player.pause();
    player.removeAttribute('src');
    player.load();
    await new Promise(r => setTimeout(r, 200));
    // Re-chequear acá es lo que importa: sin esto, un detener() —pausa
    // manual o el corte confirmado de decidirCorte()— que cae justo en
    // esta espera de 200ms se ignoraba, y el retry resucitaba el audio
    // arrancándolo de nuevo apenas después de que se le pidió parar.
    if (!quiereSonar) { reconectando = false; return; }
    player.src = urlStream();
    armarVigiaConexion();
    try { await player.play(); }
    catch (e) {
      if (e.name === 'AbortError') { reconectando = false; return; }
      // Si el evento 'error' ya reagendó, no reagendar de nuevo: sería
      // saltear un escalón de la escalera y disparar dos veces.
      if (tReconexion) return;
      reconectando = false;
      programarReconexion();
    }
  }, espera);
}

/* ── Eventos del elemento audio ──────────────────────────────── */
player.addEventListener('playing', () => {
  conectando = false; reconectando = false;
  estaSonando = true; intentos = 0;
  conexionDesde = Date.now();
  limpiarTimers();
  setAnillo(false); setIcono(true);
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  vuActivo = true; vuLoop();
  repintar();
});

// Un hipo corto no cambia el badge: no hay nada que el oyente pueda hacer y
// alarmarlo por unos segundos de buffer es ruido. 'waiting' (se vació el
// buffer de decodificación) y 'stalled' (el navegador esperaba bytes de
// red y no llegaron) caen en el mismo manejador: la pregunta es siempre
// la misma, "¿esta conexión todavía tiene esperanza?".
player.addEventListener('waiting', manejarHipo);
player.addEventListener('stalled', manejarHipo);

function manejarHipo() {
  if (!quiereSonar || conectando || reconectando || enEspera) return;
  setAnillo(true, false, .85);
  // El reloj arranca en el PRIMER aviso, no en cada uno: una conexión que
  // tose 'waiting'/'stalled' varias veces seguidas sin morir del todo no
  // debe poder estirar la paciencia cada vez que tose. Los avisos
  // repetidos confirman el problema, no lo posponen.
  if (hipoActivo) return;
  hipoActivo = true; hipoExtendido = false;
  tHipo = setTimeout(revisarHipo, HIPO_MS);
}

// No se corta a rajatabla por un timer fijo: se le pregunta al elemento si
// la conexión sigue viva. Con networkState en LOADING el navegador todavía
// espera datos sobre la MISMA conexión — pueden llegar más bytes en
// cualquier momento, y tirarla para abrir otra sólo agrega los ~8s de
// arranque. Se le da una prórroga única; agotada, o si ya no está cargando
// nada, se reconecta.
function revisarHipo() {
  hipoActivo = false;
  if (!quiereSonar || conectando || reconectando || enEspera) return;
  if (player.networkState === player.NETWORK_LOADING && !hipoExtendido) {
    hipoExtendido = true; hipoActivo = true;
    tHipo = setTimeout(revisarHipo, HIPO_EXT_MS);
    return;
  }
  programarReconexion();
}

/* El elemento se murió. Va por el MISMO embudo que el watchdog.

   Antes esto estaba guardado por `!reconectando`, y ahí se escondía un
   bug feo: cuando un reintento hacía play() y la conexión moría por
   evento 'error' (en vez de que la promesa rechazara), `reconectando`
   quedaba en true, este handler se ignoraba a sí mismo, y no se
   reagendaba nada. La única salida era el watchdog. Resultado medido:
   la política "lineal cada 2s" daba UN reintento y después 12s de nada.

   La guarda correcta no es `!reconectando` sino "¿ya hay un reintento
   agendado?": si lo hay, este error es del intento que acaba de morir y
   no hay nada que hacer; si no lo hay, el intento actual falló y toca
   reagendar ya. */
function murioLaConexion() {
  if (!quiereSonar || enEspera) { conectando = false; return; }
  if (tReconexion) return;
  conexionFallida();
}
player.addEventListener('error', murioLaConexion);

/* 'ended' en un stream en vivo NO es un final: es el servidor cerrando la
   conexión limpiamente (EOF). RECUPERADO DE PRODUCCIÓN (index.html:431),
   que sí lo escucha — index4 lo había perdido, y sin él un cierre limpio
   del proveedor no lo notaba nadie hasta que el latido lo pescaba 4s
   después. Va al mismo embudo que 'error'. */
player.addEventListener('ended', murioLaConexion);

player.addEventListener('pause', () => { estaSonando = false; });

/* ── Latido: red de contención por si ningún evento avisó ────────
   Antes reconectaba directo con sólo mirar readyState, sin la paciencia
   de arriba: podía cortar una conexión que 'waiting' todavía estaba
   esperando de buena fe. Ahora entra por el mismo manejarHipo(), así que
   sigue las mismas reglas — un solo camino de decisión, no dos corriendo
   en paralelo con criterios distintos. ───────────────────────────── */
setInterval(() => {
  if (!quiereSonar || conectando || reconectando || enEspera) return;
  if (player.paused || player.readyState < 2) manejarHipo();
}, LATIDO_MS);

/* ── El botón responde a la INTENCIÓN, nunca al estado ───────── */
function accionar() {
  if (btn.disabled) return;
  if (quiereSonar) pausar(); else arrancar();
}
btn.addEventListener('click', accionar);

/* ── Volumen, recordado entre visitas ────────────────────────── */
function aplicarVolumen(v) {
  const n = Math.min(1, Math.max(0, parseFloat(v)));
  player.volume = n; volSlider.value = n;
  // La posición se publica como dato; el degradé de la barra lo arma el CSS.
  volSlider.style.setProperty('--vol-pct', (n * 100).toFixed(1) + '%');
  try { localStorage.setItem('entresijo:vol', String(n)); } catch (e) {}
}
volSlider.addEventListener('input', e => aplicarVolumen(e.target.value));
try {
  const guardado = localStorage.getItem('entresijo:vol');
  aplicarVolumen(guardado !== null ? guardado : 0.8);
} catch (e) { aplicarVolumen(0.8); }

/* ── Historial ───────────────────────────────────────────────── */
let histAbierto = false;
function abrirHistorial(v) {
  histAbierto = v;
  histList.classList.toggle('open', v);
  histArrow.classList.toggle('open', v);
  histBtn.setAttribute('aria-expanded', v ? 'true' : 'false');
}
histBtn.addEventListener('click', e => { e.stopPropagation(); abrirHistorial(!histAbierto); });
histClose.addEventListener('click', e => { e.stopPropagation(); abrirHistorial(false); });
// Se cierra tocando afuera o con Escape: es un panel sobre la composición,
// no una sección que quedó desplegada.
document.addEventListener('click', e => {
  if (histAbierto && !histList.contains(e.target)) abrirHistorial(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && histAbierto) abrirHistorial(false); });

/* ── Red del sistema operativo ───────────────────────────────── */
window.addEventListener('offline', () => { sinRed = true;  repintar(); });
window.addEventListener('online',  () => {
  sinRed = false;
  // Volvió la red: preguntar YA en vez de esperar hasta 15s al próximo
  // poll. Si la radio estaba caída y ya volvió, esto la retoma al toque.
  traerMeta();
  repintar();
  if (quiereSonar && !estaSonando && !enEspera) {
    // El que estuvo sin señal 10 minutos —viajando, túnel, ascensor—
    // tiene la escalera en el techo de 15s. Esa escalera se construyó
    // contra una red que ya no es la de ahora: se reinicia y se cancela
    // el reintento lejano que estaba agendado. Sin esto, volver la señal
    // no servía de nada durante otros 15 segundos.
    intentos = 0;
    if (reconectando) { limpiarTimers(); reconectando = false; }
    programarReconexion();
  }
});

/* ── Volver a la pestaña ─────────────────────────────────────── */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !quiereSonar) return;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // El navegador libera el Wake Lock solo al ocultar la pestaña y no lo
  // devuelve solo: si no se repide acá, una sesión larga donde se revisa
  // otra app y se vuelve deja la pantalla libre para apagarse con la
  // radio sonando.
  pedirWakeLock();
  // Al volver a la pestaña también se pregunta: puede haber estado horas
  // oculta y la radio haber vuelto en el medio.
  traerMeta();
  if (player.paused && !conectando && !reconectando && !enEspera) programarReconexion();
});

/* ═════════════════════════════════════════════════════════════════
   METADATA Y CONFIGURACIÓN
   ═════════════════════════════════════════════════════════════════ */
let cfgSeq = 0;
async function traerConfig() {
  const seq = ++cfgSeq;
  try {
    const r = await fetch(CONFIG, { cache: 'no-store' });
    if (!r.ok) return;
    const c = await r.json();
    if (seq !== cfgSeq) return;   // llegó una respuesta más nueva antes
    FEATURES = { ...DEFAULTS, ...c, ...leerOverridesLocales() };
    aplicarFeatures();
  } catch (e) { /* se queda con los valores de fábrica */ }
}

function aplicarFeatures() {
  $('history').style.display = FEATURES.historial ? '' : 'none';
  canvas.style.display       = FEATURES.vumetro   ? '' : 'none';
  actualizarOyentes();
  aplicarSkin(leerSkin());
}
/* Las once pieles que existen de verdad son las del dial: el marcado ES la
   lista, así que no hay una tabla acá que se pueda desincronizar con
   skins5.css. El <script> va al final del body, o sea que las paradas ya
   están parseadas cuando esto corre. */
const PIELES = new Set([].map.call(
  document.querySelectorAll('.parada[data-piel]'), p => p.dataset.piel).filter(Boolean));

/* Un nombre de piel que no existe se trata como "ninguna". Dos casos reales:
   · el Worker manda `skin: "default"` en /api/web-config, y `default` no
     existe en skins5.css — dejaba un data-skin puesto que no pintaba nada;
   · `fantasma` es lo que guarda el easter egg, y no es una de las once: esa
     la restaura el bloque del dial leyendo `entresijo:fantasma`.
   Importa más que antes: desde que el atributo va también en <html> (ver
   aplicarSkin), un valor que no significa nada queda sembrado en la raíz. */
function leerSkin() {
  const nombre = v => (v && PIELES.has(v)) ? v : null;
  try { return nombre(localStorage.getItem('entresijo:skin')) || nombre(FEATURES.skin); }
  catch (e) { return nombre(FEATURES.skin); }
}

// Fuentes extra que sólo un skin necesita: se cargan bajo demanda, no en
// el <head> para todo el mundo. index2 es el único caso hoy.
const SKIN_FONTS = {
  index2: 'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap'
};
/* ⚠️ NUNCA DURANTE EL GESTO, Y NUNCA BLOQUEANDO (18/08).
   Reportado en el teléfono: al soltar el dedo sobre una piel histórica el dial
   "queda cargando algo un segundo" y no se puede retomar el deslizamiento.
   Es la falla de CRITERIOS-DISENO §4.10 entrando por una puerta que la sesión
   de diseño NO PUEDE VER: el boceto no carga fuentes por piel, así que allá el
   dial desliza suave y acá no. Un caso de los de CRITERIOS.md §9 — el defecto
   vive justo en lo que un archivo tiene y el otro no.

   Un `<link rel="stylesheet">` es BLOQUEANTE para el renderizado. Inyectarlo
   al pasar por `index2` frena la página entera mientras viaja por la red, y en
   un teléfono eso es del orden del segundo — exactamente lo reportado.

   Dos cambios, y el primero es el que resuelve:

   1 · SE CARGA AL ARRANCAR, en segundo plano, no cuando se elige la piel. Es
       una sola fuente; traerla una vez cuando no hay nadie deslizando sale
       gratis, y después cambiar de piel no toca la red nunca.
   2 · Y SE CARGA SIN BLOQUEAR, con el truco de `media="print"`: el navegador
       la baja pero no la aplica ni frena el dibujo, y al terminar se pasa a
       `all`. Es el cinturón por si alguien elige la piel antes de que el
       arranque en segundo plano haya corrido. */
function cargarFuenteSkin(nombre) {
  const url = SKIN_FONTS[nombre];
  if (!url || document.querySelector('link[data-skin-font="' + nombre + '"]')) return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.media = 'print';                       // baja sin bloquear ni aplicar
  link.onload = function () { this.media = 'all'; };   // y recién ahí entra
  link.href = url; link.dataset.skinFont = nombre;
  document.head.appendChild(link);
}

/* Las fuentes de piel se traen cuando la página ya está quieta, así el dial no
   se encuentra nunca con la red. `requestIdleCallback` donde exista; si no, un
   temporizador, que para esto alcanza. */
function precargarFuentesDeSkin() {
  Object.keys(SKIN_FONTS).forEach(cargarFuenteSkin);
}
addEventListener('load', () => {
  if (window.requestIdleCallback) requestIdleCallback(precargarFuentesDeSkin, { timeout: 4000 });
  else setTimeout(precargarFuentesDeSkin, 2000);
});
/* EL ATRIBUTO VA EN LOS DOS LADOS: en <html> Y en #app (18/08).
   Iba sólo en #app, así que una piel redefinía --bg dentro del reproductor
   pero `body` lo seguía leyendo de :root — el fondo de la PÁGINA no cambiaba.
   Medido el 17/08 con el skin `blanco`: texto claro sobre fondo negro,
   1,08:1. Ilegible, y cualquier piel clara futura falla igual.
   No se saca de #app porque medirVu() y la portada de MediaSession leen
   variables desde ahí. Los selectores de skins5.css ya están escritos
   `:is(html, #app)` esperando exactamente esto — son los dos únicos lugares
   donde el atributo significa "esta es la piel puesta"; en cualquier otro
   (las marcas del dial llevan el suyo) significa otra cosa. */
function aplicarSkin(nombre) {
  const activo = FEATURES.skins ? (nombre || null) : null;
  const previo = app.dataset.skin || null;
  const raiz   = document.documentElement;
  if (activo) { app.dataset.skin = activo; raiz.dataset.skin = activo; cargarFuenteSkin(activo); }
  else        { delete app.dataset.skin; delete raiz.dataset.skin; }
  // La portada de MediaSession queda cacheada (ver mediaSession()): si el
  // skin cambió, invalidarla para que la vuelva a dibujar con los colores
  // nuevos la próxima vez que haga falta.
  if (activo !== previo) mediaMeta = null;
  /* ⚠️ EL VÚMETRO SE MARCA SUCIO, NO SE RELEE ACÁ (18/08).
     Estaba `leerColoresVu(); vuBase();` en esta línea, o sea un
     `getComputedStyle` —que fuerza recálculo de estilo sincrónico— más un
     redibujado de canvas CADA VEZ que cambia la piel. Y la piel cambia una vez
     por marca mientras el dedo desliza el dial, encima de los dos recálculos
     que ya fuerza `anclarBoton()`. Es trabajo mío, agregado el mismo día, y
     sólo existe en index5: el boceto no tiene vúmetro, así que la sesión de
     diseño no podía verlo.
     Marcarlo sucio y releer al dibujar mueve el costo fuera del gesto y lo
     pone donde ya se estaba dibujando igual. */
  vuSucio = true;
  if (!vuActivo) vuBase();
}
// Factoreado aparte para poder refrescar al instante desde el panel
// (togglear "oyentes" ahí no debería esperar hasta el próximo poll de 15s).
function actualizarOyentes() {
  const d = ultimoDato;
  if (FEATURES.oyentes && d && ('listeners' in d) && d.listeners > 0) {
    listenEl.textContent = d.listeners + ' escuchando';
  } else {
    listenEl.textContent = '';
  }
}

let metaSeq = 0, metaFallos = 0;
const META_FALLOS_AVISO = 3;   // ~45s de silencio antes de admitir que no sabemos

async function traerMeta() {
  const seq = ++metaSeq;
  try {
    const r = await fetch(INFO + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    if (seq !== metaSeq) return;   // llegó una respuesta más nueva antes: se descarta ésta

    metaFallos = 0;
    ultimoDato = d;

    // Qué reproducir. Nombre confirmado por el Worker (05/08) y viene
    // SIEMPRE, no sólo cuando cambia — así no hay que distinguir "no
    // cambió" de "no me lo mandaron".
    adoptarStream(d.streamUrl);
    anotarOrigen(d.origen);

    if (d.cfg_v !== undefined && d.cfg_v !== cfgVisto) {
      cfgVisto = d.cfg_v;
      traerConfig();
    }

    /* ⚠️ LA BAJADA LA MANDA EL WORKER, Y DE SU ANCHO CUELGA LA ALINEACIÓN.
       Ésta es la tercera de las tres maneras en que `--hist-ancho` se rompió
       (DISENO §6), y la única que el boceto no puede mostrar: allá la bajada
       es texto fijo en el marcado, así que medirla al cargar alcanza. Acá el
       marcado dice "RADIO SERRANA" y el Worker la reemplaza por "Desde
       Traslasierra con amor" — medido: 127 px contra 265. Sin volver a
       medir, el historial y el fader se alinean con un borde que la bajada
       ya no tiene, y por 138 px.
       Se remide sólo cuando el texto CAMBIÓ: esto corre en cada poll. */
    if (d.description && d.description !== descEl.textContent) {
      descEl.textContent = d.description;
      publicarAncho();
    }

    // 'listeners' puede NO venir. Ausente no es cero.
    actualizarOyentes();

    if (Array.isArray(d.history) && d.history.length && FEATURES.historial) {
      histItems.innerHTML = d.history.slice(0, 8).map(h => {
        const gen = !h.artist || h.artist.toLowerCase() === 'en vivo';
        return '<div class="h-item"><strong>' +
               (gen ? 'ESCUCHANDO AHORA' : esc(h.artist).toUpperCase()) +
               '</strong><span>' + esc(h.title || '') + '</span></div>';
      }).join('');
    }

    decidirCorte(d);
    repintar();

  } catch (e) {
    if (seq !== metaSeq) return;
    metaFallos++;
    // Una falla sola no es un corte: puede ser el mismo 0,34-2% de pérdida
    // de paquetes ya documentado para el audio. Recién tras varias fallas
    // seguidas se admite que no sabemos nada — antes de eso se sigue
    // mostrando el último dato bueno en vez de saltar a "SIN RESPUESTA".
    if (metaFallos >= META_FALLOS_AVISO) ultimoDato = null;
    // Si no pudimos preguntar, no trabamos el botón: el stream puede estar
    // perfecto y la duda es nuestra, no del oyente.
    btn.disabled = false;
    // Si quedó esperando el regreso y encima perdimos contacto con el
    // Worker, el despertador de arriba no va a sonar. Se vuelve al ciclo
    // de reintentos de audio, que no depende de que nadie nos conteste.
    if (enEspera && quiereSonar && ultimoDato === null) {
      enEspera = false;
      programarReconexion();
    }
    repintar();
  }
}

const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

/* ── La regla que gobierna el corte ──────────────────────────────
   Cuando el Worker NO pudo verificar, no se toca el audio ni se
   traba el botón: si el stream está llegando, está llegando.
   El monitor, ante la duda, alerta. El reproductor, ante la duda,
   NO destruye un stream que funciona. Son trabajos distintos.
   ─────────────────────────────────────────────────────────────── */
function decidirCorte(d) {
  if (!d.verified) { actualizarBoton(); return; }

  if (d.isLive) {
    // Volvió el aire. Si el oyente quedó esperando, retomamos SOLOS: él ya
    // pidió escuchar y nunca se arrepintió — no hay por qué obligarlo a
    // pedirlo de nuevo. Este es el despertador del corte confirmado.
    if (enEspera && quiereSonar) { enEspera = false; arrancar(); actualizarBoton(); return; }
    enEspera = false;

    /* Red de recuperación, RECUPERADA DE PRODUCCIÓN (index.html:283):
         if (userWantsToPlay && !isPlaying && !isLoading && !reconnectTimer)
             scheduleReconnect();
       El poll de metadata funciona como disparador de reconexión
       independiente del ciclo de audio: si el oyente quiere sonar, no
       suena, y no hay ya un reintento agendado, se engancha uno. Cubre el
       caso de que el ciclo de audio se haya quedado sin disparadores por
       cualquier motivo — es la malla que atrapa lo que se escapó de todo
       lo demás. index4 la había perdido.
       La guarda `!tReconexion` es la de producción y es la que evita el
       martilleo: si ya hay algo agendado, acá no se toca nada. */
    if (quiereSonar && !estaSonando && !conectando && !tReconexion) {
      programarReconexion();
    }
    actualizarBoton();
    return;
  }

  // Verificado y fuera del aire: el encoder se desconectó de verdad.
  // No se reintenta el audio contra un encoder apagado, pero tampoco se
  // borra la intención del oyente: queda en espera y se retoma arriba.
  if (quiereSonar && !enEspera) pausarPorEmisora();
  actualizarBoton();
}

/* ═════════════════════════════════════════════════════════════════
   REPINTADO CENTRAL
   ═════════════════════════════════════════════════════════════════ */
function repintar() {
  if (simulando) return;

  /* El audio sonando es prueba más fuerte que cualquier consulta que no
     llegó: si está sonando, la radio está al aire, y decir "SIN RESPUESTA"
     o "SIN CONEXIÓN" encima del audio que el oyente está escuchando es
     mentirle. Mismo principio que gobierna el corte: ante la duda, no
     contradecir el hecho. */
  if (estaSonando && (sinRed || !ultimoDato)) {
    pintar('aire');
    artistEl.textContent = 'ESCUCHANDO AHORA';
    titleEl.textContent  = 'Transmisión en vivo';
    return;
  }
  if (sinRed)      { pintar('sinRed');   return; }
  if (!ultimoDato) { pintar('sinRta');   return; }

  const d = ultimoDato;

  if (reconectando) { pintar('buscando');  return; }
  if (conectando)   { pintar('sintoniza'); return; }

  if (d.verified && !d.isLive) {
    // lastLiveAt sólo trae hora con corte confirmado. Si viene en null no hay
    // nada afirmable que mostrar, y no lo inventamos.
    const ms = d.lastLiveAt || null;
    const largo = ms ? (Date.now() - ms) > 30 * 60000 : false;
    pintar(largo ? 'fueraLargo' : 'fueraCorto');
    artistEl.textContent = ms ? haceCuanto(ms) : 'SIN SEÑAL';
    // El que se quedó esperando tiene que saber que no hace falta que
    // vuelva a apretar nada.
    if (enEspera) titleEl.textContent = 'Arranca solo cuando vuelva';
    return;
  }

  // Al aire (o sin verificar, que no es motivo para decir lo contrario)
  if (pausadoPorMi && !estaSonando) { pintar('pausa'); return; }

  const gen = !d.artist || d.artist.toLowerCase() === 'en vivo';
  pintar('aire');
  artistEl.textContent = gen ? 'ESCUCHANDO AHORA' : d.artist.toUpperCase();
  titleEl.textContent  = d.title || 'Transmisión en vivo';
  if (estaSonando) mediaSession(gen ? 'Entresijo Radio' : d.artist, d.title);
}

/* ═════════════════════════════════════════════════════════════════
   TELEMETRÍA
   ═════════════════════════════════════════════════════════════════ */
setInterval(() => {
  if (!estaSonando || !analyser) return;
  analyser.getByteFrequencyData(datos);
  let s = 0; for (let i = 0; i < datos.length; i++) s += datos[i];
  fetch(LIVE, {
    method: 'POST',
    body: JSON.stringify({ audio: (s / datos.length) > 2 })
  }).catch(() => {});
}, TELEMETRIA_MS);

/* ═════════════════════════════════════════════════════════════════
   PANEL OCULTO — cinco toques en el nombre de la radio
   ═════════════════════════════════════════════════════════════════ */
const LAYOUTS = [['layout-eje','Historial arriba'], ['layout-margen','Al margen'], ['layout-minimo','WhatsApp arriba']];
const GRISES  = [['legible','Legibles'], ['medio','Medios'], ['noir','Del original']];
const SIMS = [
  ['arranque','Detectando'], ['aire','En el aire'], ['pausa','En pausa'],
  ['sintoniza','Sintonizando'], ['buscando','Buscando'], ['fueraCorto','Corte corto'],
  ['fueraLargo','Corte largo'], ['sinRed','Sin conexión'], ['sinRta','Sin respuesta']
];
// Toggles reales, no de diseño: pegan sobre FEATURES vía overrides
// locales (localStorage), nunca al Worker. Sirven para probar algo en
// este navegador sin afectar a nadie más.
const TOGGLES = [['oyentes','Oyentes'], ['vumetro','Vúmetro'], ['historial','Historial'], ['skins','Skins']];
const SKINS = [
  ['', 'Noir'], ['13', '13 · glow-breath'], ['consola', 'Consola'],
  ['index2', 'Index2'], ['primigenio', 'Primigenio'], ['blanco', 'Blanco (accidente)']
];

// Estado crudo, para diagnosticar sin abrir devtools: lo que manda el
// Worker tal cual llega, más el estado interno de conexión/reconexión.
function textoDiagnostico() {
  const d = ultimoDato;
  const l = [
    'quiereSonar=' + quiereSonar + '  estaSonando=' + estaSonando,
    'conectando=' + conectando + '  reconectando=' + reconectando + '  intentos=' + intentos,
    'enEspera=' + enEspera + '  próx. reintento=' + (esperaReintento() / 1000) + 's',
    'streamUrl=' + (streamUrl === STREAM_FABRICA ? 'fábrica (Worker)' : streamUrl),
    'origen=' + (origenDestino ? origenModo + ' · ' + origenDestino : '(no informado)'),
    // La conexión que suena puede ser ANTERIOR al último cambio de origen:
    // en ese caso el oyente sigue recibiendo del servidor viejo aunque el
    // Worker ya apunte al nuevo. No es un error del campo.
    (estaSonando && origenDesde && conexionDesde && conexionDesde < origenDesde
      ? '  ⚠ suena desde antes del cambio de origen — recargar para tomarlo'
      : ''),
    'pausadoPorMi=' + pausadoPorMi + '  sinRed=' + sinRed + '  metaFallos=' + metaFallos,
    '── /api/radio-info ──'
  ];
  if (d) {
    l.push('verified=' + d.verified + '  isLive=' + d.isLive);
    l.push('offReason=' + d.offReason + '  lastLiveAt=' + d.lastLiveAt);
    l.push('cfg_v=' + d.cfg_v + '  listeners=' + ('listeners' in d ? d.listeners : '(ausente)'));
  } else {
    l.push('ultimoDato = null');
  }
  return l.filter(Boolean).join('\n');   // el aviso de origen sale vacío casi siempre
}

function armarPanel() {
  const p = $('dev-panel');
  const fila = (tag, items, onClick, activo) =>
    '<div class="dev-row"><span class="dev-tag">' + tag + '</span>' +
    items.map(([v, l]) =>
      '<button class="dev-btn' + (v === activo ? ' activo' : '') +
      '" data-a="' + onClick + '" data-v="' + v + '">' + l + '</button>').join('') +
    '</div>';
  const filaToggles = () =>
    '<div class="dev-row"><span class="dev-tag">Funciones (local, no toca al Worker)</span>' +
    TOGGLES.map(([k, l]) =>
      '<button class="dev-btn' + (FEATURES[k] ? ' activo' : '') +
      '" data-a="tog" data-v="' + k + '">' + l + ': ' + (FEATURES[k] ? 'ON' : 'OFF') + '</button>').join('') +
    '</div>';

  const skinActual = leerSkin();
  const skinNorm = (skinActual === 'noir' || !skinActual) ? '' : skinActual;

  p.innerHTML =
    fila('Estados', SIMS, 'sim', simulando) +
    fila('Layout', LAYOUTS, 'lay', [...app.classList].find(c => c.startsWith('layout-'))) +
    fila('Grises', GRISES, 'gris', app.dataset.grises || 'legible') +
    filaToggles() +
    fila('Skin', SKINS, 'skin', skinNorm) +
    '<div class="dev-row"><span class="dev-tag">Diagnóstico</span>' +
      '<pre id="dev-diag" style="font-size:9px;line-height:1.6;color:var(--text-mid);' +
      'white-space:pre-wrap;margin:0;font-family:ui-monospace,Consolas,monospace">' +
      textoDiagnostico() + '</pre></div>' +
    '<div class="dev-row">' +
      '<button class="dev-btn" data-a="reset">Sacar overrides locales</button>' +
      '<button class="dev-btn cerrar" data-a="off">Volver a lo real</button>' +
      // El museo NO se publica: es material de trabajo (19 versiones históricas
      // con textos escritos para adentro). Vive sólo en la copia local, así que
      // el enlace sólo aparece si estamos corriendo desde el disco — publicado
      // daría 404.
      (location.protocol === 'file:'
        ? '<a class="dev-link" href="museo/" target="_blank">Museo de versiones →</a>'
        : '') +
      '<button class="dev-btn" data-a="cerrar">Cerrar</button>' +
    '</div>';

  p.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.a, v = b.dataset.v;
    if (a === 'sim') { simulando = v; pintar(v); if (v === 'fueraCorto' || v === 'fueraLargo') artistEl.textContent = v === 'fueraLargo' ? 'HACE 6 HORAS' : 'HACE 2 MIN'; }
    if (a === 'lay')  { LAYOUTS.forEach(([c]) => app.classList.remove(c)); app.classList.add(v); }
    if (a === 'gris') { app.dataset.grises = v; }
    if (a === 'tog')  { guardarOverrideLocal(v, !FEATURES[v]); }
    if (a === 'skin') { try { localStorage.setItem('entresijo:skin', v); } catch (e) {} aplicarFeatures(); }
    if (a === 'reset') {
      try { localStorage.removeItem('entresijo:overrides'); localStorage.removeItem('entresijo:skin'); } catch (e) {}
      FEATURES = { ...DEFAULTS };
      aplicarFeatures();
      traerConfig();
    }
    if (a === 'off') { simulando = null; repintar(); }
    if (a === 'cerrar') { p.classList.remove('open'); return; }
    armarPanel(); p.classList.add('open');
  }));
}

// El diagnóstico se refresca solo mientras el panel está abierto — no
// hace falta recargar todo el panel (perdería el scroll) para ver
// datos que cambian cada 15s con el poll de metadata.
setInterval(() => {
  const p = $('dev-panel'), diag = $('dev-diag');
  if (p.classList.contains('open') && diag) diag.textContent = textoDiagnostico();
}, 3000);

let toques = 0, tToques = null;
$('station-name').addEventListener('click', () => {
  toques++;
  clearTimeout(tToques);
  tToques = setTimeout(() => { toques = 0; }, 2000);
  if (toques >= 5) {
    toques = 0;
    armarPanel();
    $('dev-panel').classList.add('open');
  }
});


/* ═════════════════════════════════════════════════════════════════
   EL DIAL — puesto por la sesión de DISEÑO ‡ el 17/08/2026

   ⚠️ Esto lo escribió la sesión de diseño, que por reparto NO toca el JS de
   este archivo. La excepción se hizo a propósito y está anotada en
   CRITERIOS-DISENO: el comportamiento del dial ES el diseño —que la tira se
   mueva y la selección pase por el centro no es un detalle de implementación,
   es la idea— y entregarlo mudo era entregar la mitad.

   Es autocontenido y conservador: lo ÚNICO que le hace al reproductor es
   llamar a aplicarSkin(), que ya existía, y guardar en la misma llave de
   localStorage que ya usaba el panel. No toca audio, ni reconexión, ni timers,
   ni estado. Si estorba, se borra este bloque entero y el resto sigue igual.

   El marcado y el CSS son de diseño y están completos: las once paradas viven
   en el HTML porque son datos fijos —las fechas de las versiones no cambian—.
   ═════════════════════════════════════════════════════════════════ */
(function () {
  const dial = $('dial'), tira = $('dial-tira'), aviso = $('dial-aviso');
  if (!dial || !tira) return;

  const paradas = [].slice.call(tira.querySelectorAll('.parada'));
  if (!paradas.length) return;

  const params   = new URLSearchParams(location.search);
  const comillas = v => (v || '').trim().replace(/^["']|["']$/g, '');

  /* ⚠️ EL GUARDADO VA DIFERIDO, Y NO ADENTRO DE aplicar().
     `localStorage` es SINCRÓNICO y en un teléfono escribe a disco: bloquea
     el hilo principal decenas de milisegundos, y esto se llamaba justo
     cuando el navegador está animando el imán del scroll.
     Fue una de las seis hipótesis del traqueteo al soltar
     (CRITERIOS-DISENO §4.9) y NO era la causa — difiriéndolo el síntoma
     siguió igual. Se queda igual, porque el riesgo es real aunque no fuera
     el culpable: era lo único que bloqueaba el hilo de verdad.
     Si el oyente sigue pasando pieles el reloj se reinicia, y se escribe
     una sola vez al final. */
  let timerGuardado = null;
  function guardarPielMasTarde(piel) {
    clearTimeout(timerGuardado);
    timerGuardado = setTimeout(() => {
      try { localStorage.setItem('entresijo:skin', piel); } catch (e) {}
    }, 500);
  }

  /* `aplicar` se llama en CADA CUADRO mientras la tira se desliza, así que
     todo lo que hay adentro paga por cuadro. Reportado el 18/08: al cambiar
     de piel el dial "se cuelga unos segundos" y no se puede seguir pasando.

     La causa era `anclarBoton()`, que fuerza dos recálculos de maquetación y
     saca y pone el atributo de piel: tocar una marca dispara un
     desplazamiento suave, y ese desplazamiento dispara decenas de llamadas
     seguidas. Multiplicado por dos recálculos sincrónicos cada una, la tira
     dejaba de responder justo cuando el dedo seguía puesto.

     Ahora el trabajo caro sale sólo cuando la piel CAMBIÓ de verdad. Las
     otras decenas de llamadas por gesto salen por el atajo de arriba y no
     cuestan nada. `ultimaPiel` se inicializa en null y no en '' porque ''
     es una piel válida — es "hoy". */
  let ultimaPiel = null;
  function aplicar(b, guardar) {
    if (!b) return;
    const piel = b.dataset.piel || '';
    if (piel === ultimaPiel) return;
    ultimaPiel = piel;
    /* Primero limpiar: si venías de una piel sorteada por el easter egg,
       sus variables en línea siguen puestas sobre <html> y le ganan a todo.
       Sin esto, volver a "hoy" no devuelve el reproductor original. */
    /* Elegir una piel es pedir la radio de esa fecha, y ésa se ve como se
       veía: si estaba puesta la pantalla de texto, se sale de ella. */
    if (typeof salirModoAscii === 'function') salirModoAscii();
    if (typeof limpiarFantasma === 'function') limpiarFantasma();
    aplicarSkin(piel || null);
    if (guardar) guardarPielMasTarde(piel);
    paradas.forEach(p => p.setAttribute('aria-pressed', String(p === b)));
    if (aviso) {
      // El nombre y la fecha salen del CSS de cada piel, no de una tabla acá.
      const cs = getComputedStyle(app);
      const nombre = comillas(cs.getPropertyValue('--skin-nombre'));
      const fecha  = comillas(cs.getPropertyValue('--skin-fecha'));
      aviso.textContent = nombre + (fecha ? ' · ' + fecha : '');
    }
    anclarBoton();
  }

  /* ── EL BOTÓN NO SE MUEVE AL CAMBIAR DE PIEL (DISENO §9.3) ────────
     Cada piel tiene su tipografía y su cabecera mide distinto —de 160 a 228
     px hasta el botón, medido sobre las once—, así que al pasar el dial el
     círculo saltaba hasta 69 px. Acá se mide cuánto ocupa la cabecera con la
     piel puesta y se publica la diferencia contra un ancla; el CSS la
     convierte en margen sobre .player-app. El botón queda clavado.
     El ancla es "dónde va el botón" con la piel base.

     Sin el dato publicado el CSS vale 0 y todo se comporta como antes: no se
     rompe nada, sólo vuelve a saltar el botón. */

  /* El tope es un cinturón contra mediciones absurdas, no un límite de
     diseño, y estaba mal calibrado: se puso en 24 razonando que "ninguna
     piel se aparta más de eso", y es falso — `consola` necesita 55, porque
     su cabecera mide 228 contra los 173 de la base. Con 24, esa piel se
     quedaba a mitad de camino y el botón le saltaba 31 px.
     60 cubre el rango real medido sobre las once y sigue acotando cualquier
     disparate. La protección de verdad contra medir mal es
     `composicionQuieta()`. */
  let ANCLA = null, ANCLA_ANCHO = 0;
  const TOPE_ANCLA = 60;

  /* Cuánto ocupa la cabecera: del borde de arriba del reproductor al botón.
     NO hace falta poner la corrección en cero para medir, y ponerla era la
     causa de un parpadeo al cambiar de piel —la composición saltaba un
     cuadro al valor sin corregir y volvía—. Desde que el margen vive en
     `.player-app` en vez de en `.top-bar`, mueve al reproductor ENTERO: el
     borde de arriba y el botón se mueven juntos, así que la distancia entre
     los dos no depende del margen. Medir sin tocar nada da lo mismo. */
  function medirCabecera() {
    /* [index0] /zoomApp(): la resta de dos rects da píxeles de PANTALLA, y
       el número se usa después como una medida de la composición (que vive
       adentro del zoom). Sin dividir, el ancla de las pieles se corre lo
       mismo que aprieta el encaje. */
    return (document.querySelector('.core-ui').getBoundingClientRect().top
         - app.getBoundingClientRect().top) / zoomApp();
  }

  /* El ancla se mide SIEMPRE con la piel base, sacando la piel puesta un
     instante y devolviéndola. Sin esto, revalidar al cambiar el ancho
     tomaba la medida con la piel que estuviera activa, y esa piel pasaba a
     ser la referencia — que fue exactamente cómo se coló un margen de 14 px
     en la primera prueba del arreglo. Sacar y devolver el atributo en la
     misma vuelta no repinta: el navegador recalcula la maquetación cuando
     se lo pide `getBoundingClientRect`, pero no llega a dibujar hasta que
     termina el bloque.

     ⚠️ SE SACA DE LOS DOS LADOS, de <html> y de #app. El boceto sacaba sólo
     el de #app porque era el único que había. Desde que el atributo va
     también en la raíz (ver aplicarSkin), sacarlo de uno solo deja a los
     elementos de adentro heredando la piel desde <html>: se mediría con la
     piel puesta creyendo que se mide con la base, o sea el cuidado 2 de
     DISENO §9.3 roto por la puerta de al lado. */
  function tomarAncla() {
    const raiz = document.documentElement;
    const piel = app.dataset.skin;
    /* Y TAMBIÉN la marca de las pieles fijas del easter egg. Se sacan las DOS
       o el ancla se mide con una piel puesta creyendo que se mide con la
       base — que es el cuidado 2 de arriba roto por la puerta de al lado.
       `data-fantasma` cuelga reglas de CSS (ver MODO TERMINAL en skins5.css)
       que cambian el relleno y el borde del reproductor, o sea que afecta
       exactamente lo que esta función está midiendo. */
    const fant = app.dataset.fantasma;
    if (piel) { delete app.dataset.skin; delete raiz.dataset.skin; }
    if (fant) { delete app.dataset.fantasma; delete raiz.dataset.fantasma; }
    ANCLA = medirCabecera();
    ANCLA_ANCHO = window.innerWidth;
    if (piel) { app.dataset.skin = piel; raiz.dataset.skin = piel; }
    if (fant) { app.dataset.fantasma = fant; raiz.dataset.fantasma = fant; }
  }

  /* Clases que ponen la composición en movimiento. Mientras alguna esté
     puesta, NO se puede medir: `getBoundingClientRect` incluye las
     transformaciones, así que medir a un elemento que está cayendo devuelve
     dónde está en ese cuadro, no dónde vive.
     Reportado el 18/08: "cuando caen las letras con la matrix no se arma
     bien la composición, queda todo encimado arriba". Medido: el ancla
     quedaba en el tope del clamp y ahí se quedaba para siempre, porque
     `aplicarPiel()` corre A MITAD del efecto —que es justamente la gracia,
     cambiar bajo cobertura— y de paso llamaba a medir. */
  const EN_MOVIMIENTO = ['estatica', 'girando', 'desvaneciendo', 'en-efecto'];
  function composicionQuieta() {
    return !EN_MOVIMIENTO.some(c => app.classList.contains(c));
  }

  /* ?ancla=off — EXPERIMENTO DE AISLAMIENTO, no una opción del producto.
     Hipótesis a falsar: el "no se puede retomar el deslizamiento" lo causa
     esta función, que al cambiar de piel escribe `--ancla-cabecera` y el CSS
     lo convierte en `margin-top` sobre `.player-app` — o sea que MUEVE EL
     REPRODUCTOR ENTERO, con la tira adentro, mientras el dedo la desplaza.
     Encaja con todo lo medido en el teléfono: no es tarea larga (tarea=0 en
     69 gestos), no ensucia cuadros (cuadrosLentos=0 en los peores), pasa con
     piel histórica y no con "hoy", y no siempre — porque sólo molesta cuando
     la corrección CAMBIA, y para varias pieles vale 0.

     Con la bandera puesta el botón vuelve a saltar al cambiar de piel, que es
     como estaba antes de DISENO §9.3. Es el único efecto: no toca el scroll,
     ni el gesto, ni el easter egg. Una prueba de aislamiento que rompe el
     caso que quiere medir no aísla nada (CRITERIOS-DISENO §4.9), así que
     ésta no hace más que no escribir una variable. */
  const SIN_ANCLA = params.get('ancla') === 'off';

  function anclarBoton() {
    if (SIN_ANCLA) return;
    if (!composicionQuieta()) return;   // ver EN_MOVIMIENTO
    /* SE REVALIDA AL CAMBIAR EL ANCHO. Se tomaba una sola vez, al cargar, y
       entonces cualquier re-flujo de la cabecera que NO viniera de un cambio
       de piel la envenenaba: cargar angosto (la bajada se parte en dos
       líneas), ensanchar, y mover el dial metía un margen que en una prueba
       llegó a 83 px. Al cambiar el ancho, la cabecera de la piel base mide
       otra cosa y el ancla vieja ya no dice nada. */
    if (ANCLA === null || window.innerWidth !== ANCLA_ANCHO) tomarAncla();
    const hasta = medirCabecera();
    const correccion = Math.max(-TOPE_ANCLA, Math.min(TOPE_ANCLA, Math.round(ANCLA - hasta)));
    app.style.setProperty('--ancla-cabecera', correccion + 'px');
  }

  // La que quedó bajo la aguja. La aguja no se mueve: está fija en el centro.
  function bajoLaAguja() {
    const centro = tira.getBoundingClientRect().left + tira.clientWidth / 2;
    let mejor = null, dist = Infinity;
    paradas.forEach(p => {
      const c = p.getBoundingClientRect();
      const d = Math.abs((c.left + c.right) / 2 - centro);
      if (d < dist) { dist = d; mejor = p; }
    });
    return mejor;
  }

  /* Centrar con la cuenta exacta y NO con scrollIntoView: ése no garantiza
     dónde queda la tira, y al abrir dejaba el scroll en cero —o sea la primera
     marca bajo la aguja—, así que recargar te mandaba a la primera piel. */
  function centrar(b, suave) {
    const cb = b.getBoundingClientRect(), ct = tira.getBoundingClientRect();
    tira.scrollTo({
      left: tira.scrollLeft + (cb.left + cb.width / 2) - (ct.left + tira.clientWidth / 2),
      behavior: suave ? 'smooth' : 'auto'
    });
  }

  /* Se develan al tocarlo: en reposo es una línea de marcas apagadas que
     divide y no pide nada, pero una línea que además es un control no puede
     ser muda para siempre. Se apaga sola. */
  let apagar;
  function develar() {
    dial.classList.add('tocando');
    clearTimeout(apagar);
    apagar = setTimeout(() => dial.classList.remove('tocando'), 1600);
  }
  ['pointerdown', 'pointermove', 'touchstart'].forEach(ev =>
    dial.addEventListener(ev, develar, { passive: true }));

  /* Se escucha el scroll de la TIRA, no el de la página, y se lee en el cuadro
     siguiente para no medir una vez por píxel. El imán y la inercia los hace el
     navegador con scroll-snap; acá sólo se mira qué quedó al centro. */
  let pendiente = false, listo = false;
  /* `rodando` la prende el easter egg mientras la tira gira sola. Sin esto,
     el giro dispara este mismo manejador decenas de veces y va cambiando de
     piel a cada marca que pasa por la aguja: verificado el 18/08, durante el
     giro el aviso iba cantando "La primera de todas", "El accidente"… Once
     cambios de piel en un segundo no es un efecto, es un estroboscopio — y
     encima llega DESPUÉS de haber bajado la estática a 3 destellos por
     segundo por esa misma razón. Durante el giro la piel no se toca; la que
     vale es la sorteada, y entra al final. */
  let rodando = false;
  /* ?dial=tap deja de cambiar la piel mientras se desliza; sólo cambia al
     tocar una marca. Se declara ACÁ y no más abajo: en el boceto estaba
     definida DESPUÉS del listener que la usa, así que `var` la izaba sin
     valor y cada evento de scroll tiraba un ReferenceError — decenas de
