       distancia, no el reloj: la banda tarda lo que tarda en recorrer la
       pista. Y la cuenta de cuánto recorre por milisegundo **le erra por
       1,8** —medido en una corrida real, 2.102 ms contra 3.900 previstos—, así
       que dimensionar la pista con la cuenta sola da un giro que dura la mitad.

       El 1,8 es empírico y está anotado como tal: **no sé de dónde sale**, y
       tratar de deducirlo costó varias vueltas. Lo que sí está resuelto es que
       no importe: la duración se calibra sola a los 250 ms contra lo que la
       banda recorrió de verdad, así que si el factor cambia de aparato, la
       curva se acomoda igual. Esto sólo decide cuánta banda hay que preparar.

       `DURA_NOMINAL` pasa a ser lo que se quiere que dure el giro. */
    /* ⚠️ EN 1, DESDE EL 20/08. Este factor era un parche empírico: la banda
       parecía moverse 1,8 veces más rápido que la cuenta. **No se movía más
       rápido: saltaba de marca en marca**, porque el imán del scroll volvía a
       prenderse a mitad del giro. Arreglado eso, el modelo y la realidad
       coinciden — medido: la meseta da 16,0 px por cuadro, que es exactamente
       el pico pedido. Con el 1,8 puesto la pista quedaba al doble y la banda se
       quedaba sin recorrido antes de terminar de frenar. */
    /* ⚠️ LA PISTA LLEVA MARGEN, Y AHORA ES A PROPÓSITO (20/08)
       Todo el problema del frenado venía de tener la DISTANCIA como límite y el
       tiempo como consecuencia: la banda se quedaba sin pista con el frenado a
       medio hacer. Medido en la última corrida: recorrió 2.249 px en 2.903 ms y
       la curva necesitaba unos 230 px más para llegar a cero — que son los
       últimos 800 ms del frenado, porque el tramo lento es el que más distancia
       pide en proporción al tiempo, y es justo el que faltaba.

       Ahora manda el TIEMPO: la curva corre entera hasta velocidad cero, y la
       pista se prepara con un 35 % de más para que nunca sea ella la que corte.
       Sobrar banda no cuesta nada —son copias que se borran— y faltar banda

    var MARGEN_PISTA = 1.20;   /* la distancia ya es exacta; el margen es red */
    var vueltas = Math.max(2, Math.ceil(
      (distFisica * MARGEN_PISTA - espaciador) / periodo0));
    var periodo = prepararTira(vueltas);

    /* ⚠️ EL PICO TIENE UN TECHO FÍSICO: 35 px por cuadro, que es lo que
       mide una marca (medido en la página, no estimado).
       Si la banda avanza más que eso por cuadro, cada cuadro salta más de
       una marca entera y el ojo no puede emparejar una con la siguiente:
       el movimiento parpadea o parece ir al revés. Es el efecto que hace
       que las ruedas de un carro giren para atrás en el cine.
       Se probó a pedido con 44 (≈100 marcas/s) y de ahí venían los dos
       reportes que costaron varias vueltas —"no hay continuidad" y "gira
       para el otro lado"—. No era ajuste: era muestreo insuficiente.
       24 deja 0,69 marcas por cuadro. Para ir más rápido de verdad hay que
       separar menos las marcas o dibujar el barrido con desenfoque de
       movimiento; subir este número lo empeora. */
    /* PICO de 24 a 21: 0,60 marcas por cuadro contra 0,69. El techo medido es
       35 —el paso entre marcas— y bajar tres puntos deja más aire contra ese
       techo sin que el giro pierda energía. Es el "apenas" que se pidió; si
       hay que bajar más, éste es el número, no el exponente de arriba. */
    /* CAIDA de 2,4 a 3,8: menos tiempo arriba. A los 800 ms de empezar a
       caer, con 2,4 seguía al 78 % del pico; con 3,8 está al 67 %. */
    /* PICO 28 (19/08, pedido: "un poco más de velocidad"). El techo medido es
       35 px por cuadro —el paso entre marcas—, así que 28 son 0,80 marcas por
       cuadro y sigue por debajo. Arriba de 35 el sentido del giro se vuelve
       ambiguo y no hay ajuste que lo salve: es muestreo, no gusto. */

    /* AHORA SÍ se suelta la goma, y su estiramiento pasa a ser posición:
       se corre el scroll exactamente lo que la banda estaba estirada, así
       el cuadro siguiente la encuentra donde ya estaba y sale de ahí. */
    tira.scrollLeft += estirado;
    dial.classList.remove('tirando');

    var t0 = performance.now();
    var largo = tira.scrollWidth - tira.clientWidth;
    /* Y ACÁ SE CIERRA EL ATERRIZAJE: la duración se ajusta a la distancia que
       falta de verdad, medida después de que el estirado se convirtió en
       posición. Se acota a ±25 % por seguridad: si por lo que fuera la
       geometría diera un número absurdo, es preferible un giro con la duración
       de siempre que uno de doce segundos. */
    /* ══════════════════════════════════════════════════════════════
       EL TRINQUETE — cómo termina un dial, y por qué la curva sola no alcanza
       (19/08, reportado tres veces: *"al final se freeza"*)

       El movimiento estaba pensado como **una curva de velocidad que dura X
       segundos**, con la distancia saliendo de ahí. Se ajustó el pico, el
       piso, la caída, la forma de la caída y la duración, y el final seguía
       muriendo igual — porque **cualquier velocidad que baja suave termina en
       un tramo donde la banda se mueve y el ojo no lo registra**. Con la
       caída lineal ese tramo son 648 ms; con la potencia eran 1.291. No hay
       número que lo saque: está en el modelo.

       Una ruleta no se piensa en velocidad, se piensa en **marcas**. Lo que el
       ojo sigue al final no es cuánto avanza por segundo: es *cuánto tarda en
       llegar la próxima marca*. Por eso una ruleta de verdad no se arrastra —
       tic … tic … tic .. tic . tic— y la última encaja.

       Entonces el giro pasa a tener dos tiempos:

         · **el vuelo**, con la curva de siempre, hasta la antesala de las
           últimas marcas;
         · **el trinquete**, que recorre esas marcas de a una, cada salto con
           su propia duración, cada vez más largas.

       Las posiciones de encaje no se inventan: se leen del marcado. Cada marca
       tiene un `scrollLeft` que la deja bajo la aguja, y ésos son los destinos.
       El último es el tope, que es donde la banda tiene que quedar. */
    /* ══════════════════════════════════════════════════════════════
       LA BANDA PARA DONDE PARA, Y EL DETENTE LA ACOMODA DESPUÉS (20/08)

       Éste es el cambio de fondo, y corrige un error de diseño que arrastró
       toda la sesión: **el destino era un punto fijo y la curva tenía que
       encajar en esa distancia**. De ahí salieron, uno tras otro, el vuelo que
       esperaba al reloj, el umbral de 1 px, el factor 1,8, la calibración de
       los 250 ms y el frenado que se cortaba: todos parches al mismo error.

       Una rueda no funciona así. Gira, la fricción la frena, **para donde
       para** —eso no se sabe de antemano— y recién ahí el imán la acomoda al
       casillero más cercano. Ahora es eso:

         · el vuelo corre la curva ENTERA, hasta velocidad cero;
         · el tope sólo existe como red de seguridad, con margen de sobra;
         · y cuando para, se busca el casillero y la banda vuelve a él.

       El casillero se elige HACIA ATRÁS a propósito: la banda siempre se pasa
       un poco y vuelve, que es la inercia que se pidió. Si se eligiera el más
       cercano en cualquier dirección, la mitad de las veces iría para adelante
       y se leería como una corrección, no como un rebote. */
    var destinoVuelo = largo;
    /* ⚠️ Y LA DURACIÓN NO SALE DE LA PISTA (20/08). Acá decía
       `DURA = falta / recorridoPorMs`, o sea: "estirá la curva hasta que cubra
       toda la banda disponible". Con eso el margen de pista se evaporaba —
       cuanta más banda se preparaba, más se estiraba el giro— y volvíamos al
       mismo lugar: la distancia mandando sobre el tiempo.

       El giro dura **lo que tiene que durar**. La banda alcanza porque se
       preparó con margen; si sobra, sobra y no pasa nada. */
    var s0Vuelo = tira.scrollLeft;
    var vel = 0;   /* px/s, el estado que integra el modelo de rozamiento */

    /* ⚠️ EL MOVIMIENTO VA POR TIEMPO, NO POR CUADRO (19/08, reportado)
       *"En la PC no se ve bien el movimiento al tirar del dial."*

       El lazo sumaba la velocidad **una vez por cuadro**, y la curva está
       escrita en píxeles POR CUADRO dando por sentado que hay 60 por segundo.
       En un monitor de 144 Hz hay 144: la banda recorre **2,4 veces más** en el
       mismo tiempo. Antes eso pasaba desapercibido porque sobraba banda —había
       catorce copias para un recorrido de 2.145 px—; desde que las copias son
       las justas para aterrizar en el tope, la banda **choca contra el final a
       los dos quintos del giro y se queda clavada** el resto. De ahí que en la
       PC se vea mal y en el teléfono no.

       El arreglo es el de siempre para una animación: **integrar sobre el
       tiempo real**. La curva sigue diciendo píxeles por cuadro de 60 —los
       números medidos no se tocan, el techo de 35 sigue significando lo
       mismo— y cada cuadro avanza lo que le corresponde por su duración.
       En 144 Hz cada cuadro avanza menos y hay más cuadros: el recorrido es
       el mismo, y encima el muestreo del movimiento sale más fino.

       El `dt` se acota a 50 ms: si el navegador se cuelga medio segundo, la
       banda no puede pegar un salto de 800 px para "recuperar" el tiempo
       perdido — eso se vería como un tirón, que es justo lo que no queremos. */
    var tPrevio = 0, sinAvanzar = 0;

    /* ⚠️ ACÁ VIVÍA EL TRINQUETE, y se sacó el 20/08 después de probarlo.
       Era el final por tics: las últimas cinco marcas de a una, con saltos
       cada vez más largos. Resolvía el arrastre —no hay velocidad baja si hay
       silencios entre movimientos— pero al mirarlo se siente **trabado**, que
       fue el reporte: la pausa de 500 ms del último tic se lee como que el
       dial se colgó, no como un ritmo.
       Lo reemplaza la física continua de `velocidadGiro()`: envión corto y
       desaceleración que aprieta al final. La medición del trinquete quedó en
       el registro por si alguna vez se quiere volver: pausas de 66, 100, 200
       y 500 ms, con el vacío creciendo 41 → 76 → 120 → 164. */

    (function rodar(t) {
      var ahora = t || performance.now();
      var pasado = ahora - t0;
      /* `dt` REAL entre cuadros, en segundos, topeado a 50 ms (si el navegador
         se cuelga, la banda no pega un salto para "recuperar"). */
      var dt = (tPrevio ? Math.min(50, ahora - tPrevio) : 0) / 1000;
      tPrevio = ahora;

      /* LA CURVA. El pico se acortó y el frenado se alargó, porque lo que
         hay que ver es la desaceleración, no la velocidad máxima:
           · hasta el 10 %: el zafón. Sube de golpe.
           · hasta el 24 %: el pico, corto — apenas un cuarto del tiempo.
           · el 76 % restante: frenando, con exponente 2,2 para que la
             caída de velocidad se note a simple vista. Hacia PISO y no
             hacia cero: la banda sigue moviéndose cuando el efecto se
             lleva la pantalla. */
      /* Dos tramos nada más: el zafón —tres cuadros, casi vertical— y una
         sola exponencial que no se interrumpe hasta el final. Los tres
         tramos de antes hacían que el frenado arrancara tarde; una ruleta
         empieza a perder fuerza desde el primer giro. */
      /* El zafón de tres cuadros y una sola exponencial suave. Exponente
         2,4 y no 4 ni 6: con los altos la velocidad se derrumbaba en el
         primer segundo y el resto era arrastre. */
      /* ⚠️ EL ARRANQUE, APENAS MÁS SUAVE (19/08). Reportado: "la velocidad
         inicial hace que por los fps parezca que gira hacia el otro lado".
         Es el efecto de la rueda de carro, y la medición dice dónde está el
         límite: el paso entre marcas es de **35 px** (44 entre días), así que
         más de 35 px por cuadro es más de una marca por cuadro y el sentido
         se vuelve ambiguo. `PICO` en 24 da 0,69 marcas por cuadro — está por
         debajo, o sea que la velocidad de CRUCERO no era el problema.
         El problema es el tramo de subida: con exponente 0,4 sobre el primer
         3 %, el primer cuadro ya salta de 0 a 11,6 px y el tercero está en
         16,8 — la aceleración es tan brusca que los dos o tres cuadros del
         zafón caen encima del umbral perceptivo aunque el número no lo diga.
         Con 0,7 la subida llega al mismo pico en el mismo tiempo pero
         repartida: 5,6 · 9,2 · 12 · 14,4 en vez de 11,6 · 14,6 · 16,8 · 18,6.
         El zafón se sigue sintiendo; lo que se va es el primer salto ciego. */
      /* ⚠️ LA RAMPA DURA 550 ms, NO 138 (19/08). Reportado tres veces con
         palabras distintas —"parece que gira al otro lado", "salta", "no se ve
         el hueco"— y las tres son lo mismo: la banda llegaba a velocidad de
         crucero en el 3 % de la duración, o sea ocho cuadros. Las primeras
         marcas entraban ya a fondo, y a fondo el ojo no puede seguir un paso
         de 35 px: se pierde el sentido del giro Y el espacio entre marcas.
         Bajar el pico no alcanzaba porque el problema no era la velocidad
         final sino cuánto tarda en llegar. Ahora sube durante el 12 % —unos
         550 ms, medio segundo largo— con una curva suave de verdad
         (`smoothstep`, que arranca y termina con pendiente cero) en vez de
         una potencia que sale disparada del origen.
         El primer cuadro pasa a 2,2 px: se ven las marcas entrar de a una, y
         recién después la banda toma vuelo. El zafón sigue estando, pero
         ahora es un zafón que se puede mirar. */
      /* ── LA SALIDA, EN TRES TIEMPOS ────────────────────────────────
         Pedido: *"que se viera el movimiento de que la marca desaparezca
         moviéndose hacia la izquierda primero, y luego la tira, con una
         pausa"*. Es una anticipación, la misma que usa cualquier animación
         para que un arranque se lea como intención y no como un salto.

           1 · EL PASO   (0 a 4 %, ~185 ms)  la marca que estaba bajo la aguja
               se va hacia la izquierda, sola, a velocidad de lectura. Recorre
               unos 35 px: exactamente un paso entre marcas.
           2 · LA PAUSA  (4 a 7,5 %, ~160 ms) casi se detiene. Es el respiro
               que separa el gesto de lo que viene, y lo que hace que después
               se lea como que la rueda ARRANCA en vez de que ya venía.
           3 · EL VUELO  (7,5 a 18 %, ~480 ms) recién ahí acelera hasta el
               pico, con `smoothstep` —pendiente cero en las dos puntas— y no
               con una potencia, que sale disparada desde el origen.

         Los tres tramos usan la misma curva suave, así que no hay ningún
         quiebre entre ellos: la velocidad nunca da un salto.

         ⚠️ EL PICO VUELVE A 24. Lo había bajado a 21 persiguiendo la
         sensación de "gira al otro lado", y esa sensación no era el pico
         —0,69 marcas por cuadro está por debajo del techo de 35 px— sino lo
         rápido que se llegaba. Con la rampa arreglada, bajarlo sólo le quita
         energía al giro. Reportado: "noto menos velocidad, eso no
         necesariamente me gusta". */
      /* ── LA SALIDA, EQUILIBRADA ────────────────────────────────────
         La versión anterior tenía una pausa que bajaba a 1 px por cuadro, y
         eso se leía como un FRENO en medio del arranque: "acelera y frena, es
         raro". Una anticipación no es frenar, es esperar — el movimiento no
         tiene que retroceder ni detenerse, sólo dejar de crecer.

           1 · EL PASO   (0 a 3,5 %)  la marca bajo la aguja se va sola hacia
               la izquierda, unos 35 px: un paso entre marcas, a velocidad de
               lectura.
           2 · LA ESPERA (3,5 a 6 %)  se sostiene, NO baja. Es el respiro que
               separa el gesto de lo que viene.
           3 · EL GOLPE  (6 a 11 %)  y acá pega. La curva es ease-OUT
               —`1-(1-u)²`, que sale rápido y se acomoda al final— y no
               `smoothstep`, que entra despacio: un golpe es justamente eso,
               energía adelante.
           4 · Y CAE     con `CAIDA` más alta que antes, así pasa MENOS tiempo
               arriba. Ése era el problema de fondo: no la velocidad máxima,
               sino cuánto rato se quedaba ahí — "quedaba mucho tiempo
               acelerado, eso confundía la sensación". */
      /* ⚠️ EL ESCALONCITO DE VELOCIDAD — ARREGLADO (19/08, reportado)
         Reportado como *"un escaloncito de velocidad en la física"*, y estaba
         exactamente donde la cuenta dice que tenía que estar: en el empalme de
         LA ESPERA con EL GOLPE.

         La espera era un tramo PLANO —velocidad constante en `SALIDA`— y el
         golpe entraba con `1-(1-u)²`, que arranca con pendiente máxima. O sea
         que la velocidad no daba un salto pero **la aceleración sí**: de 0 a
         880 en un solo cuadro. Medido sobre los 277 cuadros del giro, el
         tirón —el cambio de aceleración entre cuadros— daba **1,485 px por
         cuadro al cuadrado**, tres veces más que cualquier otro momento del
         giro, en el cuadro 17 (284 ms). Un valor continuo con derivada rota se
         ve como un escalón, y por eso se notaba sin poder señalarlo.

         El arreglo es fundir los dos tramos en UNA curva suave de 0,035 a
         0,11: `smoothstep` arranca con pendiente cero —así empalma sin quiebre
         con el paso, que termina plano— y llega al pico también con pendiente
         cero. Los dos tiempos siguen ahí: los primeros cuadros se sostienen
         casi planos (la espera: 6,0 · 6,8 · 8,5) y después acelera de verdad
         (el golpe: 11 · 13,9 · 17 · 20). Lo que se va es el codo.

         Medido, vieja contra nueva:

           tirón máximo   1,485 → 0,504 px/cuadro²   (−66 %)
           pico           28,0 → 28,0                (igual)
           cuándo         cuadro 30 → cuadro 30      (igual)
           desde el cuadro 22 las dos curvas coinciden al decimal

         ⚠️ Y NO es volver al `smoothstep` que ya se había descartado. Aquél
         era una rampa ÚNICA de 550 ms que reemplazaba todo el arranque, y le
         sacaba energía al giro —reportado: "noto menos velocidad"—. Acá el
         paso y su respiro siguen intactos, la ventana es la misma (0,035 a
         0,11) y el pico llega en el mismo cuadro. Lo único que cambia es que
         entre la espera y el golpe ya no hay un codo. */
      /* `v` es la velocidad en píxeles por cuadro de 60 —así están escritos
         todos los números de la curva y así se lee el techo de 35—, y
         `avance` es lo que le toca a ESTE cuadro según cuánto duró. */
      /* EL ZAFÓN y después TU MODELO. Los primeros GIRO_RAMPA ms la velocidad
         sube de 0 a V0 con `smoothstep` —el tirón de la goma al soltarse—; de
         ahí en más la gobierna el rozamiento: viscoso (exponencial) y seco
         (resta constante), integrados con `dt` real. `vel` está en px/s. */
      if (pasado < GIRO_RAMPA) {
        var pr = pasado / GIRO_RAMPA;
        vel = GIRO_V0 * (pr * pr * (3 - 2 * pr));
      } else {
        vel *= Math.exp(-dt / GIRO_TAU);   /* viscoso */
        vel -= GIRO_SECO * dt;             /* seco: hace que pare de verdad */
        if (vel < 0) vel = 0;
      }
      var avance = vel * dt;   /* px que le tocan a este cuadro */

      /* ⚠️ ACÁ HABÍA UNA CALIBRACIÓN a los 250 ms, que reescalaba la duración
         comparando lo recorrido de verdad contra lo previsto. Existía para
         compensar un factor de 1,8 que resultó ser **el imán del scroll**
         prendiéndose a mitad del giro — no la física. Arreglado eso, el modelo
         y la realidad coinciden (medido: la meseta da 16,0 px por cuadro, que
         es el pico exacto), y la calibración pasó a corregir contra ruido.
         Se saca: con la duración fija y la pista con margen, no hay nada que
         calibrar. */

      /* SUMANDO: la banda se corre hacia la izquierda y lo nuevo entra por
         la derecha, que es el sentido del tirón. */
      /* ⚠️ EL VUELO SE FRENA CONTRA EL TRINQUETE, NO CONTRA EL TOPE.
         Acá decía `Math.min(largo, …)`. Con eso la banda que llegaba antes de
         tiempo quedaba clavada contra la pared hasta que se cumpliera la
         duración — y eso es exactamente lo que se midió en una corrida real:

           cuadro 63 · t=2114 · v=43,5   la banda venía andando
           cuadro 64 · t=2146 · v=0      se detiene en seco
           cuadro 116· t=3882 · v=0      1.736 ms completamente quieta
           cuadro 117· t=3915 · v=123    recién ahí arranca el trinquete

         Un segundo y tres cuartos de nada en medio del giro. */
      var antesDeAvanzar = tira.scrollLeft;
      tira.scrollLeft = Math.min(destinoVuelo, antesDeAvanzar + avance);
      /* ⚠️ ¿AVANZÓ DE VERDAD? El navegador CUANTIZA `scrollLeft` —con zoom al
         125 % los escalones son de 0,8 px— así que pedirle una posición no
         garantiza que la tome. Si se pidió avanzar y no se movió, es que llegó
         al tope de lo que puede recorrer, y el vuelo terminó ahí. */
      if (avance > 0.2 && tira.scrollLeft - antesDeAvanzar < 0.1) sinAvanzar++;
      else sinAvanzar = 0;

      /* EL BRILLO VA ATADO A LA VELOCIDAD, pero NO durante el zafón.
         La velocidad arranca en el piso —el zafón sube desde 2 px por
         cuadro— así que `v / PICO` daba 0,08 en el primer cuadro: el glow
         se caía de 1 a casi nada justo en el momento de más energía, subía,
         y después bajaba. Ese pozo era el corte que se veía al arrancar.
         Durante el zafón se mantiene en 1 —que es donde lo dejó la carga— y
         recién cuando la velocidad llega al pico toma el relevo, y ahí las
         dos coinciden en 1: el empalme es exacto y de ahí baja sola con el
         frenado. */
      dial.style.setProperty('--tension',
        (pasado < GIRO_RAMPA ? 1 : Math.min(1, vel / GIRO_V0)).toFixed(3));

      /* ── LA VELOCIDAD, COMO DATO PARA EL MOTION BLUR (20/08) ────────
         *"Hay forma de simular más velocidad incluso en 60 fps."* — y la hay:
         el desenfoque de movimiento. El techo de medio paso (17,5 px/cuadro)
         sólo existe para marcas NÍTIDAS: lo que aliasa es el borde filoso de
         cada raya, que en el cuadro siguiente cae donde estaba la de al lado.
         Si la raya se estira en una veta —blur horizontal proporcional a la
         velocidad— no hay borde discreto que aliase, y se lee tan rápido como
         vaya. Es lo que el diseño ya pedía: *"hasta que se vuelven una mancha"*.

         Acá SE PUBLICA EL DATO —la velocidad en px por cuadro— y el CSS decide
         el desenfoque (`.dial.girando .dial-tira`, atado a `--giro-vel`). El JS
         no escribe estilo: publica un número, como con `--tension`. Y cuando la
         banda desacelera el blur baja solo, así que el frenado y el detente se
         ven nítidos —que es cuando importa verlos—. */
      dial.style.setProperty('--giro-vel', (vel / 60).toFixed(1));   /* px/cuadro para el blur */
      /* ⚠️ EL BLUR SÓLO EN EL TRAMO RÁPIDO (20/08, reportado: *"tironcitos"*).
         `filter: blur()` recalculado cada cuadro sobre la tira larga cuesta, y
         durante los ~6 s del frenado la velocidad ya está debajo del techo
         estroboscópico: las rayas se leen nítidas sin blur. Se enciende la
         clase sólo por encima de 10 px/cuadro (donde el aliasing sí importa) y
         se apaga para todo el tramo lento, que es donde estaba el costo sin
         aportar nada. El CSS pone el filtro sólo bajo `.dial.girando.borroso`. */
      dial.classList.toggle('borroso', vel / 60 > 10);

      /* ── PROBADO Y SACADO: cambiar la piel al pasar cada estación ──
         La idea era buena —si el dial pasa por estaciones de verdad, la
         radio tiene que ir sonando distinto— y se implementó a velocidad
         completa a pedido. En la práctica **no se puede**: en el pico
         pasan unas 100 marcas por segundo, y cada cambio de piel repinta
         la composición entera con otra tipografía. El navegador no llega,
         pierde cuadros, y el giro se ve a los tirones — o sea que el
         efecto sale PEOR, no más rico. Reportado: "hace un stuttering
         raro, saca eso".
         Se probó antes una versión moderada —sólo en el tramo lento, dos
         cambios por segundo— y tampoco: a esa altura ya no aporta nada y
         le saca protagonismo al dial, que es lo que hay que mirar en esta
         fase.
         Si alguna vez se retoma, la única forma viable es precalcular las
         paletas y animar variables CSS, sin tocar tipografías. */

      /* ⚠️ Y TERMINA CUANDO LLEGA, NO CUANDO SE LE ACABA EL TIEMPO.
         Ésta es la otra mitad del mismo arreglo, y es la que lo hace robusto:
         la duración del vuelo sale de una CUENTA —cuánto recorre la curva por
         milisegundo— y esa cuenta puede errarle por mil razones (la pantalla,
         la carga de la máquina, el redondeo del scroll, un `dt` que no es el
         que se supone). Cuando le erra, sobra tiempo o sobra pista, y las dos
         cosas se ven como un freeze.

         Atando el final del vuelo a la POSICIÓN, el error deja de importar: la
         banda llega, el trinquete arranca, y si la cuenta estaba mal lo único
         que cambia es cuánto duró el vuelo — que nadie está midiendo con un
         cronómetro. */
      /* ⚠️ Y LA SALIDA NO DEPENDE DE UN UMBRAL EN PÍXELES (19/08).
         Acá decía `tira.scrollLeft < destinoVuelo - 1`, y ese `- 1` fue el
         bug: con el scroll cuantizado, la banda se queda en el escalón
         inmediatamente inferior al destino y **nunca llega a estar a menos de
         un píxel**. La condición se cumplía para siempre y el lazo esperaba al
         reloj. Medido en una corrida real: la banda llegó a los 2.102 ms y el
         trinquete arrancó a los 3.904 — **1.734 ms clavada**.

         Ahora hay dos salidas, y la segunda es la que no puede fallar:
           · llegó al destino (con dos píxeles de tolerancia, no uno);
           · o **dejó de avanzar tres cuadros seguidos** aunque se le pidiera
             avanzar, que es la definición operativa de "llegó hasta donde
             podía" y no depende de ninguna cuenta.

         Es la misma lección de todo el día: cuando el número calculado y la
         realidad no coinciden, hay que atarse a lo que se puede observar. */
      /* Termina cuando la curva terminó. El `sinAvanzar` queda sólo como red:
         si por lo que fuera la banda llegara al tope antes de tiempo, no se
         queda clavada esperando al reloj. */
      /* Termina cuando la velocidad deja de verse —y ahí entra el detente— o
         cuando la curva se agotó. El `sinAvanzar` queda de red por si la banda
         llegara al tope antes de tiempo. */
      /* ⚠️ Y EL UMBRAL SÓLO CUENTA DESPUÉS DE LA MESETA. Sin el `f > B`, la
         condición se cumple en el PRIMER cuadro —donde la velocidad todavía es
         cero, porque la banda recién arranca— y el giro terminaba antes de
         empezar. Lo encontró la verificación, no el navegador. */
      /* Sigue mientras esté en el zafón, o mientras la velocidad no baje del
         umbral de detención Y todavía haya pista. El rozamiento seco lleva
         `vel` a cero en tiempo finito, así que esta condición se cumple sola;
         `sinAvanzar` queda de red por si se acabara la banda antes. */
      if (pasado < GIRO_RAMPA || (vel > GIRO_PARADA && sinAvanzar < 3))
        return requestAnimationFrame(rodar);

      /* ── EL TRINQUETE: las últimas marcas, de a una ──────────────
         Acá termina el vuelo y empieza a contarse. Cada salto lleva la banda
         de una posición de encaje a la siguiente, y cada uno dura más que el
         anterior: tic … tic … tic .. tic . tic, y la última encaja. No hay
         arrastre porque no hay velocidad baja — hay silencios cada vez más
         largos entre movimientos que sí se ven.
         La curva de cada salto sale rápido y se acomoda al final, que es lo
         que hace que se lea como un diente encajando y no como un
         desplazamiento suave. */
      {
        /* ⚠️ ACÁ ESTABA `tira.scrollLeft = largo`, Y ERA EL SALTO (20/08).
           Medido: cuadro 90 avanza 5,4 px, cuadro 91 avanza **1123**, y
           después un segundo de nada. Treinta y dos marcas de un tirón.

           La línea es un resto del modelo viejo, cuando el vuelo corría
           SIEMPRE hasta el final de la pista y esto sólo acomodaba el píxel
           del redondeo. Desde que el vuelo termina donde lo deja la fricción
           —con 1.100 px de pista de sobra, que es el margen a propósito— esta
           línea agarraba la banda y la teletransportaba al tope en un cuadro.

           **El frenado sí estaba ocurriendo; esta línea lo borraba en el
           último instante.** Todo el rato que se buscó la desaceleración en la
           forma de la curva, la curva estaba bien y el problema era posterior.
           Reportado como *"frena y se clava de golpe"*, *"nunca frena"* y
           *"está igual o peor"* — y ninguna de esas veces el sospechoso fue
           éste, porque el síntoma señalaba a la curva.

           Y de paso: el detente **nunca corrió ni una vez**. Teletransportada
           al tope, buscaba un casillero hacia atrás dentro de 55 px, ahí
           arriba no hay ninguno, y salía por `destino === null`. Los 380 ms de
           vuelta atrás medían 0,0 de avance en todas las corridas.

           No hace falta reemplazarla: `anunciar()` reacomoda la banda al tope
           después del efecto, que es cuando corresponde. */

        /* ── EL DETENTE: EL IMÁN ATRAE A LA RAYA MÁS CERCANA (20/08) ──────
           La banda paró donde la dejó la fricción. Ahora el imán la acomoda a
           la marca más cercana —**en cualquiera de las dos direcciones**—, como
           un scroll-snap de verdad: si quedó apenas pasada una raya, la trae
           hacia atrás; si quedó apenas antes, la empuja hacia adelante.

           ⚠️ Esto **reemplaza** la versión “sólo hacia atrás”, que era una
           decisión de diseño para que siempre se leyera como rebote. A pedido
           del usuario (20/08): *"que al detenerse, si quedó cerca de una raya,
           el imán la atraiga en una u otra dirección"*. Con el frenado largo la
           banda ya cae suave, así que la atracción a la más cercana se lee como
           el imán asentándola, no como una corrección.

           La atracción es **más rápida cuanto más cerca quedó** —como un imán
           real—: la duración escala con la distancia, de 220 ms para un toquecito
           a 560 ms para medio paso. Ease-out `1-(1-u)³`: sale y se acomoda. */
        (function asentar() {
          var izq = tira.getBoundingClientRect().left, medio = tira.clientWidth / 2;
          var aqui = tira.scrollLeft, destino = null, mejor = 1e9;
          [].forEach.call(tira.querySelectorAll('.parada-marca'), function (m) {
            var r = m.getBoundingClientRect();
            var x = aqui + (r.left + r.width / 2 - izq) - medio;
            /* La marca más cercana en VALOR ABSOLUTO —adelante o atrás—, dentro
               de un paso completo: la nearest siempre cae a menos de medio paso,
               así que 40 px de ventana siempre encuentra una y nunca da un salto. */
            var d = Math.abs(x - aqui);
            if (d < mejor && d < 40) { mejor = d; destino = x; }
          });
          /* Restaurar el snap NATIVO es lo último que hace el aterrizaje, no
             lo primero. Si se restaura antes —como estaba—, el navegador
             teletransporta la banda a la marca en UN cuadro y se come esta
             animación: medido, un salto de −12,7 px de golpe donde debería
             haber un aterrizaje de 300 ms. Reportado: *"no da tiempo de que
             aterrice"*. Acá el snap sigue en `none` (viene así del vuelo) y
             recién al terminar vuelve a `''`, con la banda ya sobre la marca,
             así que el snap nativo no tiene nada que corregir. */
          var restaurarSnap = function () { tira.style.scrollSnapType = ''; };
          if (destino === null) { restaurarSnap(); return; }
          var desde = aqui, dif = destino - desde, t0a = performance.now();
          /* 300 ms fijos con salida amortiguada `1-(1-u)³`, como la spec de la
             simulación: encajar en el gajo más cercano sin teletransporte (un
             salto se ve, por bajo que sea el umbral). */
          var DUR = 300;
          (function paso(t) {
            var u = Math.min(1, ((t || performance.now()) - t0a) / DUR);

        tira.style.touchAction = '';

        dial.classList.remove('borroso');
        /* ⚠️ LA TIRA NO SE LIMPIA ACÁ: SE LIMPIA DESPUÉS DEL EFECTO (19/08).
           Sacar las copias y volver al tope deja el dial con todas las marcas
           a la izquierda de la aguja y nada a la derecha — que es como tiene
           que quedar—, pero hacerlo ANTES de que entre el efecto se ve como
           que las marcas se borran solas un instante antes del hallazgo.
           Reportado: "al aterrizar en una marca las marcas a la derecha del
           centro se borran; eso debería suceder después que pase el efecto,
           no antes".

           efecto, y el reacomodo ocurre en `anunciar()`, que es el único
           punto por el que salen los cinco finales. */

           roce del mouse sobre el dial— disparara `aplicar()`, aplicara la
           marca bajo la aguja y limpiara las variables de la piel
           sorteada: el hallazgo se borraba solo, sin que nadie lo eligiera.

           reproductor original".

        /* EL EFECTO SE DISPARA DESDE ACÁ, no desde un temporizador
           paralelo. Estaba con `setTimeout(…, DURA)` y eso era una carrera:
           el último cuadro del giro podía correr DESPUÉS de que el efecto
           aplicara la piel sorteada, y el estroboscopio se la pisaba con
           una de las guardadas. Reportado: "el que gira la pantalla va
           siempre a uno de los skins guardados, no a uno random".
           Llamándolo acá, después de limpiar, el orden está garantizado.
           Y de paso es lo que corresponde conceptualmente: el efecto es el
           casillero en el que la ruleta CAYÓ. */
        /* La tira vuelve al tope ANTES de llamar al efecto: sacar las
           copias cambia el ancho, y reacomodar el scroll después de que el
           efecto arrancó deja ver el salto. */
        encontrarFrecuencia();
        setTimeout(function () { disparado = false; }, 400);
      }
    })(t0);

    /* EL EFECTO ARRANCA CON LA BANDA TODAVÍA GIRANDO, al 62 % del
       recorrido. Ésa es la parte de "sin detenerse del todo": lo último
       que se ve del dial es movimiento, no una tira quieta esperando. */

     sólo mira si la tira llegó al tope y si el dedo sigue apoyado. */
  ['touchstart', 'pointerdown'].forEach(function (ev) {

         Antes había que ATERRIZAR en una marca distinta: `aplicar()` es quien
         llama a `salirModoAscii()`, y toma su atajo si la marca bajo la aguja
         es la misma. O sea que si el dedo no llegaba a mover la tira hasta
         otra marca, el retrato no se iba — y con el gesto de arrastre que
         además costaba arrancar, salir se volvía una pelea.
         Tocar el dial ya es una elección deliberada: alcanza. La piel del
         hallazgo NO se toca acá —eso sigue siendo cosa de elegir una marca—,
         sólo se levanta la pantalla de texto. */
      if (typeof salirModoAscii === 'function') salirModoAscii();

  ['touchend', 'touchcancel', 'pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {

       ?egg=estatica  ?egg=giro  ?egg=papelitos  ?egg=matrix  ?egg=ascii  ?egg=imagen

  var forzar = params.get('egg');
  if (forzar) {

      if (forzar === '1') return encontrarFrecuencia();
      salirModoAscii();   /* la misma puerta, para el modo de prueba */
      var elFinal = { estatica: finalEstatica, giro: finalGiro, papelitos: finalPapelitos,

      /* Por el mismo camino que el sorteo real: si no, probar con ?egg=matrix
         daría una piel al azar y no la que de verdad va a salir. */
      elFinal(pielDelFinal(elFinal));

  /* ── 5 · QUE EL HALLAZGO SOBREVIVA A UNA RECARGA ─────────────────
     ESTO NO ESTÁ EN EL BOCETO: es la otra mitad de una persistencia que allá
     quedó escrita a medias. `aplicarPiel()` guarda `entresijo:skin` =
     'fantasma' más la piel entera serializada en `entresijo:fantasma`, y en
     el boceto nadie las lee nunca — se serializa una piel completa a JSON
     para no usarla.

     Acá no leerla no era neutro, era un bug: `leerSkin()` habría devuelto
     'fantasma', que no existe en skins5.css, y el reproductor habría vuelto
     con un data-skin que no pinta nada y el hallazgo tirado. Las dos salidas
     posibles eran completar la lectura o no escribir nada; se completó,
     porque serializar la piel entera sólo tiene sentido para devolverla.

     ⚠️ DECISIÓN QUE CONVIENE MIRAR: con esto, la piel sorteada se queda
     puesta hasta que el oyente toque una marca del dial. Si lo que se quiere
     es que el hallazgo dure una sola sesión, se borra esta función y las dos
     escrituras de `aplicarPiel()` — no hay nada más atado. */
  function restaurarFantasma() {
    try {
      if (localStorage.getItem('entresijo:skin') !== 'fantasma') return false;
      var piel = JSON.parse(localStorage.getItem('entresijo:fantasma') || 'null');
      if (!piel || !piel.vars) return false;
      aplicarPiel(piel);

         verlo aparecer solo al abrir la página sería contar el final. */
      return true;

})();

/* ═════════════════════════════════════════════════════════════════
   LA PÁGINA NO SE DESPLAZA VERTICALMENTE (19/08)

   Nunca estuvo implementado: se comparó `estilos5.css` contra la foto del
   inicio de sesión y no hay ni hubo regla que lo bloquee. Lo que sí está es
   `overscroll-behavior-y: none`, que mata el pull-to-refresh de Android y
   nada más — de ahí venía la impresión de que estaba resuelto.

   ⚠️ ESTO ESCONDE UN DESBORDE, NO LO ARREGLA. Medido en 411 × 771, que es el
   teléfono del usuario: la composición mide **29 px más que la pantalla** con
   el contador de oyentes prendido, y eso es de diseño, no de lógica. Lo que
   queda fuera de cuadro es el final del dial. Bloquear el desplazamiento hace
   que no se pueda ir a buscarlo; que entre es otra decisión, y es de la otra
   sesión (ver el pendiente en ARRANQUE-LOGICA).

   Va en JS y no en CSS a propósito: `overflow: hidden` en el body cambia la
   maquetación y `position: fixed` reintroduce justo la clase de problema de
   CRITERIOS-DISENO §4.7 —atar la posición a un alto que el navegador no
   garantiza—. Cancelar el gesto es más chico y no toca la composición.

   Y NO cancela todo: el historial abierto tiene su propio desplazamiento
   vertical y el dial el horizontal. Sólo se frena el gesto que llegó hasta el
   documento sin que nadie lo quisiera. */
addEventListener('touchmove', e => {
  /* Si el gesto nació adentro de algo que scrollea por su cuenta, es suyo. */
  if (e.target instanceof Element &&
      /* El historial YA NO está en esta lista: desde que se corta en vez de
         desplazarse, no tiene desplazamiento propio que respetar. Quedan el
         dial (horizontal) y el fader, que manejan su gesto ellos mismos. */
      e.target.closest('.dial-tira, .vol-slider')) return;
  if (e.cancelable) e.preventDefault();
}, { passive: false });

/* ═════════════════════════════════════════════════════════════════
   EL DATO QUE EL CSS ESTÁ ESPERANDO — el ancho real de la bajada

   `--hist-ancho` es la única línea vertical de la composición: de ella
   dependen el ancho del historial, la alineación del fader y el borde
   derecho (DISENO §6). NO es un número de diseño, es una MEDIDA — y estuvo
   clavada, y se rompió tres veces: al cambiar el cuerpo de la bajada, al
   agrandar la letra, y porque ese texto lo manda el Worker y no el diseño.
   Sin esto el sistema entero corre con el valor de reserva de estilos5.css.

   VA EN LA RAÍZ, no en #app: los tamaños se declaran en :root y una
   variable que contiene var() —`--vol-sep` la usa— se resuelve donde se
   declara (DISENO §8).
   ═════════════════════════════════════════════════════════════════ */
function publicarAncho() {
  /* Con un rango de texto y no con offsetWidth: el <span> ocupa todo el
     ancho disponible, y lo que hay que medir es la TINTA — dónde termina
     la R de "…CON AMOR", que es la línea a la que se alinea todo. */
  const r = document.createRange();
  r.selectNodeContents(descEl);
  /* [index0] /zoomApp(): el rango se mide en píxeles de PANTALLA pero
     --hist-ancho se declara en la RAÍZ (afuera del zoom) y se consume
     adentro. Sin dividir, con el encaje apretado el ancho de referencia
     saldría achicado dos veces y se desalinearían las tres cosas que
     gobierna: el historial, el ancho del título y la separación del
     volumen. Es el sistema de alineación entero. */
  const w = Math.round(r.getBoundingClientRect().width / zoomApp());
  if (w) document.documentElement.style.setProperty('--hist-ancho', w + 'px');
}

/* Se mide TRES veces y no una, y las tres hacen falta:
   · ahora, para que la primera pintada no salga con el valor de reserva;
   · cuando la tipografía terminó de intercambiar — si Inter todavía no
     llegó se mide con la de reserva, que es más angosta, y ese número
     queda clavado toda la sesión. Medido en carga fría: 7,6 px de
     desalineación en las tres cosas que gobierna. Con la fuente en caché
     no pasa, y por eso costó verlo;
   · en `load`, que es el cinturón por si `fonts.ready` no existe o falla,
     y además el único momento en que la hoja de estilos seguro cargó —
     leer una variable del CSS antes devuelve vacío (DISENO §8), que es de
     lo que depende leerColoresVu().
   Volver a medir es idempotente: si nada cambió, publica el mismo número. */
function acomodar() { publicarAncho(); leerColoresVu(); if (!vuActivo) vuBase(); }
acomodar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(acomodar);
addEventListener('load', acomodar);
/* Y al cambiar el ancho de la ventana: la bajada se parte en dos líneas en
   pantallas angostas, y ahí su tinta mide otra cosa. */
addEventListener('resize', publicarAncho);

/* ═════════════════════════════════════════════════════════════════
   ARRANQUE
   ═════════════════════════════════════════════════════════════════ */
aplicarFeatures();
traerConfig();
traerMeta();

/* Registra el service worker MÍNIMO (sw.js): habilita el WebAPK de Android
   —"agregar a la pantalla de inicio" abre sin barras, en standalone—. No
   cachea nada (ver sw.js). Va en `load` para no competir con el arranque, y
   con `catch` para que un fallo de registro nunca rompa el reproductor. */
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}

/* ── Disparar la intro de arranque (zoom del vinilo) ─────────────────────
   La capa #app-intro la inyectó el <script> del principio del <body> (sólo en
   la app). Acá se le agrega `arrancar` —que dispara el zoom + la disolución—
   RECIÉN cuando la composición ya se asentó (load + fuente + dos cuadros), así
   el reproductor que queda detrás ya está quieto. Después se saca la capa.
   Si no hay #app-intro (navegador, o no se inyectó), no hace nada. El
   `setTimeout` es la red de seguridad; el <script> del arranque tiene otra
   aparte, así que la capa se va sí o sí. */
(function () {
  var intro = document.getElementById('app-intro');
  if (!intro) return;
  var disparado = false;
  function arrancar() {
    if (disparado) return; disparado = true;
    intro.classList.add('arrancar');
    setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 1650);
  }
  addEventListener('load', function () {
    var f = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    f.then(function () {
      requestAnimationFrame(function () { requestAnimationFrame(arrancar); });
    });
  });
  setTimeout(arrancar, 1600);
})();

/* ── EL INSTRUMENTO PARA MEDIR EL TRAQUETEO DEL DIAL, apagado ──────
   El dial se traba una fracción de segundo al soltar el dedo, y hay SEIS
   hipótesis descartadas con medición (CRITERIOS-DISENO §4.9). Lo que las
   hizo perder tiempo no fue equivocarse: fue no poder observar el
   fenómeno, que sólo existe con un dedo apoyado en un teléfono.

   `medir-dial.js` registra qué pasa al soltar y le manda los números al
   servidor con una imagen de 1 px (la técnica de §4.7). Vive AFUERA a
   propósito, y son estas tres líneas: sin `?medir=dial` el archivo ni se
   pide, así que el instrumento no puede romper el caso que mide — que es
   exactamente lo que pasó con `?dial=tap`, el modo de prueba que metió un
   ReferenceError y tuvo el caso normal roto durante varias vueltas. */
if (new URLSearchParams(location.search).get('medir') === 'dial') {
  const s = document.createElement('script');
  s.src = 'medir-dial.js'; document.body.appendChild(s);
}

/* ═════════════════════════════════════════════════════════════════
   [index0] ¿ESTE NAVEGADOR SABE DIBUJAR UN FADER VERTICAL?
   ═════════════════════════════════════════════════════════════════
   MEDIDO con los motores de verdad (Playwright, 03/09), arrastrando el fader
   de arriba abajo sobre index.html:

       Firefox 144    0,80 -> 0,13   anda
       Chromium 143   0,80 -> 0,13   anda
       WebKit (Safari) 0,80 -> 0,80  NO ANDA
       y peor: un TOQUE abajo del todo lo deja en 1,00 — el gesto de BAJAR
       el volumen lo SUBE AL MAXIMO.

   La causa es la de siempre: `writing-mode: vertical-lr` sobre un
   input[type=range] es la tecnica NUEVA (Chrome 121, Firefox 129, los dos de
   2024). El motor de Safari no la aplica, dibuja el control ACOSTADO adentro
   de la caja de 63x118 y el eje del gesto queda cruzado. Esto lo ve HOY todo
   el que abre la radio en un iPhone.

   NO SE PREGUNTA LA VERSION DEL NAVEGADOR, SE LE PREGUNTA AL NAVEGADOR. Un
   range con writing-mode vertical y sin tamano declarado: si el motor lo
   entiende, su alto por defecto pasa a ser mayor que su ancho. Medido:

       Firefox    20 x 160   parado
       Chromium   16 x 129   parado
       WebKit    129 x  18   ACOSTADO

   ⚠️ `CSS.supports('-webkit-appearance','slider-vertical')` NO sirve de
   sonda y se descarto con medicion: Chromium contesta true aunque ya no lo
   aplica desde la 121, y Firefox contesta false aunque el fader le anda
   perfecto. Las dos respuestas son la equivocada. La geometria no miente. */
(function () {
  try {
    var s = document.createElement('input');
    s.type = 'range';
    s.style.cssText = 'position:absolute;left:-9999px;top:0;writing-mode:vertical-lr;';
    document.body.appendChild(s);
    var r = s.getBoundingClientRect();
    var parado = r.height > r.width;
    s.parentNode.removeChild(s);
    if (!parado) document.documentElement.classList.add('sin-fader-vertical');
  } catch (e) {}
})();

/* ═════════════════════════════════════════════════════════════════
   [index0] EL ENCAJE — que la composición entre siempre, sin scroll
   ═════════════════════════════════════════════════════════════════
   Publica DOS DATOS y nada más: --aire y --encaje, los dos números, sobre
   <html>. Quién decide qué hacer con ellos es encaje0.css. Es la misma
   division de trabajo que ya rige para --nivel, --vol-pct y --giro-vel:
   el JS mide, el CSS diseña.

   No hay ningún punto de corte por ancho acá adentro. Se mide el alto que
   hay y se aprieta lo justo — en una pantalla holgada los dos números
   quedan en 1 y el reproductor es idéntico al de produccion, al pixel.
   ═════════════════════════════════════════════════════════════════ */
(function () {
  var raiz = document.documentElement;
  /* EL PISO DE LOS HUECOS. 0,50 y no menos, y el número no es arbitrario:
     es exactamente donde --baja llega a cero (encaje0.css lo escribió así).
     Se probó 0,42 y encajaba en un px menos de escala, pero deja la
     composición demasiado junta — y las distancias entre elementos son
     de lo que más se nota en este diseño. Con 0,50 el reparto entre
     "juntarse" y "achicarse" queda parejo: en un iPhone SE da huecos al
     50 % y escala 0,92, en vez de huecos al 42 % y escala 0,94. */
  var AIRE_MIN = 0.50;
  var ENCAJE_MIN = 0.80;   // el piso de legibilidad (estilos5.css lo fijó ahí)
  /* Aire de seguridad. Estaba en 1 px y NO ALCANZABA: en la barrida de 24
     formatos por tres motores quedaban dos casos con 2 px de scroll —Android
     chico e iPhone SE— por el redondeo de toFixed(3) y los subpíxeles. Con 4
     desaparecen y no se nota. */
  var MARGEN = 4;
  var aireHoy = 1, encajeHoy = 1;

  /* EL ALTO ÚTIL, con la desconfianza que se ganó a pulso.
     El navegador MIENTE mientras la barra de direcciones entra o sale:
     medido el 17/08 en un teléfono real, reportó 1007 px con ~728 px en
     pantalla, y ese es el hipo que hizo abandonar el centrado (§4.7 de
     CRITERIOS-DISENO). visualViewport sigue lo que se VE, así que se toma
     el MENOR de los dos: equivocarse para abajo aprieta de más —se ve un
     poco chico y se lee igual—; equivocarse para arriba corta, que es
     justamente lo que se está arreglando.

     El precio del `min`, y por qué se paga igual: si una de las dos fuentes
     se queda vieja, la composición NO VUELVE A CRECER hasta que se
     actualice. Se vio en el banco —con la pestaña sin pintar,
     visualViewport se congela en el alto anterior y el reproductor se
     quedó chico al agrandar la ventana—. En un teléfono de verdad las dos
     se mueven juntas, y sobre todo: quedarse chico de más es cosmético,
     quedarse grande de más CORTA. El error va del lado barato. */
  function altoUtil() {
    var a = window.innerHeight || 0;
    var vv = window.visualViewport;
    var b = (vv && vv.height) ? vv.height : a;
    return Math.max(320, Math.min(a || b, b || a));
  }

  /* Lo que la composición PIDE: su alto más el relleno del body, que es
     parte del encaje aunque no sea parte del dibujo. */
  function pedido() {
    var cs = getComputedStyle(document.body);
    return app.getBoundingClientRect().height +
           parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  }
  function rellenoBody() {
    var cs = getComputedStyle(document.body);
    return parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  }

  var midiendo = false;

  function encajar() {
    if (midiendo) return;
    midiendo = true;
    try {
      var disp = altoUtil() - MARGEN;

      /* Paso 0 — sin apretar nada. Se escribe y se mide en la MISMA tarea,
         así que el navegador no llega a pintar el estado intermedio: no hay
         parpadeo aunque acá se prueben tres configuraciones seguidas. */
      raiz.style.setProperty('--aire', '1');
      raiz.style.setProperty('--encaje', '1');
      var p = pedido();
      var aire = 1, z = 1;

      if (p > disp) {
        /* Paso 1 — los huecos. No se salta al mínimo: se pregunta cuánto
           RINDE el mínimo y se interpola para gastar sólo lo que falta. En
           un teléfono al que le faltan 20 px la composición se junta 20 px,
           no 150. */
        raiz.style.setProperty('--aire', String(AIRE_MIN));
        var pMin = pedido();
        var rinde = p - pMin;
        if (rinde > 0) {
          var falta = p - disp;
          aire = (falta >= rinde) ? AIRE_MIN : 1 - (falta / rinde) * (1 - AIRE_MIN);
        }
        raiz.style.setProperty('--aire', aire.toFixed(3));
        p = pedido();

        if (p > disp) {
          /* Paso 2 — la escala. El relleno del body vive AFUERA de
             .player-app, así que no lo toca el zoom: se descuenta de los dos
             lados antes de dividir, o el resultado queda corto. */
          var r = rellenoBody();
          var cuerpo = p - r;
          if (cuerpo > 0) z = (disp - r) / cuerpo;
          z = Math.max(ENCAJE_MIN, Math.min(1, z));
          raiz.style.setProperty('--encaje', z.toFixed(3));

          /* SE PROBO UN PASO 3 —bajar el aire a 0,30 cuando la escala ya toco
             su piso— Y SE DESCARTO CON MEDICION (03/09). Dos razones:

             · la cuenta de la escala quedaba mal: se recalculaba `z` contra un
               `pedido()` que YA estaba escalado por el `z` anterior, asi que
               daba 1,0 y deshacia el encaje. Medido en un iPhone SE: pasaba de
               entrar con aire 0,50 y escala 0,909 a NO entrar con aire 0,30 y
               escala 1,0 (11 px de scroll). En un 320x480, de 18 px de scroll
               a 98.
             · y aun con la cuenta bien, se disparaba por un residuo de 1 o 2 px
               —el redondeo del zoom— y apretaba la composicion al 30 % para
               ganar dos pixeles. El remedio era peor.

             Lo que si hacia falta era subir el MARGEN de 1 a 4 px, que es lo
             que mata ese residuo. Los dos formatos que siguen sin entrar
             —320x480 y el telefono acostado— no entran porque no hay manera
             sin bajar del piso de legibilidad, y ahi el scroll es la respuesta
             honesta. */
        }
      }

      aireHoy = aire; encajeHoy = z;

      /* Cambió la escala: las tres medidas que dependen de ella hay que
         rehacerlas, y en este orden. Ninguna cambia el alto, así que no
         hace falta volver a encajar. */
      medirVu();
      publicarAncho();
      if (!vuActivo) vuBase();

      /* [index0] El hueco que hay ARRIBA del boton del historial, publicado
         como dato para que la lista —que ahora se abre hacia arriba, ver
         encaje0.css— nunca pase el borde de la pantalla. Se descuentan 16 px
         de aire y los 10 del separador de la propia lista. */
      try {
        var bh = document.getElementById('hist-toggle').getBoundingClientRect();
        var hueco = Math.max(80, Math.round(bh.top - 26));
        raiz.style.setProperty('--hist-hueco', hueco + 'px');
      } catch (e) {}

      diagnostico(disp, pedido());
    } catch (e) {
      /* Ante cualquier problema, el encaje se apaga solo y queda el
         reproductor de produccion. Nunca puede ser peor que no estar. */
      try { raiz.style.setProperty('--aire', '1'); raiz.style.setProperty('--encaje', '1'); } catch (e2) {}
    }
    midiendo = false;
  }

  /* SE ENCAJA DOS VECES: al toque y al rato. No es redundancia.

     · AL TOQUE (flanco de subida) porque un `setTimeout` no es una promesa:
       el navegador lo estrangula cuando la pestaña no está a la vista, y
       medido en este mismo banco con la pestaña oculta el diferido NO
       LLEGÓ A CORRER NUNCA — la composición se quedó con el encaje viejo
       después de dos cambios de tamaño. Si el único camino es el diferido,
       el encaje es tan confiable como el reloj del navegador, que no lo es.
       Además al girar el teléfono se acomoda en el acto y no 160 ms después.

     · AL RATO (flanco de bajada) porque la primera medida cae en mitad de
       la animación de la barra de direcciones, que es justo el momento en
       que el navegador miente sobre el alto (§4.7). La segunda corre con
       todo quieto y corrige.

     Entre las dos hay 250 ms de guarda para que una ráfaga de veinte avisos
     —lo normal cuando entra la tipografía y encima gira la pantalla— no se
     convierta en veinte recálculos. */
  var t = null, ultimaCorrida = 0;
  /* `yaMismo === false` fuerza el camino diferido y NADA MAS. Lo usa el
     observador de tamano: recalcular ahi mismo cambia el alto DENTRO del
     propio callback, y WebKit lo reporta como
     `ResizeObserver loop completed with undelivered notifications` —salio en
     el banco, en los tres eggs y en el arranque—. Es un aviso, no una falla,
     pero es ruido en la consola y avisa de algo real: escribir estilo adentro
     del callback puede encadenar vueltas. Diferido, el observador termina su
     entrega y el encaje corre despues, en su propia tarea. */
  function programar(yaMismo) {
    var ahora = Date.now();
    if (yaMismo !== false && ahora - ultimaCorrida > 250) { ultimaCorrida = ahora; encajar(); }
    clearTimeout(t);
    t = setTimeout(function () { ultimaCorrida = Date.now(); encajar(); }, 220);
  }

  addEventListener('resize', programar);
  addEventListener('orientationchange', programar);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', programar);
  addEventListener('load', programar);
  /* Volver a la pestaña: mientras estuvo atrás pudo cambiar todo —el alto,
     la piel, el tema— y encima ahí es donde los timers estuvieron dormidos. */
  document.addEventListener('visibilitychange', function () { if (!document.hidden) programar(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(programar);

  /* El alto de la composición también cambia sin que cambie la ventana:
     al elegir una piel en el dial, al prender el contador de oyentes, al
     entrar un título largo. Un observador lo cubre todo sin tener que
     enganchar cada caso a mano.
     No se cicla: si al recalcular dan los mismos dos números, no se escribe
     nada en el DOM y el observador no vuelve a dispararse. */
  if (window.ResizeObserver) {
    try { new ResizeObserver(function () { if (!midiendo) programar(false); }).observe(app); } catch (e) {}
  }

  /* ── El diagnóstico, apagado salvo con ?encaje ──────────────────
     Mismo criterio que `?medir=dial`: un instrumento que existe siempre
     puede romper el caso que mide. Sirve para leer los números en el
     teléfono, que es donde vive el problema. */
  var diagEl = null, verDiag = false;
  try { verDiag = new URLSearchParams(location.search).has('encaje'); } catch (e) {}
  function diagnostico(disp, ped) {
    if (!verDiag) return;
    if (!diagEl) {
      diagEl = document.createElement('div');
      diagEl.id = 'encaje-diag';
      document.body.appendChild(diagEl);
    }
    diagEl.textContent =
      'pantalla ' + Math.round(disp) + ' · pide ' + Math.round(ped) +
      ' · aire ' + aireHoy.toFixed(2) + ' · encaje ' + encajeHoy.toFixed(2) +
      ' · ' + innerWidth + '×' + innerHeight +
      (matchMedia('(display-mode: standalone)').matches ? ' · app' : ' · navegador');
  }

  encajar();
})();

setInterval(traerMeta, META_MS);
setInterval(() => { if (!simulando && ultimoDato && ultimoDato.verified && !ultimoDato.isLive) repintar(); }, 30000);
</script>
</body>
</html>
