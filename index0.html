         todo: 1,5 s es el punto en que `caerse` lo tiene fuera de cuadro. */
      if (!cambio && pasado > 1500) { cambio = true; alTerminar(); }

      /* ⚠️ ESTOS TIEMPOS ESTÁN ATADOS A LA ANIMACIÓN `caerse` DEL CSS,
         que dura 3,4 s. Si uno de los dos cambia, hay que mover el otro.
         Ya se desincronizaron una vez: la caída se alargó a 3,4 s y la
         lluvia quedó en 2,4, así que la lluvia terminaba mientras el
         reproductor todavía venía bajando desde arriba — y aparecía de
         golpe sobre una pantalla ya limpia. Reportado como regresión.
         La lluvia tiene que seguir ahí mientras el reproductor vuelve, y
         disolverse recién cuando ya está en su lugar. */
      if (pasado > 2700) {
        ctx.fillStyle = 'rgba(0, 0, 0, .13)';
        ctx.fillRect(0, 0, an, al);
      }
      if (pasado < 3600) requestAnimationFrame(cuadro);
      else { ctx.clearRect(0, 0, an, al); lienzo.classList.remove('activo'); }
    })(t0);
  }

  /* ── 2b-bis · EL RETRATO DE LA PÁGINA, ESCRITO ──────────────────
     El reproductor se redibuja a sí mismo con caracteres, se queda un
     momento, y se disuelve en la piel nueva.

     No es una imagen prefabricada: se arma leyendo la GEOMETRÍA REAL de la
     composición en ese momento —dónde está cada elemento, de qué tamaño— y
     escribiendo ahí lo que ese elemento dice. Si mañana se mueve un bloque,
     el retrato se mueve con él.

     ⚠️ REESCRITO EL 18/08, porque la versión anterior no se entendía. Dos
     causas, y la lección de cada una vale más que el código:

     UNA · EL NOMBRE EN TIPOGRAFÍA DE MAPA DE BITS NO ENTRABA. "ENTRESIJO"
     en glifos de 5×7 mide 53 columnas; la grilla de un teléfono tiene 27.
     Se dibujaba recortado y por fuera del marco — y `DISENO §9.4` decía que
     ese nombre era "lo que hace que se entienda que es un retrato y no
     ruido". O sea que lo primero que se perdía era justo lo que sostenía
     todo lo demás. Un dibujo cuyo elemento portante no cabe en el medio no
     es un dibujo con un defecto: es otro dibujo.

     DOS · LOS TEXTOS SE DIBUJABAN COMO BANDAS DE DENSIDAD AL AZAR
     (`0.45 + random × 0.55` por celda). La idea era "un renglón visto de
     lejos", pero de lejos un renglón no es ruido: es una línea gris con
     ritmo. Lo que salía era estática, y estática ocupando el 70 % del
     cuadro se lleva puesto lo poco que sí se leía.

     LO QUE HACE AHORA: una terminal dibuja una página ESCRIBIÉNDOLA. Cada
     elemento pone su propio texto, centrado en su franja real; el círculo
     es un anillo de bloques con su ▶ adentro; el cartel lleva recuadro; el
     fader es una barra con su cabezal; el dial son sus marcas. Todo lo que
     se ve en la pantalla se ve acá, en el idioma de una consola.

     Y LA RESOLUCIÓN LA FIJA EL TEXTO, no un tamaño de celda elegido a ojo:
     se pide una columna por carácter del renglón más largo. Con celdas
     fijas de 13 px la bajada entraba cortada, que es perder de un tajo el
     renglón que dice qué radio es ésta. */
  /* `instantaneo` pinta el retrato entero de una, sin el teletipo. Es lo que
     usa el MODO ASCII para redibujar cuando cambia el tema o el volumen: la
     máquina de escribir es del hallazgo, no del uso — una pantalla que se
     reescribe letra por letra cada vez que sube el volumen sería inusable. */
  function pintarAscii(piel, instantaneo) {
    /* `en-efecto` sólo en la ENTRADA, no en los repintes: esconde los oyentes
       y bloquea el anclaje del botón mientras dura, y en el modo ascii esto
       ya no es un efecto sino la pantalla. Volver a ponerlo en cada repinte
       dejaba al reproductor en modo efecto para siempre. */
    if (!instantaneo) app.classList.add('en-efecto');
    var ctx = lienzo.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var an = window.innerWidth, al = window.innerHeight;
    lienzo.width = an * dpr; lienzo.height = al * dpr;
    lienzo.style.width = an + 'px'; lienzo.style.height = al + 'px';
    ctx.scale(dpr, dpr);
    lienzo.classList.add('activo');

    /* La grilla se mide sobre la caja del REPRODUCTOR y no sobre la ventana:
       en un teléfono el reproductor es una franja angosta y el resto es
       vacío, así que grillar la pantalla entera dejaba el retrato chico y
       cortado por los costados. */
    var caja0 = app.getBoundingClientRect();
    /* ⚠️ EL MARGEN TIENE QUE ALCANZAR PARA UNA FILA ENTERA, y 10 px no
       alcanzan: la celda mide 23 px de alto, así que la primera fila del
       marco arrancaba 13 px por encima de donde había lugar y se veía
       cortada — reportado, "se corta un poco justo el recuadro blanco, sobre
       todo arriba". El margen se fija DESPUÉS de conocer el alto de celda,
       más abajo; acá se reserva un piso generoso y se recorta contra la
       ventana, que es lo que importa para no dibujar fuera de cuadro. */
    /* 26 → 40: con 26 el marco entraba justo pero quedaba pegado al filo de
       la composición. Cuarenta le dan casi dos celdas de aire y el recuadro
       respira. Más que eso empieza a comerse la pantalla en un teléfono, así
       que es el techo razonable. */
    var MARGEN = 40;
    var X0 = Math.max(0, caja0.left - MARGEN), Y0 = Math.max(0, caja0.top - MARGEN);
    var ANCHO = Math.min(an - X0, caja0.width + MARGEN * 2);
    var ALTO  = Math.min(al - Y0, caja0.height + MARGEN * 2);

    /* Los renglones de la página, en orden de arriba abajo. Cada uno aporta
       su propio texto: no hay una tabla acá que se pueda desincronizar con
       lo que el oyente está leyendo. */
    var RENGLONES = ['#station-name', '#description', '#clock', '#status-badge',
                     '#artist', '#title', '.history-toggle', '.ws-btn',
                     '.ws-note', '#listeners'];
    /* EL HISTORIAL ABIERTO, si está abierto. Reportado: en el modo ascii
       tocarlo no hacía nada — y sí hacía: el toque llegaba y la lista se
       abría, pero el retrato no la dibujaba, así que en pantalla no pasaba
       nada. Un dibujo que no muestra lo que acaba de ocurrir se lee como un
       control roto.
       Los ítems se leen del DOM en el momento de dibujar, así que si el
       Worker cambió el historial, el retrato lo refleja. */
    var lista = document.getElementById('history-list');
    if (lista && lista.classList.contains('open'))
      [].forEach.call(lista.querySelectorAll('.h-item'), function (it) {
        RENGLONES.push(it);
      });
    function textoDe(el) {
      var t = (el.textContent || '').replace(/\s+/g, ' ').trim();
      /* Se respeta el `text-transform` del CSS: si en pantalla se lee en
         mayúsculas, en el retrato también. El retrato copia lo que se ve,
         no lo que dice el marcado. */
      return (t && getComputedStyle(el).textTransform === 'uppercase') ? t.toUpperCase() : t;
    }
    var lineas = [];
    RENGLONES.forEach(function (sel) {
      /* La lista trae selectores y, si el historial está abierto, también
         elementos ya resueltos: los ítems no tienen selector propio. */
      var el = (typeof sel === 'string') ? document.querySelector(sel) : sel;
      if (!el) return;
      var r = el.getBoundingClientRect();
      var t = textoDe(el);
      if (t && r.width && r.height) lineas.push({ sel: sel, r: r, t: t });
    });

    /* UNA COLUMNA POR CARÁCTER DEL RENGLÓN MÁS LARGO, más el marco. El piso
       de 26 evita que un momento sin metadata —todos los textos cortos—
       haga un dibujo de doce columnas; el techo de 46 evita que un tema con
       nombre larguísimo lo vuelva ilegible de tan fino. */
    var masLargo = 0;
    lineas.forEach(function (l) { if (l.t.length > masLargo) masLargo = l.t.length; });
    var pedidas = Math.max(26, Math.min(46, masLargo + 4));

    /* ⚠️ EL PASO DE LA GRILLA SE MIDE, NO SE SUPONE (18/08, segunda vuelta).
       Estaba `CW = ANCHO / cols` y `ctx.font = CH + 'px'`, o sea eligiendo el
       paso por un lado y el tamaño de letra por otro y confiando en que
       coincidieran. No coinciden: el avance de un glifo depende de QUÉ FUENTE
       GANÓ la pila, y eso cambia por máquina. Con el paso más grande que el
       glifo quedan huecos entre celdas — y los caracteres de caja, que existen
       para CONECTARSE, salen como palitos sueltos. Reportado mirándolo en la
       PC: el marco dentado y el círculo hecho pedazos, con los textos bien.
       Los textos se salvaban porque una letra no necesita tocar a la de al
       lado; el marco sí. Ese es el punto: el error sólo se ve en lo que tiene
       que ser continuo.
       Ahora se fija la letra, se MIDE el avance real de un bloque, y la grilla
       se arma con esa medida. Así tesela sea cual sea la fuente que haya. */
    var PILA = "'Cascadia Mono', Consolas, 'Lucida Console', 'DejaVu Sans Mono', ui-monospace, monospace";
    var CW, CH, cols, filas, subeLinea;
    function medirGrilla(tam) {
      ctx.font = tam + 'px ' + PILA;
      var m = ctx.measureText('\u2588');
      CW = m.width;
      /* El alto de la celda es la caja real de la fuente, no un múltiplo
         inventado: si se usa otro número, las filas no se tocan. */
      var arriba = m.fontBoundingBoxAscent, abajo = m.fontBoundingBoxDescent;
      if (!arriba && arriba !== 0) { arriba = tam * 0.8; abajo = tam * 0.2; }
      CH = arriba + abajo;
      subeLinea = arriba;
      cols = Math.floor(ANCHO / CW);
      /* Hacia abajo se REDONDEA PARA ARRIBA: el marco se come la última fila,
         y truncando quedaba una fila corta — el dial, que es lo último de la
         composición, caía sobre el borde y el tope lo empujaba encima de los
         oyentes. El margen de la caja da el lugar; hay que no tirarlo. */
      filas = Math.ceil(ALTO / CH);
    }
    /* Una monoespaciada avanza ~0,6 del cuerpo; se arranca de ahí y se corrige
       con lo medido, que es lo único que vale. */
    /* ⚠️ UN PISO DE TAMAÑO DE CELDA, Y MANDA SOBRE EL TEXTO COMPLETO (18/08).
       Pedir una columna por carácter del renglón más largo daba, en un
       teléfono de 360 px, celdas de 10 px: el retrato entraba entero y no se
       leía nada. Reportado mirándolo en el celu.
       Entre "entra todo" y "se lee", gana que se lea: el retrato es una
       imagen del reproductor, no su transcripción. Lo que no entra se recorta
       con puntos suspensivos, que es lo que ya hacía. */
    /* 11 y no 13: con celdas más grandes entran menos FILAS, y ahí el
       recuadro del cartel se aplasta contra su propio texto y el círculo
       pierde la forma. 11 es el punto donde el texto todavía se lee y la
       composición conserva sus proporciones. */
    var CELDA_MIN = 11;
    var TAM = ANCHO / pedidas / 0.6;
    medirGrilla(TAM);
    if (cols < pedidas) medirGrilla(TAM * cols / pedidas);
    if (CW < CELDA_MIN) medirGrilla(TAM * CELDA_MIN / CW);

    /* ⚠️ Y SE VERIFICA QUE LOS GLIFOS DE CAJA EXISTAN DE VERDAD.
       La pila de fuentes es toda de escritorio: en Android no hay ninguna y
       se cae en Roboto Mono, que puede no traer los caracteres de dibujo de
       cajas. Cuando falta un glifo el navegador lo busca en OTRA fuente, y
       esa otra tiene otro avance: el dibujo se desarma carácter por carácter.
       Eso es exactamente lo que se veía en el teléfono mientras en la PC se
       leía bien — el modo de falla más caro de todos, porque no aparece donde
       uno mira.
       No se puede preguntar "¿tenés este glifo?", pero sí se puede MEDIR: si
       un carácter de caja no mide lo mismo que un bloque, vino de otra fuente
       y no sirve. Con eso se elige el juego completo, y el dibujo se arma con
       ASCII puro —que está en todas— en vez de romperse. */
    /* ⚠️ SE MIDE LA TINTA, NO EL AVANCE (18/08, tercera vuelta).
       La primera versión comparaba `measureText().width`, o sea el AVANCE, y
       eso no alcanza: un glifo puede avanzar lo mismo que un bloque y tener
       la tinta más angosta. En la PC la tinta de `═` mide 12 px sobre un
       avance de 10,45 —se solapa con la celda de al lado y por eso el marco
       sale continuo—; en Android la fuente de reserva la dibuja más angosta
       que el avance y el marco sale PUNTEADO. Reportado con una captura del
       teléfono: las verticales enteras y las horizontales a rayitas.
       Lo que hay que preguntar no es "¿mide lo mismo?" sino "¿LLENA la
       celda?", y eso se contesta dibujando el glifo y mirando los píxeles. */
    /* El avance: barato, y alcanza para los glifos que no necesitan
       conectarse con el de al lado —el bloque lleno, el cabezal del fader—.
       Quedó huérfana al reemplazar la verificación por la de tinta y tres
       llamadas seguían usándola: el retrato tiraba ReferenceError y no se
       dibujaba nunca. Lo encontró el arnés que corre el marcado fuera del
       navegador, no el navegador — donde el efecto sólo se ve tras un gesto
       de 3,5 s y una carambola del sorteo. */
    function mismoAncho(g) { return Math.abs(ctx.measureText(g).width - CW) < 0.5; }

    function llenaLaCelda(g) {
      var lado = Math.ceil(CW) + 8, alto = Math.ceil(CH) + 8;
      var cv = document.createElement('canvas');
      cv.width = lado; cv.height = alto;
      var c2 = cv.getContext('2d');
      c2.font = ctx.font; c2.textBaseline = 'alphabetic'; c2.fillStyle = '#fff';
      c2.fillText(g, 4, subeLinea + 4);
      var px = c2.getImageData(0, 0, lado, alto).data;
      var x0 = -1, x1 = -1;
      for (var x = 0; x < lado; x++) {
        for (var y = 0; y < alto; y++) {
          if (px[(y * lado + x) * 4 + 3] > 40) { if (x0 < 0) x0 = x; x1 = x; break; }
        }
      }
      /* 0,92 y no 1: el antialiasing come una fracción de píxel en cada punta,
         y exigir el 100 % descartaría fuentes que teselan perfecto. */
      return x0 >= 0 && (x1 - x0 + 1) >= CW * 0.92;
    }
    var HAY_CAJA = ['\u2550', '\u2551', '\u2500', '\u2502', '\u250c'].every(llenaLaCelda);
    var G = HAY_CAJA
      ? { h: '\u2550', v: '\u2551', tl: '\u2554', tr: '\u2557', bl: '\u255a', br: '\u255d',
          h2: '\u2500', v2: '\u2502', tl2: '\u250c', tr2: '\u2510', bl2: '\u2514', br2: '\u2518',
          lleno: mismoAncho('\u2588') ? '\u2588' : '#',
          cabezal: mismoAncho('\u2584') ? '\u2584' : '=',
          marca: '\u00b7' }
      : { h: '=', v: '|', tl: '+', tr: '+', bl: '+', br: '+',
          h2: '-', v2: '|', tl2: '+', tr2: '+', bl2: '+', br2: '+',
          lleno: '#', cabezal: '=', marca: '.' };

    /* La grilla guarda EL CARÁCTER, no una densidad que después haya que
       traducir: acá cada celda ya sabe qué es. */
    var rej = new Array(cols * filas);
    for (var k = 0; k < rej.length; k++) rej[k] = ' ';
    function pon(c, f, ch) {
      if (c < 0 || c >= cols || f < 0 || f >= filas || !ch) return;
      rej[Math.round(f) * cols + Math.round(c)] = ch;
    }
    var col = function (x) { return (x - X0) / CW; };
    var fil = function (y) { return (y - Y0) / CH; };

    /* ── El marco de ventana, como un menú de Norton Commander ── */

    var mc0 = 1, mc1 = cols - 2, mf0 = 0, mf1 = filas - 1;
    for (var c = mc0; c <= mc1; c++) { pon(c, mf0, G.h); pon(c, mf1, G.h); }
    for (var f = mf0; f <= mf1; f++) { pon(mc0, f, G.v); pon(mc1, f, G.v); }
    pon(mc0, mf0, G.tl); pon(mc1, mf0, G.tr);
    pon(mc0, mf1, G.bl); pon(mc1, mf1, G.br);

    /* ── El cartel del aire lleva su propio recuadro, en línea simple para
          que no compita con el marco de la ventana ── */
    var b = document.getElementById('status-badge');
    var rb = b && b.getBoundingClientRect();
    /* El recuadro sólo si hay lugar para que no toque su propio texto: hacen
       falta tres filas —borde, texto, borde—. Si el cartel entra en menos,
       se dibuja el texto solo, que es lo que hay que leer. */
    if (b && Math.round(fil(rb.bottom)) - Math.round(fil(rb.top)) >= 2) {
      var bc0 = Math.round(col(rb.left)), bc1 = Math.round(col(rb.right));
      var bf0 = Math.round(fil(rb.top)),  bf1 = Math.round(fil(rb.bottom));
      for (var c2 = bc0; c2 <= bc1; c2++) { pon(c2, bf0, G.h2); pon(c2, bf1, G.h2); }
      for (var f2 = bf0; f2 <= bf1; f2++) { pon(bc0, f2, G.v2); pon(bc1, f2, G.v2); }
      pon(bc0, bf0, G.tl2); pon(bc1, bf0, G.tr2); pon(bc0, bf1, G.bl2); pon(bc1, bf1, G.br2);
    }

    /* ── El círculo: anillo de bloques macizos con el play adentro. El
          ancho y el alto se normalizan por separado porque la celda no es
          cuadrada (13×22): sin eso el círculo sale ovalado. ── */
    var pb = document.querySelector('.play-btn');
    if (pb) {
      var rp = pb.getBoundingClientRect();
      var cx = col(rp.left + rp.width / 2), cy = fil(rp.top + rp.height / 2);
      var rx = rp.width / 2 / CW, ry = rp.height / 2 / CH;
      /* ── EL ANILLO SE DIBUJA POR CONTORNO, FILA POR FILA ──────────
         Estaba como banda —"pintá toda celda cuya distancia al centro caiga
         entre 0,72 y 1,16"— y a esta resolución eso no cierra: el botón
         entra en unas cinco filas, así que el redondeo mete tres celdas en
         una fila y ninguna en la siguiente. Salía un grumo, no un círculo.
         Reportado mirándolo en pantalla.
         Por contorno se resuelve la ecuación de la elipse PARA CADA FILA y se
         ponen las dos celdas de cada extremo. Así cada fila tiene su par de
         paredes sí o sí, y el anillo cierra por construcción — que es como se
         dibujaba un círculo en una pantalla de texto. */
      /* ── SOMBREADO POR DENSIDAD, no sólo contorno (19/08) ─────────
         Pedido a partir de una referencia de arte ascii: la imagen sale de la
         VARIACIÓN TONAL —caracteres ordenados por cuánta tinta tienen— y no
         de líneas. Acá se aplica a las formas y NO a los textos: un renglón
         de radio dice algo y una mancha no, así que los textos siguen siendo
         texto. Es el punto medio que hace que el retrato se lea Y tenga
         cuerpo.
         La rampa va de menos a más tinta. Si la fuente no trae los bloques de
         sombreado —el mismo caso que ya obligó al juego ASCII de reserva— se
         usa la rampa de puntuación, que está en todas. */
      var RAMPA = HAY_CAJA && mismoAncho('\u2591') && mismoAncho('\u2592') && mismoAncho('\u2593')
        ? [' ', '\u2591', '\u2592', '\u2593', '\u2588']
        : [' ', '.', ':', '*', '#'];
      var sombra = function (c, f, d) {
        if (d <= 0.02) return;
        pon(c, f, RAMPA[Math.max(1, Math.min(4, Math.round(d * 4)))]);
      };
      /* El interior del círculo, con caída suave desde el centro: es lo que
         lo vuelve un objeto con volumen en vez de una silueta. */
      for (var fi = Math.ceil(cy - ry); fi <= Math.floor(cy + ry); fi++) {
        for (var ci = Math.ceil(cx - rx); ci <= Math.floor(cx + rx); ci++) {
          var ddx = (ci - cx) / rx, ddy = (fi - cy) / ry;
          var dd = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dd < 0.78) sombra(ci, fi, 0.30 + 0.35 * (1 - dd));
        }
      }
      var f0 = Math.round(cy - ry), f1 = Math.round(cy + ry);
      for (var f3 = f0; f3 <= f1; f3++) {
        var dy = (f3 - cy) / ry;
        var ex = Math.sqrt(Math.max(0, 1 - dy * dy)) * rx;
        /* Las tapas: la PRIMERA y la ÚLTIMA fila van llenas de lado a lado, o
           el círculo queda abierto en los polos. Se decide por número de fila
           y no por la distancia, porque con cinco filas el redondeo hace que
           la fila de arriba no llegue a |dy| >= 1 y se dibujaba como pared:
           salía un anillo abierto arriba y cerrado abajo. */
        if (f3 === f0 || f3 === f1) {
          var tapa = Math.max(2, Math.round(rx * 0.5));
          for (var ct = -tapa; ct <= tapa; ct++) pon(Math.round(cx) + ct, f3, G.lleno);
          continue;
        }
        /* Dos celdas por pared: con una sola el trazo desaparece en las filas
           donde la pared cae justo entre dos columnas. */
        var iz = Math.round(cx - ex), de = Math.round(cx + ex);
        pon(iz, f3, G.lleno); pon(iz + 1, f3, G.lleno);
        pon(de, f3, G.lleno); pon(de - 1, f3, G.lleno);
      }
      /* EL TRIÁNGULO SE ARMA CON BLOQUES, no con '▶' (18/08).
         Los glifos de "Geometric Shapes" —▶ ▮ ►— NO están garantizados en la
         fuente monoespaciada de un Android, y si el navegador los sustituye
         por otra tipografía dejan de medir una celda: la grilla entera se
         corre y el retrato se dentea. Es un modo de falla que sólo aparece
         en el teléfono, o sea el peor lugar para descubrirlo.
         Los bloques (U+2588…) y los bordes de caja (U+2500…) sí están en
         cualquier monoespaciada, incluida la de Android. Con ellos el
         triángulo se dibuja igual y no depende de nadie. */
      var tx = Math.round(cx), ty = Math.round(cy);
      pon(tx - 1, ty - 1, G.lleno);
      pon(tx - 1, ty, G.lleno); pon(tx, ty, G.lleno);
      pon(tx - 1, ty + 1, G.lleno);
    }

    /* ── El fader: barra vertical con su cabezal a la altura del volumen ── */
    var vol = document.getElementById('volume');
    if (vol) {
      var rv = vol.getBoundingClientRect();
      /* Acotado adentro del marco: el fader vive pegado al borde derecho de
         la composición, así que sin esto se dibuja encima del ║. */
      var vc = Math.min(mc1 - 1, Math.round(col(rv.left + rv.width / 2)));
      var vf0 = Math.round(fil(rv.top)), vf1 = Math.round(fil(rv.bottom));
      /* El fader también sombreado: lleno de tinta abajo hasta donde llega el
         volumen, y apenas insinuado arriba. Muestra el dato en vez de dibujar
         un palito — el CSS ya recibe `--vol-pct` y acá se lee el mismo valor. */
      var nivel = parseFloat(vol.value);
      if (isNaN(nivel)) nivel = 0.8;
      for (var f4 = vf0; f4 <= vf1; f4++) {
        var alto = vf1 === vf0 ? 1 : (vf1 - f4) / (vf1 - vf0);
        pon(vc, f4, alto <= nivel ? G.lleno : G.v2);
      }
      var pos = 1 - (parseFloat(vol.value) || 0);   /* el fader va al revés */
      pon(vc, Math.round(fil(rv.top + rv.height * pos)), G.cabezal);
    }

    /* ── LOS TEXTOS, con su texto. Van DESPUÉS del círculo y del fader a
          propósito: si algo se pisa, gana lo que se lee. ── */
    var UTIL = cols - 4;   /* lo que queda adentro del marco */
    /* ⚠️ DOS RENGLONES NO PUEDEN CAER EN LA MISMA FILA (19/08, reportado)
       Se veía así, en una captura de la PC:

         DESDE TR10:42 a. m.CON AMOR      ← la bajada con el reloj encima
         Mand2 escuchandoaje              ← la nota con los oyentes encima

       La fila sale de la posición vertical del elemento dividida por el alto
       de celda, que es de 23 px. Dos elementos que en pantalla están a menos
       de eso —el reloj bajo la bajada, los oyentes bajo la nota— caen en la
       misma fila, y el segundo pisa al primero letra por letra. En un teléfono
       casi no pasa porque la composición es más alta; en una ventana ancha
       pasa siempre.

       Se lleva el que llega segundo a la fila de abajo, y si también está
       ocupada, a la de arriba. Nunca se pierde un renglón: el retrato copia lo
       que se ve, y los dos se ven. */
    var filasUsadas = {};
    lineas.forEach(function (l) {
      var t = l.t;
      /* Recortar con puntos suspensivos y no a cuchillo: un renglón cortado
         al medio parece un error de dibujo; con … se lee que sigue. */
      if (t.length > UTIL) t = t.slice(0, UTIL - 1) + '…';
      var f = Math.round(fil(l.r.top + l.r.height / 2));
      if (filasUsadas[f]) {
        if (!filasUsadas[f + 1] && f + 1 < filas - 1) f = f + 1;
        else if (!filasUsadas[f - 1] && f - 1 > 0) f = f - 1;
      }
      filasUsadas[f] = 1;
      var c0 = Math.round(col((l.r.left + l.r.right) / 2) - t.length / 2);
      for (var i = 0; i < t.length; i++) pon(c0 + i, f, t.charAt(i));
    });

    /* ── El dial, al pie: cada marca donde está, y la elegida más gruesa.
          Acotado al interior del marco — una marca fuera de la ventana se
          lee como suciedad, no como parte del dibujo. ── */
    [].forEach.call(document.querySelectorAll('.parada-marca'), function (m) {
      var rm = m.getBoundingClientRect();
      if (!rm.width) return;
      var mc = Math.round(col(rm.left + rm.width / 2));
      if (mc <= mc0 || mc >= mc1) return;
      /* '█' y '·' por lo mismo que el triángulo: '▮' no está garantizado. */
      /* Y una fila arriba del borde como mucho: el dial es lo último de la
         composición, así que su fila cae justo sobre el marco de abajo. */
      var fm = Math.min(filas - 2, Math.round(fil(rm.top + rm.height / 2)));
      pon(mc, fm, rm.width > 1.5 ? G.lleno : G.marca);
    });

    /* ── SE ESCRIBE BLOQUE POR BLOQUE, DE A TRES POR CUADRO ──────────
       En orden de lectura, con el cursor blanco en el que sigue: es el
       ritmo de una pantalla de DOS pintándose sola, que es lo que se pidió
       — que se VEA cómo se dibuja, no que aparezca ya dibujado. */
    var celdas = [];
    for (var i2 = 0; i2 < rej.length; i2++) if (rej[i2] !== ' ') celdas.push(i2);

    var tinta = piel.vars['--primary-bright'] || '#b31b14';
    var blanco = piel.vars['--text'] || '#e0e0e0';
    var inicio = performance.now(), cambiada = false;
    /* Cuándo se terminó de dibujar DE VERDAD — se anota en el cuadro en que
       pasa, no se estima. Ver la nota larga abajo, en el cierre del lazo. */
    var tFin = 0;
    var QUIETO = 2000;      /* se queda completo, para poder mirarlo */
    var DESVANECE = 800;    /* y recién ahí se disuelve */

    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, an, al);
    /* La fuente ya quedó puesta por medirGrilla(): volver a fijarla acá con
       otro tamaño era justamente lo que rompía la teselación.
       Y la línea de base va en `alphabetic` con el ascenso medido sumado, no
       en `top`: con `top` el navegador alinea contra el alto del cuadratín,
       que no es el mismo número que el alto de celda, y las filas quedan con
       un hueco que crece hacia abajo. */
    ctx.textBaseline = 'alphabetic';

    /* `cursor` es el índice de celda donde quedó el bloque blanco, para poder
       borrarlo en el cuadro siguiente. -1 = no hay cursor puesto. */
    var puestas = 0, espera = 0, cursor = -1;

    /* El redibujado del modo ascii: todo de una, sin cursor y sin disolver. */
    if (instantaneo) {
      ctx.fillStyle = tinta;
      for (var iq = 0; iq < celdas.length; iq++) {
        var kq = celdas[iq], cq = kq % cols, fq0 = (kq - cq) / cols;
        ctx.fillText(rej[kq], X0 + cq * CW, Y0 + fq0 * CH + subeLinea);
      }
      return;
    }

    (function cuadro(t) {
      if (espera > 0) { espera--; }
      else {
        /* ⚠️ PRIMERO SE BORRA EL CURSOR DEL CUADRO ANTERIOR (18/08).
           El cursor es un BLOQUE LLENO y se dibujaba sin borrarse nunca. El
           carácter que después va en esa celda lo tapa sólo donde tiene tinta
           — y un `═` es una línea fina, así que el bloque blanco quedaba
           asomando arriba y abajo. Reportado: "unos rectángulos que no van,
           esos blancos por ejemplo sobre el marco". Se veía sobre todo en el
           marco porque el marco es lo primero que se escribe, y es fino.
           Se borra con el color de fondo y se REPINTAN LOS VECINOS de al
           lado: la tinta de un bloque mide 12 px sobre un avance de 10,45,
           o sea que invade la celda de al lado, y borrar a secas le comería
           ese pedazo al carácter ya escrito. */
        if (cursor >= 0) {
          var cx0 = cursor % cols, cy0 = (cursor - cx0) / cols;
          /* SE BORRA CON HOLGURA Y SE REPINTAN LOS NUEVE VECINOS.
             Borraba una celda exacta y en el teléfono quedaba una astilla del
             bloque asomando ARRIBA de la letra —esas barritas sobre las
             mayúsculas de la captura—: el alto de caja que reporta la fuente
             de Android se queda corto contra la tinta real, así que un
             rectángulo de un alto de celda no la tapa entera.
             Media celda de más en cada lado la cubre con margen. Y hay que
             repintar el vecindario completo, no sólo los costados: al borrar
             de más se comen los pedazos que invaden desde arriba y desde
             abajo también. Son nueve fillText por cuadro, que no es nada al
             lado de tener que confiar en una métrica que miente. */
          ctx.fillStyle = '#050505';
          ctx.fillRect(X0 + cx0 * CW - CW * 0.5, Y0 + cy0 * CH - CH * 0.5,
                       CW * 2, CH * 2);
          ctx.fillStyle = tinta;
          for (var vf = cy0 - 1; vf <= cy0 + 1; vf++) {
            for (var vc = cx0 - 1; vc <= cx0 + 1; vc++) {
              if (vc < 0 || vc >= cols || vf < 0 || vf >= filas) continue;
              var iv = vf * cols + vc;
              if (iv < cursor && rej[iv] !== ' ')
                ctx.fillText(rej[iv], X0 + vc * CW, Y0 + vf * CH + subeLinea);
            }
          }
          cursor = -1;
        }
        for (var n = 0; n < 3 && puestas < celdas.length; n++, puestas++) {
          var i = celdas[puestas];
          var c = i % cols, f = (i - c) / cols;
          ctx.fillStyle = tinta;
          ctx.fillText(rej[i], X0 + c * CW, Y0 + f * CH + subeLinea);
        }
        if (puestas < celdas.length) {
          cursor = celdas[puestas];
          var cc = cursor % cols, ff = (cursor - cc) / cols;
          ctx.fillStyle = blanco;
          ctx.fillText(G.lleno, X0 + cc * CW, Y0 + ff * CH + subeLinea);
        }
      }

      /* ── CUÁNDO TERMINÓ DE DIBUJARSE: SE ANOTA, NO SE ESTIMA (18/08) ──
         Reportado: "lo que aparece de fondo no se termina de dibujar".
         Eran dos cosas, y las dos vivían en estas diez líneas.

         UNA · el instante de terminar estaba ESTIMADO como
         `(celdas.length / 3) * 16.7`, o sea suponiendo que cada cuadro dura
         16,7 ms. Pero cada cuadro dibuja tres bloques sobre un canvas a
         pantalla completa, y en un teléfono eso no sale a 60 por segundo.
         Con cuadros más lentos `pasado` crecía más rápido que la estimación,
         así que la cuenta ya estaba por encima de los 2000 EN EL MISMO
         CUADRO en que se terminaba el retrato: se borraba apenas quedaba
         completo, o sea justo cuando había algo para mirar.
         El umbral sale de la propia cuenta: son N = celdas/3 cuadros, y el
         borrado instantáneo empieza cuando cada cuadro dura más de
         16,7 + 2000/N ms. Para un retrato de ~600 celdas son 26,7 ms, o sea
         por debajo de 37 cuadros por segundo — y baja cuanto más grande la
         pantalla. Un teléfono cae ahí sin esforzarse.
         El instante real no hace falta estimarlo: se anota cuando pasa.

         DOS · el desvanecido no corría NUNCA. Estaba escrito
         `if (desde > 2000) { opacidad…; if (desde > 1600) { borrar } }`, y
         la condición de adentro es siempre cierta dentro de la de afuera: se
         ponía la opacidad en 1 y en el mismo cuadro se borraba todo. Los
         800 ms de disolución eran código inalcanzable, y por eso el final se
         leía como un corte. */
      if (puestas >= celdas.length) {
        if (!tFin) tFin = t;
        if (!cambiada) { cambiada = true; aplicarPiel(piel); }
        var desde = t - tFin;
        if (desde > QUIETO) {
          /* NO SE DISUELVE: SE QUEDA, Y SE PUEDE USAR.
             Acá el retrato se borraba y volvías al reproductor normal. Ahora
             entra el MODO ASCII y la pantalla de texto se queda puesta.
             Se puede usar porque el dibujo se arma con la posición REAL de
             cada elemento y el lienzo tiene `pointer-events: none`: cada cosa
             está pintada justo encima del control que representa y los toques
             la atraviesan. Medido: tocar donde está dibujado el ▶ le llega a
             `#btn`, el volumen a `#volume`, Historial a `#hist-toggle`. */
          anunciar(piel);
          entrarModoAscii(piel);
          return;
        }
      }
      requestAnimationFrame(cuadro);
    })(inicio);
  }
  function finalAscii(piel) { pintarAscii(piel, false); }

  /* ── EL MODO ASCII: la pantalla de texto, y se usa ────────────────
     El retrato deja de ser una transición y pasa a ser la interfaz. No hay
     nada nuevo que cablear: el lienzo no recibe toques (`pointer-events:
     none` en estilos5.css) y cada cosa está dibujada sobre el control que
     representa, así que el dedo aterriza en el elemento de verdad.

     Lo único que hay que hacer es REDIBUJAR cuando cambia lo que se ve. Un
     retrato que se dibuja una vez miente en cuanto suena otro tema. */
  var modoAscii = null;        /* la piel puesta mientras dura, o null */
  var repintePedido = false;

  function repintarAscii() {
    if (!modoAscii || repintePedido) return;
    repintePedido = true;
    /* En el cuadro siguiente y una sola vez: varios avisos juntos —cambió el
       tema Y el artista Y el historial— tienen que costar un repinte, no
       tres. Es el mismo patrón que ya usa el manejador de scroll del dial. */
    requestAnimationFrame(function () {
      repintePedido = false;
      if (modoAscii) pintarAscii(modoAscii, true);
    });
  }

  function entrarModoAscii(piel) {
    modoAscii = piel;
    lienzo.style.opacity = '';
    /* Se sale del modo efecto: `en-efecto` esconde los oyentes y bloquea el
       anclaje del botón, y esto ya no es un efecto sino la pantalla. */
    app.classList.remove('en-efecto');
    /* Lo que hace que el retrato no mienta. El volumen y el historial avisan
       por evento; el tema y el cartel los cambia el JS del reproductor sin
       avisar, así que se miran con un observador. */
    /* ⚠️ Y SE GUARDAN PARA PODER SACARLOS (19/08). Estaban puestos y
       `salirModoAscii()` sólo desconectaba el observador: cada entrada al modo
       ascii dejaba tres escuchas más colgados del volumen, del historial y del
       `resize`. Entrar y salir varias veces los iba apilando — y `resize` en
       un teléfono se dispara con la barra de URL, así que cada gesto pagaba
       todos los repintes acumulados. Eso es parte de por qué "cada vez cuesta
       más salir". */
    var vol = document.getElementById('volume');
    var hist = document.getElementById('hist-toggle');
    modoAscii.escuchas = [];
    if (vol)  { vol.addEventListener('input', repintarAscii);   modoAscii.escuchas.push([vol, 'input', repintarAscii]); }
    if (hist) { hist.addEventListener('click', repintarAscii);  modoAscii.escuchas.push([hist, 'click', repintarAscii]); }
    window.addEventListener('resize', repintarAscii);
    modoAscii.escuchas.push([window, 'resize', repintarAscii]);
    modoAscii.obs = new MutationObserver(repintarAscii);
    ['#artist', '#title', '#status-badge', '#listeners', '#description', '#clock']
      .forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) modoAscii.obs.observe(el, { childList: true, characterData: true, subtree: true });
      });
  }

  /* Se sale eligiendo una piel: tocar una marca del dial es pedir la radio de
     esa fecha, y ésa se ve como se veía. Lo llama `aplicar()`. */
  function salirModoAscii() {
    if (!modoAscii) return;
    if (modoAscii.obs) modoAscii.obs.disconnect();
    (modoAscii.escuchas || []).forEach(function (e) { e[0].removeEventListener(e[1], e[2]); });
    modoAscii = null;
    var ctx2 = lienzo.getContext('2d');
    ctx2.clearRect(0, 0, window.innerWidth, window.innerHeight);
    lienzo.classList.remove('activo');
    lienzo.style.opacity = '';
  }

  /* ── 2c · Las imágenes ──────────────────────────────────────────
     Un final que muestra una imagen a pantalla completa. El mecanismo
     está listo; las imágenes NO existen todavía.

     Para prenderlo: poner los archivos en `trabajo/bocetos/fantasma/` y
     listarlos acá abajo. Mientras la lista esté vacía, este final no
     entra en el sorteo y no pasa nada — no hace falta tocar otra cosa.

     Se listan a mano y no se lee la carpeta porque un navegador no puede
     listar un directorio: pedirlo al servidor sería inventar un endpoint
     para el único caso que no lo necesita.

     Qué imagen funciona acá: algo que aguante estar a pantalla completa
     un segundo y medio y que no tenga que leerse. Una foto de la sierra,
     el interior de un aparato viejo, una textura. Un logo no: se vería
     como una publicidad. */
  var IMAGENES = [
    // 'bocetos/fantasma/loquesea.jpg',
  ];

  function finalImagen(piel) {
    var url = elegir(IMAGENES);
    var img = new Image();
    img.onload = function () {
      var ctx = lienzo.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var an = window.innerWidth, al = window.innerHeight;
      lienzo.width = an * dpr; lienzo.height = al * dpr;
      lienzo.style.width = an + 'px'; lienzo.style.height = al + 'px';
      ctx.scale(dpr, dpr);
      lienzo.classList.add('activo');

      /* Tapa la pantalla entera sin deformar: se agranda hasta cubrir y lo
         que sobra se recorta, como `background-size: cover`. Deformar una
         foto para que entre justo es lo que la hace ver barata. */
      var escala = Math.max(an / img.width, al / img.height);
      var w = img.width * escala, h = img.height * escala;
      var x = (an - w) / 2, y = (al - h) / 2;

      var inicio = performance.now();
      (function cuadro(t) {
        var pasado = t - inicio;
        var op = pasado < 400 ? pasado / 400
               : pasado < 1500 ? 1
               : Math.max(0, 1 - (pasado - 1500) / 700);
        ctx.clearRect(0, 0, an, al);
        ctx.globalAlpha = op;
        /* Un acercamiento muy leve mientras está: una imagen quieta a
           pantalla completa se ve como un error de carga. */
        var z = 1 + Math.min(pasado, 2200) / 2200 * 0.06;
        ctx.drawImage(img, x - w * (z - 1) / 2, y - h * (z - 1) / 2, w * z, h * z);
        if (pasado > 900 && !img.hecho) { img.hecho = true; aplicarPiel(piel); }
        if (pasado < 2200) requestAnimationFrame(cuadro);
        else { ctx.clearRect(0, 0, an, al); lienzo.classList.remove('activo'); anunciar(piel); }
      })(inicio);
    };
    // Si la imagen no carga, el easter egg no se queda mudo: cae en el giro
    img.onerror = function () { finalGiro(piel); };
    img.src = url;
  }

  /* ── 3 · Los finales, al azar ───────────────────────────────────
     Que el efecto también sea sorpresa fue pedido explícito: si siempre
     pasa lo mismo, a la tercera vez deja de ser un hallazgo. */
  var hallazgo = document.getElementById('dial-hallazgo');
  var reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function anunciar(piel) {
    hallazgo.textContent = piel.nombre;
    hallazgo.classList.remove('mostrar');
    void hallazgo.offsetWidth;   // reinicia la animación
    hallazgo.classList.add('mostrar');
    /* El nombre de lo hallado se dibuja en el mismo renglón que los oyentes
       —arriba del dial, que es el último elemento y no tiene lugar abajo—,
       así que los oyentes se quedan afuera hasta que el cartel se va solo.
       La animación dura 3,4s; se espera eso y recién ahí vuelven. */
    dial.classList.remove('tocando');
    aviso.textContent = '';
    clearTimeout(anunciar.volver);
    /* EL REACOMODO DE LA TIRA, después del efecto y no antes (ver el cierre
       de `soltarLaTira`). Se sacan las copias y la banda vuelve al tope, que
       es de donde salió: la piel que vale es la sorteada, no la marca que
       casualmente quedó bajo la aguja. */
    /* ⚠️ LA LIMPIEZA NO SE CONDICIONA A NINGUNA BANDERA (19/08, regresión).
       Reportado: *"después de parar quedan las rayas ahí; cuando termina el
       efecto y vuelve a lo normal se nota"*.

       Esto estaba adentro de `if (rodando)`. La bandera es correcta para el
       REACOMODO —si el efecto entró por `?egg=` no hubo giro y no hay que
       tocar el scroll— pero **no para el borrado**, y la diferencia es que el
       borrado es acumulativo: `prepararTira()` sale temprano si `clonesTira`
       ya tiene algo, así que **basta que la limpieza no corra UNA vez para que
       las copias queden para siempre** y todos los giros siguientes no
       inserten ni limpien nada. Un estado que se pega así no se recupera solo
       ni recargando el efecto: hay que recargar la página.

       Sacar copias que no existen no cuesta nada —`limpiarTira()` sobre una
       lista vacía es un `for` de cero vueltas—, así que la limpieza va
       siempre y la bandera queda sólo para lo que de verdad depende de que
       haya habido un giro. */
    limpiarTira();
    if (rodando) {
      tira.scrollLeft = tira.scrollWidth - tira.clientWidth;
      rodando = false;
    }
    anunciar.volver = setTimeout(function () {
      app.classList.remove('en-efecto');
      /* Recién ahora la composición está quieta y la piel nueva ya está
         puesta: es el momento de anclar el botón. Durante el efecto se
         salteó a propósito. */
      anclarBoton();
    }, 3400);
  }

  /* Los tiempos siguen a `sintonia`, que dura 1,8s (ver estilos5.css: la
     duración es un límite de seguridad, no una elección estética). Estaban
     en 620/1300 de cuando duraba 1,3s: la clase se sacaba ANTES de que la
     animación terminara, o sea que el efecto se cortaba a la mitad. */
  function finalEstatica(piel) {
    app.classList.add('en-efecto');   /* tambien para la entrada por ?egg= */
    app.classList.add('estatica');
    setTimeout(function () { aplicarPiel(piel); }, 1400);   // en el peor del ruido
    setTimeout(function () {
      app.classList.remove('estatica');
      anunciar(piel);
    }, 2800);
  }

  function finalGiro(piel) {
    app.classList.add('en-efecto');   /* tambien para la entrada por ?egg= */
    app.classList.add('girando');
    /* La piel cambia cuando el aparato está DE CANTO: en ese punto no hay
       nada que ver, así que el cambio no se percibe como un parpadeo sino
       como que del otro lado ya era así. */
    setTimeout(function () {
      aplicarPiel(piel);
      /* `espejado` deja el contenido SIN contragirar: al terminar el giro se
         ve el dorso, todo al revés, como mirar un cartel desde atrás. */
      app.classList.add('del-otro-lado', 'espejado');
    }, 750);
    /* Y el dorso se queda un rato: 2,6 s desde que aterriza. Estaba en
       medio segundo y no se llegaba a apreciar — el giro dura 1,5 s, así
       que el espejado pasaba casi antes de que el ojo terminara de seguir
       el movimiento. Ahora hay tiempo de leerlo al revés, entender qué
       estás viendo, y recién ahí el contenido se acomoda solo.
       El CSS le puso transición a ese contragiro para que la corrección se
       vea; si fuera instantánea el espejado parecería un error. */
    setTimeout(function () {
      app.classList.remove('espejado');
      /* Y SE LIMPIA EL ESTADO. `del-otro-lado` no se sacaba nunca, así que
         después de un giro el reproductor quedaba invertido para siempre y
         TODOS los efectos siguientes pasaban sobre un aparato dado vuelta.
         Reportado como "abusás de la inversión, no la uses en todos".
         Sacar las dos clases juntas no cambia nada a la vista: girar la
         caja 180° y su contenido otros 180° da exactamente lo mismo que no
         girar nada. Lo único que cambia es que el estado queda limpio. */
      app.classList.remove('del-otro-lado');
    }, 4100);
    setTimeout(function () {
      app.classList.remove('girando');
    }, 1500);
    /* El nombre de la emisora entra recién cuando el texto ya se enderezó:
       anunciarlo mientras todo está espejado es pedirle al ojo dos cosas a
       la vez, y el cartel se lee al revés como el resto. */
    setTimeout(function () { anunciar(piel); }, 4300);
  }

  function finalPapelitos(piel) {
    app.classList.add('en-efecto');   /* tambien para la entrada por ?egg= */
    aplicarPiel(piel);
    tirarPapelitos([piel.vars['--primary-bright'], piel.vars['--text'],
                    piel.vars['--primary'], piel.vars['--vol-fill-hi']]);
    anunciar(piel);
  }

  function finalMatrix(piel) {
    app.classList.add('en-efecto');   /* tambien para la entrada por ?egg= */
    /* PRIMERO SE CAE EL REPRODUCTOR, DESPUÉS LLUEVE (18/08, tercera vuelta).
       Las dos veces anteriores la caída sí corría —verificado leyendo las
       animaciones de cada hijo— pero no se veía, porque la lluvia arrancaba
       junto con ella y el canvas la tapaba antes de que llegara a moverse.
       Ahora hay 500 ms de reproductor cayéndose solo, a la vista, y recién
       entonces empieza a llover encima. */
    /* LAS DOS CAÍDAS SE MEZCLAN. Antes el reproductor empezaba a caerse y
       la lluvia arrancaba 500 ms después: se veían como dos cosas
       seguidas, no como una. Ahora llueve primero —apenas unos glifos— y
       el reproductor se suelta cuando la lluvia ya está cayendo, así que
       cae CON ella y no antes ni después. */
    caidaMatrix(function () { aplicarPiel(piel); });
    setTimeout(function () { app.classList.add('desvaneciendo'); }, 380);
    /* 3800 = los 380 de arranque + los 3400 que dura `caerse`. Sacar la
       clase antes corta la vuelta del reproductor a mitad de camino. */
    setTimeout(function () {
      app.classList.remove('desvaneciendo');
      anunciar(piel);
    }, 3800);
  }

  /* CADA EFECTO ATERRIZA DONDE CORRESPONDE (18/08).
     Antes se sorteaba la piel primero y el efecto después, sin relación: la
     lluvia verde de la matrix podía dejar el reproductor violeta, y el
     retrato de terminal dejarlo rosa. El efecto contaba una cosa y el
     resultado otra.
     Ahora los dos que CITAN algo aterrizan en la piel que citan: la matrix
     deja fósforo verde, y el retrato ascii deja el ámbar de un monitor
     monocromo. Los otros tres —estática, giro, papelitos— no citan nada en
     particular, así que siguen sorteando una piel inventada, que es donde el
     azar aporta. */
  function pielDelFinal(elFinal) {
    if (elFinal === finalMatrix)    return pielFija('terminal');
    if (elFinal === finalAscii)     return pielFija('ascii');
    /* Los dos nuevos, con la misma lógica de que el efecto cite su destino:
       la estática es ruido de una pantalla monocroma, y los papelitos son lo
       más parecido a la paleta saturada de un instalador de los noventa. */
    if (elFinal === finalEstatica)  return pielFija('dos');
    if (elFinal === finalPapelitos) return pielFija('apogee');
    /* Queda el giro: es el único que no cita nada, y ahí el azar aporta. */
    return sortearPiel();
  }

  function encontrarFrecuencia() {
    /* ⚠️ SE APAGA EL MODO ASCII ANTES DE EMPEZAR OTRO HALLAZGO.
       El modo ascii deja el retrato puesto en pantalla a propósito —es la
       pantalla, no una transición— y hasta acá lo único que lo apagaba era
       tocar una marca del dial. Así que si después del retrato salía
       cualquier otro efecto, el dibujo VIEJO se quedaba encima: el
       reproductor nuevo abajo, una pintura vieja arriba, y el dedo tocando
       donde VE el ▶ dibujado mientras el botón real está en otro lado.
       Reportado como "el play no funciona", primero con `monocromo` y
       después también con `ascii` — o sea que no era de ninguna piel: era
       esto, y aparecía en la siguiente piel que saliera después de un ascii.
       Un modo que persiste tiene que apagarse en TODAS las puertas de
       salida, no sólo en la que uno tenía en la cabeza al escribirlo. */
    salirModoAscii();
    if (reducido) { var p = sortearPiel(); aplicarPiel(p); anunciar(p); return; }
    var finales = [finalEstatica, finalGiro, finalPapelitos, finalMatrix, finalAscii];
    // El de las imágenes entra sólo si hay imágenes cargadas (ver 2c)
    if (IMAGENES.length) finales.push(finalImagen);
    var elFinal = elegir(finales);
    elFinal(pielDelFinal(elFinal));
  }

  /* ── 4 · EL GESTO: mantener apretado, y la tira sale rodando ─────
     Reescrito el 18/08. La versión anterior medía CUÁNTO tirabas más allá
     del final, y era difícil que enganchara: el dial arranca centrado en
     "hoy", que ya es la última parada, así que todo gesto empezaba en
     estado de "estás tirando" y peleaba con el desplazamiento nativo del
     navegador. Distinguir "no puedo desplazar más y el dedo sigue yendo"
     de "estoy desplazándome normalmente" no se puede medir bien desde
     JavaScript sin pelearle al navegador.

     El tiempo sí se mide bien. Ahora el gesto es: apoyar el dedo en el
     dial y SOSTENERLO. A los 1,4 segundos la tira se suelta, sale rodando
     sola a toda velocidad, y de ahí va al efecto. No depende de dónde esté
     la tira, ni de cuánto se arrastre, ni de discutir con el scroll.

     Lo que lo protege de dispararse sin querer:
       · MOVERSE LO CANCELA. Más de 12 px y se aborta. Pasar pieles es
         mover; el gesto es no moverse. Son dos cosas que el dedo distingue
         solo, y el código también.
       · 1,4 s es mucho más de lo que dura un toque para elegir una piel.
       · Se puede abandonar en cualquier momento levantando el dedo.

     La carga se ve: es la misma `--tension` de antes, que ahora crece con
     el TIEMPO en vez de con la distancia, y el mismo tratamiento visual
     del CSS. Lo que cambia es qué la alimenta. */
  var SOSTENER = 3500;   /* ms apoyado contra el tope para que se suelte.
       Pasó por 1400, 1600 y 2600. A 3,5 s el gesto es inequívoco: nadie
       llega ahí sin querer, y hay tiempo de sobra para arrepentirse. */
  var tension = 0, presionando = false, disparado = false;
  var t0Carga = 0, rafCarga = null, t0Presion = 0;

  /* ¿La tira está contra el tope? LA ÚLTIMA FECHA BAJO LA AGUJA, y no un
     número de scroll — que era el error de fondo de todas las versiones
     anteriores del gesto y la razón de que fuera "imposible en el celu".

     Medido el 18/08: el tope teórico (`scrollWidth - clientWidth`) es 448,
     pero el imán del scroll centra la última marca y ahí `scrollLeft` se
     queda en 417. Los 31 px que faltan son el resto del espaciador de la
     derecha, y NO se pueden recorrer: apenas soltás, el imán te devuelve.
     O sea que "estoy contra el tope" era una condición imposible de
     cumplir, salvo forzando el scroll a mano — que es exactamente lo que
     pasaba en la PC y no en el teléfono.

     Preguntado así es lo mismo que uno quiere decir: llegaste a la última
     fecha y seguís insistiendo. Y de paso es robusto, porque no depende de
     cuánto mida el espaciador ni de dónde frene la inercia. */
  function contraElTope() {
    var ultima = paradas[paradas.length - 1];
    return bajoLaAguja() === ultima;
  }

  function pintarTension() {
    dial.style.setProperty('--tension', tension.toFixed(3));
    dial.classList.toggle('tirando', tension > 0.02);
    /* El aviso dice ∞ desde el principio de la carga, no "SEGUÍ": es la
       estación a la que estás yendo —una que no termina nunca— y de paso
       es lo mismo que el dial marca mientras gira. Un texto en castellano
       ahí delataba el secreto y encima cambiaba a mitad de camino. */
    if (tension > 0.06) aviso.textContent = '∞';
  }

  /* EL LAZO DE CARGA. Corre mientras el dedo está apoyado, y en cada cuadro
     mira UNA sola cosa: si la tira está contra el tope. Si está, suma
     tiempo; si no, lo devuelve a cero.

     Moverse NO cancela, y ése era el error de la versión anterior: cancelar
     por movimiento hacía imposible el gesto que se pidió, porque para
     llegar al tope hay que arrastrar hasta ahí — o sea moverse. Lo que
     cancela es SALIRSE del tope, que es lo contrario de insistir.

     Y por eso tampoco importa dónde empezó el dedo: podés arrastrar desde
     el medio, llegar al final, y seguir apretando. La carga arranca sola
     cuando la tira toca el tope. */
  /* Cuándo fue el último movimiento de la tira. Lo usa el lazo de carga:
     mientras la tira se mueve NO se carga, y por lo tanto no se le pone el
     `transform` de `.tirando` al dial.
     Reportado el 18/08: al descansar en la última marca —que es donde el
     dial arranca— cualquier toque empezaba a cargar, y el transform que eso
     le pone al contenedor le cortaba el desplazamiento al navegador a mitad
     del gesto: "se cuelga y no se puede deslizar por segundos".
     Con este freno, arrastrar es arrastrar y sostener es sostener. */
  var ultimoMovimiento = 0;
  tira.addEventListener('scroll', function () { ultimoMovimiento = performance.now(); }, { passive: true });
  var QUIETA = 220;   // ms sin moverse para considerar que se apoyó

  /* ⚠️ EL PRIMER CUARTO DE SEGUNDO NO SE TOCA NADA (19/08, reportado)
     Reportado: *"el dial en reposo no se puede apoyar el dedo y deslizar;
     demanda tocar y activarlo y recién ahí deslizar"*.

     La causa está en el orden. En reposo la tira está CONTRA EL TOPE —"hoy"
     es la última marca— y lleva rato quieta, así que `contraElTope()` y
     `quieta` dan las dos verdadero **en el primer cuadro del toque**. O sea
     que apoyar el dedo arrancaba la carga al instante, y con ella dos cosas
     que le pelean el gesto al navegador:

       · `contraElTope()` llama a `bajoLaAguja()`, que mide LAS ONCE MARCAS
         más la tira con `getBoundingClientRect` — doce lecturas de
         maquetación forzadas por cuadro, justo en los milisegundos en que el
         compositor está decidiendo si ese toque es un desplazamiento;
       · a los 70 ms la tensión pasa de 0,02 y entra la clase `.tirando`, que
         le pone un `transform` a las paradas.

     El freno de `quieta` no alcanza porque mira si la TIRA se movió, y en
     reposo todavía no se movió nada: sólo se apoyó un dedo. Recién cuando el
     desplazamiento arranca de verdad llega el primer evento de scroll, y para
     entonces el estorbo ya ocurrió — de ahí que el primer intento se sienta
     muerto y el segundo funcione.

     La espera de 250 ms es lo que separa las dos intenciones: **deslizar
     empieza a moverse enseguida; sostener no se mueve nunca.** Un gesto de
     arrastre nunca llega a los 250 ms quieto, así que ahora no toca
     maquetación ni recibe transform alguno. Y al gesto de 3,5 s le agrega un
     cuarto de segundo que nadie va a notar.

     ⚠️ Y NO se mide nada durante esa espera: se sale antes de `contraElTope()`.
     Ése es el punto — no es demorar la carga, es **no tocar el layout mientras
     el navegador decide de quién es el gesto**. */
  var ESPERA_GESTO = 250;

  function lazoCarga() {
    if (!presionando) return;
    if (performance.now() - t0Presion < ESPERA_GESTO) {
      rafCarga = requestAnimationFrame(lazoCarga);
      return;
    }
    var quieta = performance.now() - ultimoMovimiento > QUIETA;
    /* ⚠️ SI LA TIRA SE MUEVE, NO SE MIDE NADA. SE SALE ACÁ.
       Medido en un teléfono el 18/08 con 51 gestos: los eventos de scroll
       fluían, se cortaban de golpe hasta 801 ms, y seguían. No era la tira
       asentándose —eso es `quieto`, otro número— sino congelándose en medio
       del movimiento. Y con CERO tareas largas del hilo en los 51 gestos.

       La causa está en el orden de esta condición. `contraElTope()` llama a
       `bajoLaAguja()`, que mide LAS ONCE MARCAS más la tira con
       `getBoundingClientRect`: doce lecturas de maquetación forzadas por
       cuadro, mientras el dedo está apoyado. Ninguna dura lo suficiente para
       contar como tarea larga —por eso no aparecían en la medición— pero
       forzar maquetación en cada cuadro mientras el compositor está
       desplazando le devuelve el scroll al hilo principal, y ahí se traba.

       El comentario de abajo ya decía la intención correcta —"mientras la
       tira se mueve NO se carga"— pero el código MEDÍA ANTES DE DECIDIR:
       JavaScript evalúa `contraElTope() && quieta` de izquierda a derecha,
       así que la medición cara salía siempre, incluso en el caso en que el
       resultado se iba a descartar.
       Saliendo temprano el lazo no toca la maquetación mientras algo se
       mueve, que es cuando más caro es tocarla. */
    if (!quieta) {
      if (t0Carga || tension > 0) {
        t0Carga = 0; tension = 0; pintarTension();
        dial.classList.remove('tirando'); aviso.textContent = '';
      }
      rafCarga = requestAnimationFrame(lazoCarga);
      return;
    }
    if (contraElTope()) {
      if (!t0Carga) t0Carga = performance.now();
      tension = Math.min(1, (performance.now() - t0Carga) / SOSTENER);
      pintarTension();
      if (tension >= 1) { presionando = false; rafCarga = null; soltarLaTira(); return; }
    } else if (t0Carga || tension > 0) {   /* se movió o se salió del tope */
      t0Carga = 0; tension = 0; pintarTension();
      dial.classList.remove('tirando'); aviso.textContent = '';
    }
    rafCarga = requestAnimationFrame(lazoCarga);
  }

  /* ── LA BANDA SE VUELVE CIRCULAR, SIN QUE SE VEA EL EMPALME ──────
     El truco de los carruseles infinitos, que es la solución estándar y
     debería haber sido la primera: la banda es PERIÓDICA —los mismos once
     días repetidos— así que la posición X y la posición X + un período
     muestran exactamente lo mismo. Entonces se agregan las copias y en el
     mismo cuadro se salta un período hacia adelante: la pantalla no cambia
     ni un píxel, y de golpe hay trece bandas de recorrido a la derecha.

     Lo que se probó antes y falló, para no repetirlo:
       · copias al soltar, pegadas → aparecen de la nada, porque la mitad
         derecha visible mide 155 px y cualquier cosa que se inserte ahí se
         ve en el mismo cuadro;
       · copias con un hueco de media pantalla → arranca recorriendo un
         tramo de vacío;
       · copias DURANTE la carga → cambia el ancho de la tira, el imán
         (`scroll-snap: mandatory`) re-engancha en un punto nuevo, la banda
         se mueve, eso cancela la carga, se borran las copias y el imán
         vuelve a enganchar: un oscilador. Se veía como que la banda
         retrocede y el gesto nunca dispara. */
  var clonesTira = [];
  function prepararTira(vueltas) {
    if (clonesTira.length) return 0;
    var grupos = [].slice.call(tira.querySelectorAll('.dia-paradas'));
    /* Un período = el ancho de la banda entera con sus huecos entre días */
    var periodo = grupos[grupos.length - 1].getBoundingClientRect().right
                - grupos[0].getBoundingClientRect().left + 18;

    /* ⚠️ Y ACÁ VA UN ESPACIADOR DE VERDAD, QUE ES EL ARREGLO (19/08, banco).
       Éste era el pendiente rojo: *"al lanzarse el movimiento aparece la tira
       completa con todas las marcas"*. Nueve intentos tocaron la velocidad,
       la rampa, la curva y la máscara, y el síntoma seguía.

       No era el movimiento. Era ESTO:

       el vacío de la derecha lo hace `.dial-tira::after { flex: 0 0 50% }`, y
       un `::after` es un PSEUDOELEMENTO — o sea que en el árbol de cajas es
       siempre el último hijo, pase lo que pase con el DOM. Entonces las
       copias, que se agregan con `appendChild`, NO caen detrás del
       espaciador: caen ENTRE "hoy" Y ÉL. Justo adentro del hueco que el
       oyente está mirando.

       Medido en el dial real, con el imán apagado como acá (`banco-dial.html`,
       reloj virtual, ancho 297):

         sin espaciador   la primera copia nace en x=161 —trece píxeles
                          PASADA la aguja—, cuatro marcas se hacen visibles
                          en el mismo cuadro y el vacío inicial es de 3 px:
                          no hay ninguna pausa, la banda ya está llena
                          cuando el giro arranca;
         con espaciador   la primera copia nace en x=328, o sea 31 px afuera
                          del borde derecho (que está en 297); cero marcas
                          visibles al insertar, vacío inicial de 196 px, y
                          las marcas entran de a UNA.

       El comentario de abajo describía el comportamiento que se quería —"la
       banda cruza el hueco del espaciador y recién entonces las copias
       empiezan a cruzar el borde"— y era exactamente lo que NO estaba
       pasando. Sacar el salto de período fue necesario pero no suficiente:
       faltaba que hubiera algo que cruzar.

       El espaciador se va con `limpiarTira()` como cualquier copia, porque se
       anota en la misma lista. */
    var espaciador = document.createElement('div');
    espaciador.style.flex = '0 0 50%';
    espaciador.dataset.clon = '1';
    espaciador.setAttribute('aria-hidden', 'true');
    tira.appendChild(espaciador);
    clonesTira.push(espaciador);

    for (var v = 0; v < vueltas; v++) {
      grupos.forEach(function (g) {
        var cl = g.cloneNode(true);
        cl.setAttribute('aria-hidden', 'true');
        cl.dataset.clon = '1';
        [].forEach.call(cl.querySelectorAll('.parada'), function (b) {
          b.tabIndex = -1; b.style.pointerEvents = 'none';
        });
        tira.appendChild(cl);
        clonesTira.push(cl);
      });
    }
    return periodo;
  }
  function limpiarTira() {
    clonesTira.forEach(function (c) { c.remove(); });
    clonesTira = [];
  }

  function empezarPresion() {
    if (disparado || presionando) return;
    presionando = true; t0Carga = 0;
    t0Presion = performance.now();
    lazoCarga();
  }

  function soltarPresion() {
    presionando = false; t0Carga = 0;
    if (rafCarga) { cancelAnimationFrame(rafCarga); rafCarga = null; }
    if (disparado || tension === 0) return;
    (function relajar() {   /* se destensa como una cuerda que soltás */
      tension = Math.max(0, tension - 0.08);
      pintarTension();
      if (tension > 0) requestAnimationFrame(relajar);
      else { dial.classList.remove('tirando'); aviso.textContent = ''; }
    })();
  }

  /* LA TIRA SALE RODANDO. No es una animación de adorno: es la tira
     desplazándose de verdad, con las marcas pasando por la aguja cada vez
     más rápido, hasta que se vuelven una mancha. La piel NO cambia durante
     el giro —`aplicar()` no se llama— porque once cambios de piel en un
     segundo es epilepsia, no un efecto.
     Arranca rápido y sigue acelerando; a los 1,1 s se corta y entra el
     final sorteado, que es el que se lleva la atención. */
  /* ══════════════════════════════════════════════════════════════
     LA FÍSICA DEL DESBLOQUEO, en cuatro tiempos

     Reescrita el 18/08 con la descripción del usuario, que es la que vale
     porque describe lo que el dedo espera sentir:

       1. TIRÁS hacia la izquierda y el tope EMPIEZA A CEDER. La banda se
          corre un poco más allá de donde debería, como una goma que se
          estira. Cuanto más sostenés, más cede.
       2. SE ZAFA. La goma se suelta de golpe.
       3. ACELERA, y mientras acelera aparecen marcas nuevas por el borde
          DERECHO — porque la banda va hacia la izquierda y lo que entra,
          entra por el otro lado.
       4. EMPIEZA A FRENAR, pero NO se detiene del todo: el efecto se lleva
          la pantalla con la banda todavía en movimiento.

     Los dos errores de las versiones anteriores, anotados para no
     repetirlos: hacer que las marcas nuevas entraran por la izquierda (se
     ve como si rebotara), y frenar hasta cero antes del efecto (se ve como
     si se hubiera acabado la cuerda). ══════════════════════════════════ */
  /* Cancela el paneo que el navegador ya venía haciendo con el dedo apoyado.
     Sólo está enganchado mientras dura el giro. */
  function frenarDedo(e) { if (e.cancelable) e.preventDefault(); }

  /* ── LA CURVA DE VELOCIDAD, EN UNA FUNCIÓN PROPIA ───────────────
     Estaba adentro del lazo. Sale afuera porque ahora hace falta INTEGRARLA
     antes de arrancar: el giro tiene que aterrizar exactamente en el tope, y
     para saber cuánto recorre hay que sumarla cuadro a cuadro. Es la misma
     cuenta, en el mismo orden; lo único que cambia es dónde vive.
     `f` va de 0 a 1 y devuelve píxeles por cuadro. */
  /* Las cuatro perillas de la curva. Vivían adentro de `soltarLaTira()`;
     suben acá porque ahora las usa también la integral. Los porqués de cada
     número están en los comentarios largos de abajo. */
  /* ⚠️ EL PICO, EN EL MÁXIMO PERCEPTIBLE (19/08, pedido: *"hacelo a la
     velocidad máxima perceptible"*).

     El techo no es una opinión: **es el paso entre marcas, 35 px** (44 entre
     días), medido en la página. Si un cuadro avanza más que eso, la banda
     salta más de una marca y el ojo no puede emparejar una con la siguiente:
     el movimiento parpadea o parece ir al revés. Es el efecto de las ruedas de
     carro en el cine, y ya costó dos reportes cuando se probó con 44 —"no hay
     continuidad" y "gira para el otro lado"— que no eran de ajuste sino de
     muestreo insuficiente.

     **34 es ese techo menos un píxel**: 0,97 marcas por cuadro contra las 0,80
     de antes. Es todo lo que se puede ir sin romper la lectura del movimiento.

     ⚠️ Y ahora este número quiere decir algo preciso: **píxeles por cuadro de
     60 Hz**. Desde que el movimiento se integra sobre el tiempo real, en una
     pantalla de 144 Hz la velocidad en píxeles por segundo es la misma pero
     cada cuadro avanza 14,6 px — o sea que ahí sobra margen contra el techo y
     el movimiento se ve MÁS fino, no más rápido. El que manda es el caso de
     60 Hz, que es el peor. */
  /* ⚠️ EL PISO Y LA CAÍDA — EL ARRASTRE (19/08, reportado)
     *"Se ve la mitad del tiempo el movimiento y después se freeza."*

     No se congelaba: **se arrastraba**. Medido sobre la curva, repartiendo el
     recorrido en el tiempo:

       piso 2 · caída 3,8   el 90 % del recorrido en el primer 56 % del tiempo,
                            y **el 45 % del giro por debajo de 4 px por cuadro**
                            — casi dos segundos y medio de movimiento que no se
                            ve, con la banda todavía andando.
       piso 0 · caída 1,7   el 90 % en el 60 %, y sólo el 24 % de arrastre.

     Dos causas sumadas. La **caída** estaba en 3,8 porque se la había subido
     para "pasar menos tiempo arriba" —era el reclamo opuesto, de cuando el
     pico duraba demasiado—, y con el pico ahora en el techo perceptible esa
     corrección quedó de más. Y el **piso de 2 px por cuadro** venía de cuando
     el efecto entraba a mitad del giro y la banda tenía que seguir andando;
     desde que el efecto entra CUANDO PARA, ese piso es exactamente el
     arrastre: 120 px por segundo, que es no moverse pero sin quedarse quieto.

     ⚠️ **Y LA CAÍDA ES LINEAL (caída = 1), que es la segunda mitad del mismo
     reporte**: *"en el último tramo se sigue freezando, queda freezado hasta
     que hace el efecto"*. Con caída 1,7 el arrastre seguía en 1.291 ms. El
     problema es la FORMA: una potencia siempre deja cola —la velocidad cae
     rápido al principio y después se arrastra—, y cortarla antes con una
     rampa no ayuda (probado: 25-32 % de arrastre en todas las variantes).

     Una caída **lineal** es desaceleración constante, que es lo que hace la
     fricción de verdad, y no tiene cola: la velocidad baja parejo y cruza el
     umbral de lo perceptible recién al final.

       caída 1,7 + rampa   arrastre 1.291 ms · 99 % del recorrido al 82 %
       **caída 1 lineal**  **arrastre 617 ms** · 99 % del recorrido al **91 %**

     Y por eso también desaparece la rampa del último 14 %: con la caída
     lineal la velocidad llega a cero sola en f = 1, y superponerle una rampa
     volvía a fabricar la cola que se quería sacar. */
  /* ⚠️ EL TECHO ESTABA MAL DOCUMENTADO, Y ES LA RAÍZ DE TODO (19/08)

     La carpeta dice, en tres lugares, que el techo son **35 px por cuadro**
     porque "más de una marca por cuadro" vuelve ambiguo el movimiento. Está
     mal por un factor de dos: el dial es un **estroboscopio** —marcas
     idénticas cada 35 px pasando frente a una aguja fija— y en un patrón
     periódico el límite para que el sentido se lea sin ambigüedad es **medio
     paso por cuadro**, que es Nyquist. Por encima de p/2 el ojo puede
     emparejar cada marca con la siguiente o con la anterior, y elige la más
     cercana:

       17,5 px = 0,50 p   el límite
       24     = 0,69 p    ambiguo — el valor que estuvo meses
       28     = 0,80 p    se lee hacia atrás, lento
       34     = 0,97 p    casi un período por cuadro: **se ve quieto**

     Eso explica de una vez los tres reportes históricos que nadie pudo cerrar
     —"no hay continuidad", "gira para el otro lado", "casi no se nota la
     dirección"— y explica por qué subir el pico siempre empeoraba: cuanto más
     alto, más cerca del período entero, y más quieto se ve.

     **16 px por cuadro = 0,46 p**, con margen para que los huecos entre días
     (44 px) también queden holgados. A 60 Hz son 960 px/s.

     ⚠️ El mínimo común denominador es **60 Hz**, que es el peor caso: los
     teléfonos van a 90 o 120 y ahí cada cuadro avanza la mitad o menos, o sea
     que el movimiento se lee todavía mejor. Como el avance se integra sobre
     el tiempo real, la velocidad en píxeles por segundo es la misma en todos. */
  /* La duración nominal baja de 4.600 a 3.800 porque ahora el giro tiene dos
     tiempos y el trinquete agrega los suyos: 3,5 s de vuelo más 1,2 s de tics
     dan 4,7 s en total, que es lo que duraba antes el giro entero. */
  /* `PISO` y `CAIDA` se fueron con la curva vieja: el piso era la velocidad
     mínima que sostenía el arrastre, y la caída el exponente de una potencia
     que ya no existe. La forma de hoy tiene dos números y están adentro de
     `velocidadGiro()`: cuánto dura el envión y cuánto aprieta el detente. */
  /* ── LA FÍSICA DEL GIRO: ROZAMIENTO VISCOSO + SECO (20/08) ──────────
     Modelo de la simulación del usuario, que reemplaza toda la curva por
     fracción de antes. Una rueda que se detiene por rozamiento se integra así,
     una vez por cuadro con `dt` REAL en segundos:

         vel *= Math.exp(-dt / GIRO_TAU);   // viscoso (del aire): dω/dt = −ω/τ
         vel -= GIRO_SECO * dt;             // seco (Coulomb): resta constante
         if (vel < 0) vel = 0;

     El término seco es lo que hace que **pare en tiempo finito** —el viscoso
     solo se arrastra hacia cero para siempre—, y por eso ya no hace falta el
     parche de "cortar cuando deja de verse". La banda es lineal, no un disco,
     así que todo va en **px/segundo** (no rad/s).

     PROHIBIDO `vel *= 0.98` por cuadro: depende de los FPS. La exponencial con
     `dt` real frena igual en toda máquina. `dt` se topea a 50 ms para que al
     volver de otra pestaña no pegue un salto.

     Manteniendo la forma de la rueda del usuario (v0/(α·τ)=17,83): con estos
     valores la banda para a los ~7,1 s tras recorrer ~71 marcas. Verificado
     contra la solución cerrada de dω/dt=−ω/τ−α, no contra la simulación.
     τ es la perilla del largo total; V0, la del pico (y del blur, a la par). */
  var GIRO_TAU    = 2.5;    // s    · constante de tiempo del rozamiento viscoso
  var GIRO_V0     = 1200;   // px/s · velocidad de largada = 20 px/cuadro de 60
  var GIRO_SECO   = 27;     // px/s²· rozamiento seco: detiene en tiempo finito
  var GIRO_PARADA = 6;      // px/s · umbral de detención (0,1 px/cuadro)
  var GIRO_RAMPA  = 150;    // ms   · el zafón: acelera de 0 a V0 al soltar

  /* ── EL TRINQUETE Y LA ENTREGA ──────────────────────────────────
     ⚠️ EL VUELO NO FRENA HASTA CERO, Y ÉSTE ERA EL FREEZE QUE QUEDABA
     (19/08). Reportado: *"anda al principio y al final, y en una parte antes
     del final se freeza"*.

     La causa era boba y estaba en el empalme: la curva del vuelo decaía
     linealmente **hasta cero** en f = 1, y el primer tic del trinquete recién
     arrancaba ahí. O sea que entre el vuelo y el trinquete quedaba un tramo de
     velocidad casi nula — el mismo arrastre de siempre, ahora escondido en la
     costura. Medido: **el 18 % del vuelo por debajo de 3 px por cuadro**.

     El vuelo tiene que **entregar la banda andando a la velocidad del primer
     tic**, no detenida. Ese número no se elige: sale de la propia definición
     del trinquete —un paso de marca en el tiempo del primer salto— así que se
     calcula de las constantes y no se puede desincronizar. Con eso el tramo
     lento baja al 2 %, que es sólo el zafón del arranque. */
  /* ⚠️ Y ACÁ ESTABAN LAS CONSTANTES DEL TRINQUETE (paso de marca, cuántos

     con él. El único número de esa familia que sobrevive —y que no hay que
     perder— es el techo estroboscópico: **el avance por cuadro no puede pasar
     de medio paso entre marcas**, o sea 17,5 px, y por eso el pico está en 16.
     Eso vive en el comentario de PICO, arriba. */

  /* ⚠️ `velocidadGiro(f)` y `UMBRAL_VISIBLE` se SACARON el 20/08: la
     velocidad ya no es una función de la fracción del giro, se integra cuadro
     por cuadro con el modelo de rozamiento de arriba. El catálogo de por qué
     se llegó hasta esa curva —y por qué la reemplaza la integración— está en
     `CRITERIOS-DISENO §4.13b`. */

  function soltarLaTira() {
    disparado = true;
    rodando = true;          /* la piel no se toca mientras gira */
    dial.classList.add('girando');   /* la tensión ahora la escribe el lazo */
    /* El estiramiento NO se suelta acá: se convierte en desplazamiento más
       abajo, apenas hay tira para absorberlo. Soltarlo antes hacía que la
       banda volviera al centro y RECIÉN ahí arrancara — se veía retroceder
       antes de salir, que es lo contrario de lo que hace una goma. */
    var estirado = 60;   /* debe coincidir con el translateX del CSS */
    aviso.textContent = '∞';
    dial.classList.add('tocando');
    app.classList.add('en-efecto');

    /* Se le saca el desplazamiento al navegador: el dedo TODAVÍA está
       apoyado —el gesto es sostener— y si no, el gesto y el giro mueven la
       misma tira y se pelean. Ver CRITERIOS-DISENO §4.11. */
    /* ⚠️ `touch-action` Y `overflow` NO PARAN UN GESTO YA EMPEZADO (19/08).
       El gesto es SOSTENER, así que cuando la tira se suelta el dedo todavía
       está apoyado y el navegador ya decidió que ese toque es un paneo. Un
       cambio de `touch-action` no lo revoca: rige para el PRÓXIMO gesto, no
       para el que está en curso. Lo mismo `overflow`.
       O sea que durante todo el giro el navegador desplazaba la tira por el
       dedo mientras el código la desplazaba por el suyo, y se peleaban. Es
       CRITERIOS-DISENO §4.11 —"ganaba el dedo"— y la solución anotada ahí no
       alcanzaba: se veía como traqueteo y como sentido de giro equivocado,
       exactamente lo reportado, y ninguna medición podía verlo porque no
       cuesta tiempo de hilo y la geometría da bien.
       Lo ÚNICO que corta un gesto táctil en curso es cancelar sus eventos, y
       para eso el escucha tiene que ser no pasivo. Se pone al empezar el giro
       y se saca al terminar: fuera del giro el desplazamiento del dial sigue
       siendo del navegador, con su inercia, que es mejor que cualquier
       imitación. */
    tira.addEventListener('touchmove', frenarDedo, { passive: false });
    tira.style.overflowX = 'hidden';
    tira.style.touchAction = 'none';
    tira.style.scrollSnapType = 'none';
    /* Y EL DIAL DEJA DE RESPONDER, entero, hasta que pase la ventana de
       efectos. Sin esto, al levantar el dedo el navegador dispara un
       `click` sobre la marca que quedó abajo: eso llama a `centrar()`, que
       hace un desplazamiento suave, y ESO FRENA EL GIRO en seco.
       Reportado: "al soltar el click se sigue actuando sobre el elemento y
       se frena el spin". */
    dial.style.pointerEvents = 'none';

    /* Se agregan las copias y se salta un período: la vista queda idéntica
       —la banda se repite— y aparece todo el recorrido a la derecha. */
    /* ⚠️ NO HAY SALTO DE PERÍODO, Y ÉSA ES LA CLAVE DE TODO (19/08).
       Acá estaba el "truco del carrusel": insertar las copias y saltar un
       período en el mismo cuadro, para que la pantalla no cambiara. Suena
       bien y es exactamente lo que rompía el efecto.

       En reposo, a la derecha de la aguja hay VACÍO —el espaciador, porque
       "hoy" es la última marca—. Después del salto de período, a la derecha
       hay banda. O sea que el salto convierte el vacío en marcas EN UN
       CUADRO: por eso "aparece la tira completa con todas las rayitas
       inmediatamente que se activa". No es cómo se mueven; es que el salto
       las trae ya adentro de cuadro.

       Sin el salto, la banda simplemente sigue de largo: primero se va la
       marca que estaba bajo la aguja, después cruza el hueco del espaciador
       —unos 130 px, que es la PAUSA que se venía pidiendo sin saber que era
       esto— y recién entonces las copias empiezan a cruzar el borde derecho
       de a una. Que es el dibujo que mandó el usuario:

           |   |    (hueco)       L |   |   |

       El precio es que hay que tener banda de sobra para todo el recorrido, y
       la hay: `prepararTira()` deja catorce copias, y el giro recorre unos
       4.500 px contra los ~6.000 que quedan disponibles. */
    /* ══════════════════════════════════════════════════════════════
       EL GIRO ATERRIZA EN EL TOPE — el mismo estado que en reposo (19/08)

       Pedido: *"la lógica al detenerse debe ser la misma que al iniciar; si va
       a quedar la última marca a la derecha, la tira al detenerse no debe
       dejar más marcas a la derecha"*. Y es correcto: hasta ahora el giro
       paraba donde lo dejaba la curva —con copias a la derecha— y el reacomodo
       ocurría recién en `anunciar()`, después del efecto. El estado final no
       era el de reposo, y había que arreglarlo a mano.

       La salida no es limpiar antes —ya se probó y se ve como que las marcas
       se borran solas—: es **no dejar nada que limpiar**. Si el giro termina
       exactamente contra el tope, lo que queda a la derecha es el espaciador,
       que es el mismo vacío de siempre.

       Dos cuentas:

         1. **Cuántas copias.** Se integra la curva —cuántos píxeles recorre
            por milisegundo, que es una constante de su forma— y se insertan
            las vueltas justas para cubrir el recorrido. Antes eran catorce
            fijas y sobraban diez.
         2. **Cuánto dura.** Lo que sobre o falte para caer justo en el tope se
            corrige **estirando el tiempo, no la velocidad** (decisión del
            usuario, 19/08): el pico se queda en 28 px por cuadro contra un
            techo medido de 35, que es el único número no negociable de la
            física del dial. La corrección es de ±10 % sobre 4,6 s — entre 4,2
            y 5,1 segundos—, que nadie percibe como duración y sí se nota como
            aterrizaje. */
    /* Y NUNCA SE ARRANCA SOBRE RESTOS DE OTRO GIRO. Si por lo que fuera
       quedaron copias de una vuelta anterior, se van acá: con ellas puestas,
       `prepararTira()` saldría temprano y este giro correría sobre una banda
       que no armó él —con el período, el tope y la duración calculados sobre
       otra geometría—. Es la misma familia del bug de arriba, por el otro
       extremo. */
    if (clonesTira.length) limpiarTira();

    /* Cuánto recorre la banda hasta parar: se integra el MISMO modelo del
       lazo una vez, para preparar la pista justa sin adivinar. Antes esto
       integraba `velocidadGiro` sobre la fracción; ahora es la distancia real
       del rozamiento, que es una constante de V0/τ/seco. */
    var distFisica = (function () {

    var grupos0 = tira.querySelectorAll('.dia-paradas');
    var periodo0 = grupos0[grupos0.length - 1].getBoundingClientRect().right

    var espaciador = tira.clientWidth * 0.5;
    /* ⚠️ Y LA PISTA SE DIMENSIONA CON EL FACTOR MEDIDO, NO CON LA CUENTA.
