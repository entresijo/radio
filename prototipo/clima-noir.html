<title>Clima · prototipo noir</title>
<meta name="description" content="El clima de cualquier lugar: ahora, por franjas del día y los próximos días.">
<style>

:root {
  --n-amarillo: #8F6B00; --n-naranja: #B85500; --n-rojo: #C0262B; --n-violeta: #7E2F96; --n-granate: #7E0023;
  color-scheme: light;

  --editado: #9A5B00; --editado-fondo: #FBEFD9; --aire: #BF2E1E;
  --ok: #17694A; --mal: #B3261E; --atencion: #8A5A00;
  --t-apertura: #C4D0D5; --t-apertura-txt: #12232B; --t-ahora: #A9BAC2; --t-ahora-txt: #12232B;
  --t-pronostico: #8FA5B0; --t-pronostico-txt: #12232B; --t-cierre: #D3DCE0; --t-cierre-txt: #12232B;

  --f-fwi: #e87ba4; --f-goes: #4a3aa7; --f-calculado: #475D68; --pron: #2B4A7E;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --n-amarillo: #F5C518; --n-naranja: #F59A3C; --n-rojo: #FF7A72; --n-violeta: #C99AD8; --n-granate: #E0708A;
    --papel: #0E1A20; --hoja: #15252D; --hoja2: #1B2E37; --tinta: #E6EEF1; --tinta2: #A4B6BE;
    --tinta3: #7F949E; --trazo: #2A424D; --acento: #58B6D1; --acento-tinta: #06222C;
    --editado: #E8B25A; --editado-fondo: #3A2C12; --aire: #EF6A5A;
    --ok: #5CC79C; --mal: #F0877D; --atencion: #E8B25A;
    --t-apertura: #2E444F; --t-apertura-txt: #E6EEF1; --t-ahora: #3D5764; --t-ahora-txt: #E6EEF1;
    --t-pronostico: #4E6C7A; --t-pronostico-txt: #E6EEF1; --t-cierre: #263A44; --t-cierre-txt: #E6EEF1;
    --f-ohmc: #3987e5; --f-weatherapi: #d95926; --f-openmeteo: #2bbfa0; --f-smn: #c98500;
    --f-fwi: #d55181; --f-goes: #9085e9; --f-calculado: #A4B6BE; --pron: #8FB0E6;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --n-amarillo: #F5C518; --n-naranja: #F59A3C; --n-rojo: #FF7A72; --n-violeta: #C99AD8; --n-granate: #E0708A;
  color-scheme: dark;
  --papel: #0E1A20; --hoja: #15252D; --hoja2: #1B2E37; --tinta: #E6EEF1; --tinta2: #A4B6BE;
  --tinta3: #7F949E; --trazo: #2A424D; --acento: #58B6D1; --acento-tinta: #06222C;
  --editado: #E8B25A; --editado-fondo: #3A2C12; --aire: #EF6A5A;
  --ok: #5CC79C; --mal: #F0877D; --atencion: #E8B25A;
  --t-apertura: #2E444F; --t-apertura-txt: #E6EEF1; --t-ahora: #3D5764; --t-ahora-txt: #E6EEF1;
  --t-pronostico: #4E6C7A; --t-pronostico-txt: #E6EEF1; --t-cierre: #263A44; --t-cierre-txt: #E6EEF1;
  --f-ohmc: #3987e5; --f-weatherapi: #d95926; --f-openmeteo: #2bbfa0; --f-smn: #c98500;
  --f-fwi: #d55181; --f-goes: #9085e9; --f-calculado: #A4B6BE; --pron: #8FB0E6;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.din { font-family: Bahnschrift, "DIN Alternate", "Segoe UI Semibold", "Segoe UI", sans-serif; }
.mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
.voz { font-family: Constantia, "Iowan Old Style", Georgia, serif; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }


.tope { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 8px 24px; background: var(--hoja); border-bottom: 1px solid var(--trazo); }
.marca { font-size: 14px; color: var(--tinta2); letter-spacing: .02em; }
.marca b { color: var(--tinta); font-weight: 600; font-size: 16px; }
.espacio { flex: 1; }
.nav { display: flex; gap: 2px; }
.nav a { padding: 6px 13px; border-radius: 7px; color: var(--tinta2); font-size: 15px; font-weight: 600; text-decoration: none; }
.nav a:hover { background: var(--hoja2); }
.nav a[aria-current="page"] { background: var(--acento); color: var(--acento-tinta); }
.maquina { display: inline-flex; align-items: center; gap: 6px; }
.maquina select { padding: 3px 6px; font-size: 12.5px; }
.segmentos { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--trazo); border-radius: 7px; overflow: hidden; background: var(--hoja); }
.segmentos button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; color: var(--tinta2); border-right: 1px solid var(--trazo); }
.segmentos button:last-child { border-right: 0; }
.segmentos button[aria-pressed="true"] { background: var(--acento); color: var(--acento-tinta); }


.senal { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: center; padding: 11px 16px; border-left: 7px solid var(--tinta3); margin-bottom: 12px; }
.senal.verde { border-left-color: var(--ok); }
.senal.ambar { border-left-color: var(--atencion); }
.senal.rojo { border-left-color: var(--mal); }
.senal-tit { font-size: 25px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.senal.verde .senal-tit { color: var(--ok); }
.senal.ambar .senal-tit { color: var(--atencion); }
.senal.rojo .senal-tit { color: var(--mal); }
.senal.gris .senal-tit { color: var(--tinta2); }
.senal-txt { font-size: 14px; color: var(--tinta2); }
.senal-txt b { color: var(--tinta); font-weight: 600; }
.mini-fuentes { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; }
.mini-fuente { border: 0; background: none; padding: 0; font-size: 12.5px; color: var(--tinta2); }
.mini-fuente:hover { color: var(--tinta); text-decoration: underline; }
.mini-fuente b { font-weight: 700; }
.mini-fuente.ok b { color: var(--ok); } .mini-fuente.atrasada b { color: var(--atencion); }
.mini-fuente.caida b { color: var(--mal); } .mini-fuente.desconocido b { color: var(--tinta3); }
.senal ul { grid-column: 2; margin: 3px 0 0; padding: 0 0 0 17px; font-size: 13.5px; }
.banda-alerta { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; margin-bottom: 12px; border-radius: 10px; background: var(--editado-fondo); color: var(--tinta); border: 1px solid var(--atencion); font-size: 15px; }
.banda-alerta b { color: var(--atencion); font-size: 16px; white-space: nowrap; }
.alerta-una + .alerta-una { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--trazo); }
.alerta-una summary { cursor: pointer; }
.alerta-horas { color: var(--tinta2); }
.alerta-texto { margin: 6px 0 2px; line-height: 1.45; }
.hoy-grid { display: grid; grid-template-columns: minmax(0, 2.5fr) minmax(0, 3.6fr) minmax(0, 3.3fr) minmax(0, 3fr); gap: 12px; margin-bottom: 12px; }
.temp-hoy { font-size: 34px; font-weight: 600; line-height: 1.1; }
@media (max-width: 1280px) {
  .hoy-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bloque-ahora { order: 1; }
  .bloque-hoy { order: 2; }
  .franjas-panel { order: 3; }
  .bloque-viene { order: 4; }
  .bloque-ayer { order: 5; }
}
.bloque { padding: 12px 16px; }
.bloque-eti { font-size: 12.5px; color: var(--tinta2); font-weight: 600; letter-spacing: .04em; margin: 0 0 6px; }
.bloque-eti span { font-weight: 400; letter-spacing: 0; }
.ahora { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.indicadores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--trazo); }
.indicador { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
.ind-ico { color: var(--acento); flex: none; margin-top: 2px; }
.datos-grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 10px 28px; }
.datos-grupo h4 { margin: 0 0 2px; font-size: 11.5px; font-weight: 600; color: var(--tinta3); }
.dato-fila { display: flex; gap: 7px; align-items: flex-start; padding: 4px 0; border-top: 1px solid var(--trazo); }
.dato-fila .ind-ico { color: var(--tinta2); margin-top: 0; }
.dato-txt { flex: 1; min-width: 0; }
.dato-txt .ind-eti { font-size: 13px; }
.dato-sub { font-size: 12px; color: var(--tinta3); line-height: 1.25; }
.nivel { font-weight: 700; }
.nivel-amarillo { color: var(--n-amarillo); }
.nivel-naranja { color: var(--n-naranja); }
.nivel-rojo { color: var(--n-rojo); }
.nivel-violeta { color: var(--n-violeta); }
.nivel-granate { color: var(--n-granate); }
.dato-val { font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bloque-datos { padding: 9px 14px; }
.bloque-datos .bloque-eti { font-size: 12px; margin-bottom: 5px; }
.aviso-loc { margin: 0 0 12px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--acento); font-size: 13.5px; color: var(--tinta2); }
.aviso-loc b { color: var(--tinta); }
.pie-datos { margin: 12px 0 0; text-align: center; }
.pie-datos a { color: var(--acento); }
.busca-pais { width: 100%; box-sizing: border-box; font-size: 15px; }
.busca-res { margin-top: 8px; max-height: 300px; overflow-y: auto; }
.busca-fila { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--trazo); background: none; color: var(--tinta); padding: 7px 6px; font-size: 14px; }
.busca-fila:hover { background: var(--trazo); }
.busca-fila small { color: var(--tinta3); font-size: 12px; }
#m-localidad { font-size: 14px; max-width: 190px; margin-left: 4px; }
#m-localidad[hidden] { display: none; }
.frases-cab { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 12px; }
.frases-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; align-items: start; }
.frases-lista { padding: 10px; max-height: calc(100vh - 215px); overflow-y: auto; position: sticky; top: 64px; }
.frases-lista h4 { margin: 10px 0 3px; font-size: 11.5px; font-weight: 600; color: var(--tinta3); }
.frases-lista button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--tinta); padding: 4px 8px; border-radius: 6px; font-size: 13.5px; }
.frases-lista button:hover { background: var(--trazo); }
.frases-lista button[aria-current="true"] { background: var(--acento); color: var(--acento-tinta); font-weight: 600; }
.frases-lista button.editada::after { content: "●"; color: var(--atencion); }
.frases-lista small { color: inherit; opacity: .7; font-size: 12px; }
.frases-busca { width: 100%; box-sizing: border-box; }
.frase-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: start; padding: 6px 0; border-top: 1px solid var(--trazo); }
.frase-txt { width: 100%; box-sizing: border-box; resize: vertical; font: inherit; font-size: 15px; line-height: 1.35; color: var(--tinta); }
.frase-fila .boton { padding: 4px 8px; font-size: 12.5px; }
.frases-pie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.campo-chip { font-size: 12px; color: var(--tinta2); border: 1px solid var(--trazo); border-radius: 5px; padding: 0 5px; margin-right: 4px; }
.frases-barra { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 14px; margin-top: 12px; }
@media (max-width: 900px) {
  .frases-grid { grid-template-columns: minmax(0, 1fr); }
  .frases-lista { position: static; max-height: 240px; }
  .frase-fila { grid-template-columns: minmax(0, 1fr) auto auto; }
  .frase-txt { grid-column: 1 / -1; }
}
.bloque-clic { cursor: pointer; transition: border-color .15s; }
.bloque-clic:hover { border-color: var(--acento); }
.franjas-panel { grid-column: 1 / -1; }
.franjas-panel[hidden] { display: none; }
.franjas { table-layout: fixed; }
.franjas th, .franjas td { padding: 6px; vertical-align: middle; white-space: normal; }
.franjas thead th { text-align: center; font-size: 14px; color: var(--tinta); }
.franjas thead th.fr-hoy { color: var(--acento); }
.franjas thead th:first-child { width: 92px; }
.franjas tbody th { font-size: 13px; color: var(--tinta); }
.franjas tbody th small { display: block; font-weight: 400; font-size: 11.5px; color: var(--tinta3); }
.franjas tbody tr:last-child th, .franjas tbody tr:last-child td { border-bottom: 0; }
.franjas td { text-align: center; border-left: 1px solid var(--trazo); }
.franjas td.fr-hoy { background: var(--hoja2); }
.franjas td.fr-ahora { box-shadow: inset 0 0 0 2px var(--acento); }
.franjas td.fr-pasada > * { opacity: .55; }
.fr-temp { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fr-temp svg { color: var(--acento); flex: none; }
.fr-sub { font-size: 12px; line-height: 1.3; color: var(--tinta2); margin-top: 1px; }
.fr-pico { font-weight: 700; color: var(--tinta); }
@media (max-width: 560px) {
  .franjas thead th:first-child { width: 62px; }
  .franjas th, .franjas td { padding: 5px 3px; }
  .fr-temp { font-size: 16px; gap: 3px; }
  .fr-temp svg { display: none; }
}
.cruda { margin-top: 12px; }
.cruda h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
.cruda table { font-size: 12.5px; }
.ind-por { color: var(--acento); flex: none; font-size: 27px; font-weight: 600; line-height: 1; }
.ind-hora { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--tinta2); margin-top: 2px; line-height: 1.2; }
.ind-hora svg { color: var(--acento); flex: none; }
.ind-val { font-size: 16.5px; font-weight: 600; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ind-val svg { vertical-align: -1px; color: var(--acento); }
.ind-eti { font-size: 12px; color: var(--tinta2); line-height: 1.25; }
.boletin-cab { display: flex; gap: 8px 16px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; margin-bottom: 4px; }
.boletin-plegable summary { display: flex; gap: 8px; align-items: baseline; list-style: none; }
.boletin-plegable summary::-webkit-details-marker { display: none; }
.flechita { color: var(--acento); font-size: 17px; line-height: 1; transition: transform .12s; display: inline-block; }
.boletin-plegable[open] .flechita { transform: rotate(90deg); }
.boletin-tit { font-size: 21px; line-height: 1.25; }
.boletin-txt { font-size: 16.5px; line-height: 1.45; white-space: pre-line; padding: 8px 0 2px 24px; max-width: 58em; }
.temp-grande { font-size: 60px; line-height: 1; font-weight: 600; }
.temp-ayer { font-size: 34px; line-height: 1.1; font-weight: 600; color: var(--tinta2); white-space: nowrap; }
.viene th { text-align: left; font-size: 12px; font-weight: 600; color: var(--tinta2); border: 0; border-bottom: 1px solid var(--tinta3); padding: 0 8px 3px 0; }
.chispa svg { display: block; width: 100%; height: auto; max-height: 84px; }
.cielo-txt { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; margin-top: 2px; white-space: nowrap; }
.cielo-txt svg { color: var(--acento); flex: none; }
.lecturas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 13.5px; color: var(--tinta2); }
.lecturas b { color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }
.viene { width: 100%; font-size: 14px; border-collapse: collapse; }
.viene td { padding: 2px 8px 2px 0; border: 0; border-bottom: 1px solid var(--trazo); white-space: nowrap; font-variant-numeric: tabular-nums; }
.viene tr:last-child td { border-bottom: 0; }
.viene td:first-child { font-weight: 600; width: 30%; }
.viene .t { font-weight: 600; font-size: 15px; }
.boletin-hoy { display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.boletin-hoy .voz { font-size: 22px; line-height: 1.25; flex: 1 1 420px; margin: 0; }
.enlace { border: 0; background: none; color: var(--acento); font-size: 13.5px; font-weight: 600; padding: 0; text-decoration: underline; }
.leer-seccion { padding: 5px 0; }
.leer-seccion.parrafo { margin-top: 12px; }
.leer-seccion .voz { font-size: 17px; line-height: 1.42; white-space: pre-line; }
.leer-eti { font-size: 11.5px; color: var(--tinta3); }
.dos { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 12px; align-items: start; margin-top: 12px; }
details > summary { cursor: pointer; }
.aviso-rec { margin: 0; padding: 7px 24px; background: #B3261E; color: #FFFFFF; font-size: 13.5px; font-weight: 600; display: flex; gap: 12px; align-items: center; }
.aviso-rec[hidden] { display: none; }
.aviso-rec button { border: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; border-radius: 6px; padding: 2px 9px; font-size: 12.5px; }
.ajustes-cab { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 12px; }
.boton { border: 1px solid var(--trazo); background: var(--hoja); border-radius: 7px; padding: 6px 12px; font-size: 13.5px; }
.boton:hover { border-color: var(--acento); }
.boton.fuerte { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); font-weight: 600; }
.boton[disabled] { opacity: .5; cursor: not-allowed; }

.rec { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--trazo); background: var(--hoja); color: var(--tinta2); border-radius: 7px; padding: 6px 11px; font-size: 13.5px; font-weight: 600; letter-spacing: .06em; }
.rec i { width: 10px; height: 10px; border-radius: 50%; background: var(--tinta3); }
.rec[aria-pressed="true"] { background: #B3261E; border-color: #B3261E; color: #FFFFFF; }
.rec[aria-pressed="true"] i { background: #FFFFFF; }
.modo-lectura { color: var(--tinta2); font-size: 12.5px; font-weight: 600; }
.modo-rec { color: var(--aire); font-size: 12.5px; font-weight: 600; }


.cinta-pie { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--tinta2); margin-bottom: 5px; }
.cinta { display: flex; gap: 2px; height: 44px; position: relative; }
.tramo { min-width: 3px; border: 0; padding: 0 5px; overflow: hidden; white-space: nowrap; text-align: left; font-size: 12px; line-height: 44px; border-radius: 2px; }
.tramo:first-child { border-radius: 5px 2px 2px 5px; }
.tramo:last-child { border-radius: 2px 5px 5px 2px; }
.tramo.Apertura { background: var(--t-apertura); color: var(--t-apertura-txt); }
.tramo.Ahora { background: var(--t-ahora); color: var(--t-ahora-txt); }
.tramo.Pronostico { background: var(--t-pronostico); color: var(--t-pronostico-txt); }
.tramo.Cierre { background: var(--t-cierre); color: var(--t-cierre-txt); }
.tramo:hover { filter: brightness(1.12); }
.regla { position: relative; height: 18px; margin-top: 3px; }

      wind_dir: RUMBOS_CORTOS[Math.round((c.wind_direction_10m || 0) / 45) % 8], pressure_mb: c.pressure_msl === undefined ? null : Math.round(c.pressure_msl), precip_mm: c.precipitation,
      last_updated: String(ahora).replace("T", " "), condicion: WMO[c.weather_code] || "" } };
  [["temp", "temperature_2m"], ["hum", "relative_humidity_2m"], ["nube", "cloud_cover"], ["viento", "wind_speed_10m"], ["rafaga", "wind_gusts_10m"], ["prob", "precipitation_probability"],
    ["lluvia", "precipitation"], ["cape", "cape"], ["cero", "freezing_level_height"], ["suelo", "soil_temperature_0cm"]].forEach(function (x) {
    v.horas[x[0]] = serie(h, x[1]);
  });
  if (hayValor(aire.us_aqi)) v.aire = { epa: epaDeAqi(aire.us_aqi), pm2_5: aire.pm2_5 };
  var dHoy = (di.time || []).indexOf(String(ahora).slice(0, 10));
  v.astro = { sale_sol: String((di.sunrise || [])[dHoy] || "").slice(11, 16), pone_sol: String((di.sunset || [])[dHoy] || "").slice(11, 16), fase: luna.nombre, iluminacion: luna.iluminacion };
  L.astro = { luna: luna };
  // El horario de la lluvia, con la regla del panel: lo que falta de hoy, con 0,3 mm o más.
  (h.time || []).forEach(function (t, k) {
    var mm = (h.precipitation || [])[k], pr = (h.precipitation_probability || [])[k], hh = parseInt(t.slice(11, 13), 10);
    if (t.slice(0, 10) === String(ahora).slice(0, 10) && hh > parseInt(hora.slice(11, 13), 10) && mm >= 0.3 && pr > (v.prob_pico || 0)) { v.prob_pico = pr; v.hora_pico = hh; }
  });
  return v;
}
// El gráfico del panel lee el historial y el pronóstico de la lectura: acá salen del mismo pedido.
function aLectura(V) {
  var h = V.horas, filas = [], acum = {}, ultimo = String(V.capturado).slice(0, 13);
  function col(n, t) { var c = (h[n] || []).filter(function (x) { return x[0] === t; })[0]; return c ? c[1] : ""; }
  (h.temp || []).forEach(function (x) {
    var t = x[0], f = t.slice(0, 10);
    acum[f] = (acum[f] || 0) + (parseFloat(col("lluvia", t)) || 0);
    if (t.slice(0, 13) <= ultimo) filas.push([f, t.slice(11, 13), x[1], col("hum", t), col("nube", t), col("viento", t), Math.round(acum[f] * 10) / 10]);
  });
  var dias = [], por = {};
  (h.temp || []).forEach(function (x) { var f = x[0].slice(0, 10); if (!por[f]) { por[f] = 1; dias.push(f); } });
  L.historial = { cols: ["fecha", "hora", "temp_om", "hum", "nube", "viento", "lluvia_dia"], filas: filas };
  L.pronostico = { capturado: V.capturado, horas: [], dias: diasDeHoras(V) };
  L.vivo = V;
}
function pintarVista() { pintar(); }
function hayValor(x) { return x !== null && x !== undefined; }

function pintar() {
  var v = vaciar($("vista"));
  $("m-lugar").textContent = UI.loc;
  vistaLugar(v);
  var g = el("section", { "class": "hoja bloque", style: "margin-top:12px", "aria-label": "Gráfico" });
  v.appendChild(g);
  grafico(g);
  v.appendChild(pieFuentes());
}
function pintarLeido() {
  $("m-leido").textContent = capturadoEn ? "Actualizado " + ("0" + new Date(capturadoEn).getHours()).slice(-2) + ":" + ("0" + new Date(capturadoEn).getMinutes()).slice(-2) : "";
}
function cargar(lugar) {
  UI.lugar = lugar;
  $("m-leido").textContent = "Consultando…";
  var pron = API + parametros({ latitude: lugar.lat, longitude: lugar.lon, timezone: "auto", past_days: 1, forecast_days: 7, wind_speed_unit: "kmh",
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code",
    hourly: "temperature_2m,relative_humidity_2m,dew_point_2m,precipitation_probability,precipitation,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index,visibility,cape,freezing_level_height,soil_temperature_0cm",
    daily: "sunrise,sunset" });
  var aire = AIRE + parametros({ latitude: lugar.lat, longitude: lugar.lon, timezone: "auto", current: "pm2_5,us_aqi" });
  return Promise.all([pedir(pron), pedir(aire).catch(function () { return null; }), estacionCerca(lugar)]).then(function (r) {
    UI.loc = lugar.nombre; UI.locVivo = aVivo(r[0], r[1]); UI.estacion = r[2]; capturadoEn = Date.now(); aLectura(UI.locVivo);
    try { localStorage.setItem("clima-lugar", JSON.stringify(lugar)); } catch (e) { /* solo es comodidad */ }
    pintar(); pintarLeido();
  }).catch(function () {
    if (UI.locVivo) { $("m-leido").textContent = "No se pudo actualizar: siguen los datos anteriores"; return; }
    var v = vaciar($("vista"));
    v.appendChild(el("section", { "class": "hoja bloque" }, [
      el("p", { text: "No se pudo consultar el pronóstico. Puede ser la conexión o que Open-Meteo no esté respondiendo." }),
      el("button", { "class": "boton", onclick: function () { cargar(lugar); } }, "Probar de nuevo")]));
    $("m-leido").textContent = "";
  });
}
function lugarGuardado() {
  try {
    var g = JSON.parse(localStorage.getItem("clima-lugar"));
    if (g && typeof g.lat === "number" && typeof g.lon === "number" && g.nombre) return g;
  } catch (e) { /* sin guardar, se usa el inicial */ }
  return LUGAR_INICIAL;
}
// La ubicación se pide con un botón: el navegador pregunta una sola vez y la página no la guarda en ningún
// servidor. Si ya se dio permiso antes, se usa sola al abrir. Necesita https: en http el botón no aparece.
function ubicar(si, no) {
  navigator.geolocation.getCurrentPosition(function (p) {
    cargar({ nombre: "Mi ubicación", lat: Math.round(p.coords.latitude * 100) / 100, lon: Math.round(p.coords.longitude * 100) / 100, propia: true });
    if (si) si();
  }, function () { if (no) no(); }, { timeout: 10000, maximumAge: 600000 });
}
function elegirLugar() {
  var mio = navigator.geolocation && window.isSecureContext ? el("button", { "class": "boton", onclick: function () {
    ubicar(cerrar, function () { mio.textContent = "No se pudo obtener la ubicación"; });
  } }, "Usar mi ubicación") : null;
  buscadorLugar(function (q) {
    return pedir(BUSCAR + parametros({ name: q, count: 12, language: "es", format: "json" })).then(function (r) {
      return (r.results || []).map(function (x) { return { nombre: [x.name, x.admin1].filter(Boolean).join(", "), sub: x.country || "", lat: x.latitude, lon: x.longitude }; });
    });
  }, function (x) { cerrar(); cargar({ nombre: x.nombre, lat: x.lat, lon: x.lon }); }, mio ? [mio] : []);
}
function arrancar() {
  $("b-actualizar").addEventListener("click", function () { cargar(lugarActual()); });
  $("b-lugar").addEventListener("click", elegirLugar);
  var b = $("b-ubicacion"), guardado = lugarGuardado();
  if (navigator.geolocation && window.isSecureContext) {
    b.hidden = false;
    b.addEventListener("click", function () { b.textContent = "Buscando…"; ubicar(function () { b.textContent = "Mi ubicación"; }, function () { b.textContent = "Sin permiso de ubicación"; }); });
  }
  cargar(guardado);
  if (guardado.propia && navigator.permissions && window.isSecureContext) navigator.permissions.query({ name: "geolocation" }).then(function (p) { if (p.state === "granted") ubicar(); }).catch(function () {});
  setInterval(function () { if (!document.hidden) cargar(lugarActual()); }, ACTUALIZAR_MIN * 60000);
}
function lugarActual() { return UI.lugar || lugarGuardado(); }
arrancar();
</script>
