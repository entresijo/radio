<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Entresijo · prototipo de escritorio</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700;800&display=swap" rel="stylesheet">
<!-- PROTOTIPO S7 · 12/11/2026. El portal de escritorio: el reproductor y el
     clima conviven como dos "widgets". Cada uno es su propia página metida en
     un marco, así que lo que se rompa en uno no toca al otro (independencia
     por capas). Sin cortes por ancho: si no entran lado a lado, se apilan
     solos (flex-wrap). El reproductor es el del prototipo, con el clima en el
     renglón del reloj; el de la derecha es el clima con piel noir. -->
<style>
  :root { --bg: #050505; --rojo: #b31b14; --rojo-osc: #80130f; --texto: #b8b2ae; --tenue: #5f5855; --borde: #1d1716; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto); font-family: Inter, -apple-system, "Segoe UI", sans-serif;
         min-height: 100vh; padding: 28px 16px 40px; }
  header { text-align: center; margin-bottom: 26px; }
  header h1 { color: var(--rojo); font-size: 20px; font-weight: 800; letter-spacing: .34em; }
  header p { color: var(--tenue); font-size: 10px; letter-spacing: .3em; text-transform: uppercase; margin-top: 8px; }
  .widgets { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px; max-width: 1240px; margin: 0 auto; }
  .widget { border: 1px solid var(--borde); border-radius: 18px; overflow: hidden; background: #000;
            box-shadow: 0 40px 90px rgba(0,0,0,.7); }
  .widget-rotulo { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--tenue);
                   padding: 10px 16px; border-bottom: 1px solid var(--borde); }
  .radio { flex: 0 0 auto; width: 400px; max-width: 100%; }
  .radio iframe { display: block; width: 100%; height: 820px; border: 0; }
  .clima { flex: 1 1 520px; max-width: 760px; }
  .clima iframe { display: block; width: 100%; height: 820px; border: 0; }
  footer { text-align: center; color: var(--tenue); font-size: 10px; letter-spacing: .2em; margin-top: 28px; text-transform: uppercase; }
</style>
</head>
<body>
  <header>
    <h1>ENTRESIJO</h1>
    <p>Radio serrana · Traslasierra · prototipo de escritorio</p>
  </header>
  <main class="widgets">
    <section class="widget radio" aria-label="Reproductor">
      <div class="widget-rotulo">Radio · en vivo</div>
      <iframe src="index.html" title="Entresijo Radio" allow="autoplay; geolocation"></iframe>
    </section>
    <section class="widget clima" aria-label="Clima">
      <div class="widget-rotulo">Clima · piel noir</div>
      <iframe src="clima-noir.html" title="Clima" allow="geolocation"></iframe>
    </section>
  </main>
  <footer>Prototipo · no es la versión publicada</footer>
</body>
</html>
