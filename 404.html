<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Entresijo Radio · Página no encontrada</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- [S7 · 12/11] La 404 la sirve GitHub Pages para cualquier dirección que no
     existe. Antes salía la genérica de GitHub, en inglés (AUDITORIA-SITIO).
     Autocontenida a propósito: sin fuentes ni hojas externas, así no depende
     de nada para decirle al oyente dónde está la radio. -->
<style>
  :root { --bg: #050505; --rojo: #b31b14; --rojo-osc: #80130f; --texto: #b8b2ae; --tenue: #6d6764; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--texto);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  main { max-width: 340px; }
  h1 { color: var(--rojo); font-size: 22px; font-weight: 700; letter-spacing: .32em; margin-bottom: 10px; }
  .bajada { color: var(--tenue); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 44px; }
  .cartel {
    display: inline-block; border: 1px solid var(--rojo-osc); border-radius: 4px;
    color: var(--tenue); font-size: 12px; font-weight: 700; letter-spacing: .3em;
    padding: 10px 18px; margin-bottom: 28px;
  }
  p { font-size: 15px; line-height: 1.5; margin-bottom: 32px; }
  a {
    color: var(--rojo); text-decoration: none; font-size: 13px; font-weight: 700;
    letter-spacing: .25em; text-transform: uppercase;
    border-bottom: 1px solid var(--rojo-osc); padding-bottom: 3px;
  }
  a:hover, a:focus-visible { color: #e0362c; outline: none; border-bottom-color: #e0362c; }
</style>
</head>
<body>
<main>
  <h1>ENTRESIJO RADIO</h1>
  <div class="bajada">Desde Traslasierra con amor</div>
  <div class="cartel">SIN SEÑAL EN ESTA DIRECCIÓN</div>
  <p>Esta página no existe. La radio sigue al aire en la principal.</p>
  <a href="/">Ir a la radio</a>
</main>
</body>
</html>
